---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-nginx-routing
  namespace: {{ .Release.Namespace }}
data:
  docs.conf: |
    upstream docs_backend {
        server 127.0.0.1:8000 fail_timeout=0;
    }

    upstream docs_frontend {
        server 127.0.0.1:3000 fail_timeout=0;
    }

    server {
        listen 8083;
        server_name localhost;
        charset utf-8;

        server_tokens off;

        client_max_body_size 50M;

        proxy_ssl_server_name on;

        location @proxy_to_docs_backend {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_redirect off;
            proxy_pass http://docs_backend;
        }

        location @proxy_to_docs_frontend {
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_redirect off;
            proxy_pass http://docs_frontend;
        }

        location / {
            try_files $uri @proxy_to_docs_frontend;
        }

        location /api {
            try_files $uri @proxy_to_docs_backend;
        }

        location /admin {
            try_files $uri @proxy_to_docs_backend;
        }

        location /static {
            try_files $uri @proxy_to_docs_backend;
        }

        location /oidc/ {
            try_files $uri @proxy_to_docs_backend;
        }

        location /accounts/ {
            try_files $uri @proxy_to_docs_backend;
        }

        location /collaboration/ws/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_pass http://127.0.0.1:4444;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;

            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Origin $http_origin;
            proxy_set_header Host $host;
        }

        location /collaboration/api/ {
            proxy_pass http://127.0.0.1:4444;
            proxy_set_header Host $host;
        }

        location /media/ {
            auth_request /media-auth;
            auth_request_set $authHeader $upstream_http_authorization;
            auth_request_set $authDate $upstream_http_x_amz_date;
            auth_request_set $authContentSha256 $upstream_http_x_amz_content_sha256;

            proxy_set_header Authorization $authHeader;
            proxy_set_header X-Amz-Date $authDate;
            proxy_set_header X-Amz-Content-SHA256 $authContentSha256;

            proxy_pass http://127.0.0.1:9000/docs-media-storage/;
            proxy_set_header Host 127.0.0.1:9000;

            add_header Content-Security-Policy "default-src 'none'" always;
        }

        location /media-auth {
            proxy_pass http://docs_backend/api/v1.0/documents/media-auth/;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Original-URL $request_uri;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Method $request_method;
        }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    server {
      listen 8080;
      access_log /opt/bitnami/openresty/nginx/logs/access.log;
      error_log /opt/bitnami/openresty/nginx/logs/error.log;

      client_max_body_size 50m;

      proxy_connect_timeout                          60s;
      proxy_send_timeout                             86400s;
      proxy_read_timeout                             86400s;
      proxy_set_header      host                      $host;
      proxy_set_header      x-forwarded-host          $http_host;
      proxy_set_header      x-real-ip                 $remote_addr;
      proxy_set_header      x-forwarded-for           $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_set_header upgrade $http_upgrade;
      proxy_set_header connection "upgrade";

      location /healthz {
          proxy_pass http://docs:8083/;
          proxy_connect_timeout 3s;
          proxy_read_timeout 5s;
          proxy_send_timeout 3s;
      }

      location / {
          proxy_pass http://docs:8083;
          proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
          proxy_connect_timeout 60s;
          proxy_read_timeout 86400s;
          proxy_send_timeout 86400s;
          client_max_body_size 50m;
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    io.kompose.service: docsingress
  name: docsingress
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: docsingress
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: docsingress
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
            - key: nginx.conf
              path: nginx.conf
      containers:
        - name: nginx
          image: "docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf

---
apiVersion: v1
kind: Service
metadata:
  name: docsingress
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: docsingress
  ports:
    - name: docsingress
      protocol: TCP
      port: 8080
      targetPort: 8080
