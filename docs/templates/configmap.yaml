{{- $docsDomainENV := split  ","  .Values.domain.docs -}}
{{- $docsDomain := index $docsDomainENV "_0" -}}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-env
  namespace: {{ .Release.Namespace }}
data:
  DJANGO_SETTINGS_MODULE: "impress.settings"
  DJANGO_CONFIGURATION: "Production"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_SECRET_KEY: "olares-docs-secret-change-me-in-production-{{ .Release.Namespace }}"

  PYTHONPATH: "/app"

  DB_HOST: "{{ .Values.postgres.host }}"
  DB_PORT: "{{ .Values.postgres.port }}"
  DB_NAME: "{{ .Values.postgres.databases.docsdb }}"
  DB_USER: "{{ .Values.postgres.username }}"
  DB_PASSWORD: "{{ .Values.postgres.password }}"

  REDIS_URL: "redis://:{{ .Values.redis.password }}@{{ .Values.redis.host }}:{{ .Values.redis.port }}/0"

  OIDC_RP_CLIENT_ID: "{{ .Values.oidc.client.id }}"
  OIDC_RP_CLIENT_SECRET: "{{ .Values.oidc.client.secret }}"
  OIDC_RP_SIGN_ALGO: "RS256"
  OIDC_RP_SCOPES: "openid email profile"
  OIDC_OP_JWKS_ENDPOINT: "{{ .Values.oidc.issuer }}/jwks"
  OIDC_OP_AUTHORIZATION_ENDPOINT: "{{ .Values.oidc.issuer }}/authorize"
  OIDC_OP_TOKEN_ENDPOINT: "{{ .Values.oidc.issuer }}/token"
  OIDC_OP_USER_ENDPOINT: "{{ .Values.oidc.issuer }}/userinfo"
  OIDC_OP_LOGOUT_ENDPOINT: "{{ .Values.oidc.issuer }}/logout"
  OIDC_CREATE_USER: "True"
  OIDC_STORE_ACCESS_TOKEN: "True"
  OIDC_STORE_REFRESH_TOKEN: "True"
  OIDC_STORE_ID_TOKEN: "True"
  OIDC_REDIRECT_REQUIRE_HTTPS: "True"
  OIDC_FALLBACK_TO_EMAIL_FOR_IDENTIFICATION: "True"

  LOGIN_REDIRECT_URL: "https://{{ $docsDomain }}"
  LOGIN_REDIRECT_URL_FAILURE: "https://{{ $docsDomain }}"
  LOGOUT_REDIRECT_URL: "https://{{ $docsDomain }}"
  OIDC_REDIRECT_ALLOWED_HOSTS: "{{ $docsDomain }}"

  DJANGO_CSRF_TRUSTED_ORIGINS: "https://{{ $docsDomain }}"
  DJANGO_CORS_ALLOWED_ORIGINS: "https://{{ $docsDomain }}"

  FRONTEND_HOMEPAGE_FEATURE_ENABLED: "true"

  IMPRESS_BASE_URL: "https://{{ $docsDomain }}"
  MEDIA_BASE_URL: "https://{{ $docsDomain }}"

  AWS_S3_ENDPOINT_URL: "http://127.0.0.1:9000"
  AWS_S3_ACCESS_KEY_ID: "minioadmin"
  AWS_S3_SECRET_ACCESS_KEY: "minioadmin"
  AWS_STORAGE_BUCKET_NAME: "docs-media-storage"

  COLLABORATION_API_URL: "http://127.0.0.1:4444/collaboration/api/"
  COLLABORATION_BACKEND_BASE_URL: "https://{{ $docsDomain }}"
  COLLABORATION_SERVER_ORIGIN: "https://{{ $docsDomain }}"
  COLLABORATION_SERVER_SECRET: "olares-docs-collab-secret"
  COLLABORATION_WS_URL: "wss://{{ $docsDomain }}/collaboration/ws/"
  COLLABORATION_WS_NOT_CONNECTED_READY_ONLY: "true"

  Y_PROVIDER_API_BASE_URL: "http://127.0.0.1:4444/api/"
  Y_PROVIDER_API_KEY: "olares-docs-yprovider-key"

  DJANGO_SERVER_TO_SERVER_API_TOKENS: "olares-docs-server-api-token"

  LOGGING_LEVEL_HANDLERS_CONSOLE: "INFO"
  LOGGING_LEVEL_LOGGERS_ROOT: "INFO"
  LOGGING_LEVEL_LOGGERS_APP: "INFO"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-yprovider-env
  namespace: {{ .Release.Namespace }}
data:
  COLLABORATION_SERVER_SECRET: "olares-docs-collab-secret"
  COLLABORATION_SERVER_ORIGIN: "https://{{ $docsDomain }}"
  COLLABORATION_BACKEND_BASE_URL: "http://127.0.0.1:8000"
  COLLABORATION_API_URL: "https://{{ $docsDomain }}/collaboration/api/"
  COLLABORATION_LOGGING: "true"
  Y_PROVIDER_API_KEY: "olares-docs-yprovider-key"
  Y_PROVIDER_API_BASE_URL: "http://127.0.0.1:4444/api/"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: docs-startup
  namespace: {{ .Release.Namespace }}
data:
  startup.sh: |
    #!/bin/sh
    set -e

    cleanup() {
      echo "=== Received shutdown signal, exiting ==="
      exit 0
    }
    trap cleanup TERM INT

    echo "=== Waiting for PostgreSQL ==="
    until python manage.py check --database default 2>/dev/null; do
      echo "  PostgreSQL not ready, retrying in 3s..."
      sleep 3 &
      wait $!
    done
    echo "  PostgreSQL is ready."

    echo "=== Running database migrations (phase 1: up to core.0026) ==="
    python manage.py migrate core 0026 --noinput

    echo "=== Handling extension-dependent migration (core.0027) ==="
    python manage.py migrate core 0027 --fake

    python << 'PYEOF'
    import os, psycopg

    conn = psycopg.connect(
        host=os.environ['DB_HOST'],
        port=os.environ['DB_PORT'],
        dbname=os.environ['DB_NAME'],
        user=os.environ['DB_USER'],
        password=os.environ['DB_PASSWORD'],
    )
    conn.autocommit = True
    cur = conn.cursor()

    cur.execute("CREATE EXTENSION IF NOT EXISTS pg_trgm SCHEMA public;")
    cur.execute("CREATE EXTENSION IF NOT EXISTS unaccent SCHEMA public;")

    cur.execute("""
    CREATE OR REPLACE FUNCTION public.f_unaccent(text)
    RETURNS text LANGUAGE sql IMMUTABLE PARALLEL SAFE STRICT AS
    $func$SELECT public.unaccent($1)$func$;
    """)

    cur.execute("""
    CREATE INDEX IF NOT EXISTS user_email_unaccent_trgm_idx
    ON impress_user USING gin (f_unaccent(email) gin_trgm_ops);
    """)

    cur.execute("""
    CREATE INDEX IF NOT EXISTS user_full_name_unaccent_trgm_idx
    ON impress_user USING gin (f_unaccent(full_name) gin_trgm_ops);
    """)

    conn.close()
    print('  Extension-dependent objects created successfully.')
    PYEOF

    echo "=== Running database migrations (phase 2: remaining) ==="
    python manage.py migrate --noinput

    echo "=== Waiting for MinIO ==="
    until wget -q --spider http://127.0.0.1:9000/minio/health/ready 2>/dev/null; do
      echo "  MinIO not ready, retrying in 3s..."
      sleep 3 &
      wait $!
    done
    echo "  MinIO is ready."

    echo "=== Creating S3 bucket ==="
    python -c "
    import boto3, botocore
    s3 = boto3.client(
        's3',
        endpoint_url='http://127.0.0.1:9000',
        aws_access_key_id='minioadmin',
        aws_secret_access_key='minioadmin',
    )
    try:
        s3.create_bucket(Bucket='docs-media-storage')
        print('  Bucket created.')
    except s3.exceptions.BucketAlreadyOwnedByYou:
        print('  Bucket already exists.')
    except Exception as e:
        print(f'  Bucket creation note: {e}')
    try:
        s3.put_bucket_versioning(
            Bucket='docs-media-storage',
            VersioningConfiguration={'Status': 'Enabled'},
        )
        print('  Versioning enabled.')
    except Exception as e:
        print(f'  Versioning note: {e}')
    " || true

    echo "=== Starting uvicorn ==="
    exec uvicorn \
      --app-dir=/app \
      --host=0.0.0.0 \
      --timeout-graceful-shutdown=300 \
      --limit-max-requests=20000 \
      --lifespan=off \
      impress.asgi:application
