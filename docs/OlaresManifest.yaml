olaresManifest.version: '0.10.0'
olaresManifest.type: app
metadata:
  name: docs
  description: A collaborative note taking, wiki and documentation platform that scales.
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  appid: docs
  version: '1.0.0'
  title: Docs
  categories:
  - Productivity_v112
  - Utilities
permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '4.8.2'
  fullDescription: |
    Docs is an open-source collaborative editor that helps teams write, organize, and share knowledge together - in real time.

    An open-source alternative to tools like Notion or Google Docs, focused on real-time collaboration, clean structured documents, knowledge organization, and data ownership.

    Features:
    - Rich-text & Markdown editing with slash commands and block system
    - Real-time collaboration with live cursors and presence
    - Comments and sharing with granular access control
    - Subpages and hierarchy for knowledge management
    - Import from .docx and .md
    - Export to .docx, .odt, .pdf
    - Optional AI writing helpers (rewrite, summarize, translate, fix typos)
    - Offline editing support
  developer: La Suite Numérique (DINUM / ZenDiS)
  website: https://docs.la-suite.eu/
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  requiredMemory: 768Mi
  limitedMemory: 2560Mi
  requiredDisk: 512Mi
  limitedDisk: 5Gi
  requiredCpu: 0.25
  limitedCpu: 1.5
  doc: https://github.com/suitenumerique/docs
  supportArch:
  - amd64
  - arm64
options:
  allowedOutboundPorts:
  - 80
  - 443
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.3-0'
  oidc:
    enabled: true
    redirectUri: /oidc/callback/
    entranceName: docs
entrances:
- name: docs
  port: 8080
  host: docsingress
  title: Docs
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  openMethod: window
  authLevel: internal
middleware:
  redis:
    namespace: docs
  postgres:
    username: docs
    databases:
    - name: docsdb
      distributed: false
      extensions:
      - pg_trgm
      - unaccent
