metadata:
  title: Docs
  description: 可扩展的协作笔记、Wiki 与文档平台。
spec:
  fullDescription: |
    Docs 是一款开源协作编辑器，帮助团队实时协同撰写、组织和共享知识。

    作为 Notion 或 Google Docs 的开源替代方案，专注于实时协作、结构化文档、知识管理和数据自主权。

    【核心功能】

    富文本与 Markdown 编辑：支持斜杠命令和块编辑系统
    实时协作：实时光标和在线状态显示
    评论与分享：细粒度的访问权限控制
    子页面与层级结构：构建知识体系
    导入支持：支持从 .docx 和 .md 格式导入
    导出支持：支持导出为 .docx、.odt、.pdf 格式
    AI 写作助手：改写、摘要、翻译、纠错（可选）
    离线编辑：支持离线使用
