olaresManifest.version: '0.12.0'
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiominutesxdemo
  icon: https://app.cdn.olares.com/appstore/llamacpp/icon.png
  description: Feishu-Minutes-style audio notes — diarized, word-timestamped transcripts with player sync, via the LLM Gateway.
  appid: audiominutesxdemo
  title: Audio Minutes X Demo
  version: '1.0.9'
  categories:
    - Utilities
permission:
  appData: true
spec:
  runAsUser: true
  versionName: '1.0.9'
  fullDescription: |
    Audio Minutes X Demo is a Feishu-Minutes (妙记) style app for turning meetings,
    lectures and audiobooks into interactive, searchable transcripts — all powered by
    the on-Olares audio models through the LLM Gateway.

    - Upload an audio or video file; it is normalized server-side (ffmpeg) and
      transcribed asynchronously, so progress survives page refreshes.
    - The transcript is speaker-diarized (who said what) and carries WORD-LEVEL
      timestamps (STT + forced alignment).
    - Two-way sync: click any word to jump the player there; while playing, the
      current word is highlighted and the transcript auto-scrolls.
    - A persistent library ("我的内容") keeps every processed recording.
    - Configure the LLM Gateway URL and pick which STT / align / diarization models to
      use, all in the app. If a required model is missing, the app tells you it cannot
      transcribe until it is configured.
  upgradeDescription: |
    1.0.9: 修复负载下整段转写「成段时间戳跳过~5分钟」——词级对齐新增抗降级防线:某窗在繁忙 GPU 下
    音频推进但文本几乎没消费(单元文本对不上稿件/时间被后挤)时,强制文本游标按字/秒追上音频,不再把
    陈旧文本喂给后一窗;每个对齐单元硬钳进本窗、空窗/降级窗自动重试并打诊断日志。修复逐词高亮「快冲一串
    再卡住」(burst-then-gap)——新增去 burst 平滑:保证每个词最小显示位、从邻近空档借时间并保留真停顿,
    高亮匀速推进。另:「转写设置」的「转写时翻译」改为常驻显示(不再随全局开关时隐时现),「显示译文」只要
    该记录有译文即可用;处理页转写阶段区分显示「整段转写 + 词级对齐」/「分段转写 + 词级对齐」。
    1.0.8: 修复整段转写长音频(>~5分钟)的时间戳塌陷——词级对齐改为按对齐器自身饱和点切窗
    (Qwen3-ForcedAligner 只在 ~270s 内可靠),每窗只保留可靠前缀、从最后一个可靠词续对后半段;
    修复长音频尾部「几十段全挤在同一秒」的致命 bug(饱和窗口上映射整段文本会让字符游标在重复词上
    越级跳到文本末尾,导致后半段音频从未对齐)——现只映射可靠前缀且限制前跳距离,时间戳全程单调递增。
    1.0.7: 修复大文件/视频上传偶发「upload network error」——上传请求改为落盘即回包(几毫秒),
    音频提取(ffmpeg)与时长探测(ffprobe)全部下沉到后台独立阶段,不再阻塞事件循环、不占转写时长；
    音频按扩展名兜底识别(修复 MIME 缺失/错误时被误当视频转码而卡住)；新增 multer 传输错误处理与
    服务端上传日志(便于定位)；前端上传报错更明确(区分“真断网”与“已传完但未响应,请刷新查看”)。
    1.0.6: 新增「创建片段」——按转写勾选一段/多段生成独立片段(精确重编码切割拼接、飞书式片段编辑器、
    连续/非连续标识、回链原出处、视频片段自动首帧封面)；参与者颜色可自动分配/自选/编辑；
    音频「跳过空白」(播放与生成片段时剔除无人说话的空档，开启即提示总跳过时长，视频保留画面)；
    片段列表移入「片段」TAB(飞书式卡片/列表切换 + 创建入口)。
    1.0.5: 文字记录展示向飞书妙记靠拢(大段落合并、有标点按句编辑、只重排改动句时间轴)；
    参与者管理(增删、删除后其发言转“未知”待逐条重指派)、重新识别说话人(仅重跑分离并保留文字)；
    处理记录可单条删除/清空；「显示译文」改为按文件记忆；编辑进行中禁用重跑类操作，避免与自动保存冲突。
    1.0.4: 长音频整段转写彻底修复 —— 词级对齐自动分窗(避免网关 413)、时间戳贯穿全程(修复坍缩)；
    新增降噪增强(Enhance)、白天/夜晚主题、自定义背景图、文件卡大图/列表切换；界面处理记录(降噪/分窗/回退/翻译等事件与失败原因，不再黑箱)；
    英译中标点自动转全角；界面向飞书妙记靠拢(满屏宽度、视频窗口更大、转写更紧凑)；补翻译处理列表只显示翻译步骤。
    1.0.3: 转写/翻译支持手动「停止」；搜索命中高亮(区别于播放高亮)、支持跨词搜索并覆盖译文；
    中文按词/字渲染改为紧密排列(去除字/词间空隙)；译文分段的空格问题修复。
    1.0.2: 部署后无需手填 Cookie —— 透传浏览器 Olares 会话与 edge 注入的身份
    (X-BFL-USER) 到网关，console/数据面均可直接鉴权。chart 升级为 v3 结构。
    1.0.1: 词级高亮增强 —— 中文按词高亮(jieba 分词)+「词/字」切换，播放高亮不再跳字；
    段落合并、标点保留、对齐语言自动检测等改进。
    1.0.0: first release.
  developer: Olares
