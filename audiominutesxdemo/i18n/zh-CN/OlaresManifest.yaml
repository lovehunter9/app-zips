metadata:
  title: Audio Minutes X Demo
  description: 飞书妙记风格的音频笔记 —— 通过 LLM Gateway 生成带说话人分离与词级时间戳、并与播放器双向联动的转写。
spec:
  fullDescription: |
    Audio Minutes X Demo 是一款飞书妙记风格的应用，把会议、讲座和有声书变成可交互、
    可搜索的转写稿 —— 全部由 Olares 上的音频模型通过 LLM Gateway 驱动。

    - 上传音频或视频；服务端用 ffmpeg 归一化并异步转写，刷新页面进度不丢。
    - 转写稿带说话人分离（谁说了什么）以及词级时间戳（STT + 强制对齐）。
    - 双向联动：点击任意词即可跳转播放；播放时高亮当前词并自动滚动。
    - 「我的内容」持久化保存每一条已处理的记录。
    - 在应用内配置 LLM Gateway 地址并选择 STT / 对齐 / 说话人分离模型；
      若缺少必需模型，应用会提示无法转写，直到配置完成。
  upgradeDescription: |
    1.0.4：长音频整段转写彻底修复 —— 词级对齐自动分窗（避免网关 413）、时间戳贯穿全程（修复坍缩）；
    新增降噪增强（Enhance）、白天/夜晚主题、自定义背景图、文件卡大图/列表切换；界面处理记录（降噪/分窗/回退/翻译等事件与失败原因，不再黑箱）；
    英译中标点自动转全角；界面向飞书妙记靠拢（满屏宽度、视频窗口更大、转写更紧凑）；补翻译处理列表只显示翻译步骤。
    1.0.3：转写/翻译支持手动「停止」；搜索命中高亮（区别于播放高亮）、支持跨词搜索并覆盖译文；
    中文按词/字渲染改为紧密排列（去除字/词间空隙）；译文分段空格问题修复。
    1.0.2：部署后无需手填 Cookie —— 透传浏览器 Olares 会话与 edge 注入的身份
    (X-BFL-USER) 到网关，console 与数据面均可直接鉴权。chart 升级为 v3 结构。
    1.0.1：词级高亮增强 —— 中文按词高亮（jieba 分词）+「词/字」切换，播放高亮不再跳字。
    1.0.0：首个版本。
