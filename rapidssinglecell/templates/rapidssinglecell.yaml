apiVersion: apps/v1
kind: Deployment
metadata:
  name: rapidssinglecell
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: rapidssinglecell
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: rapidssinglecell
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: rapidssinglecell
        bytetrade.io/terminal: rapidssinglecell
    spec:
      containers:
        - name: rapidssinglecell
          image: ghcr.io/scverse/rapids_singlecell:v0.14.0
          command: ["/bin/bash", "-i"]
          resources:
            limits:
              cpu: 20000m
              memory: 24Gi
              nvidia.com/gpu: 1
            requests:
              cpu: 7000m
              memory: 15Gi
              nvidia.com/gpu: 1
          securityContext:
            privileged: true
            capabilities:
              add: [ "SYS_ADMIN" ]
          ports:
            - containerPort: {{ .Values.port | default 3000 }}
              protocol: TCP
            - containerPort: 49100
              protocol: TCP
            - containerPort: 47998
              protocol: UDP
          volumeMounts:
            - mountPath: /workspace
              name: rapidssinglecell-data
      restartPolicy: Always
      volumes:
        - name: rapidssinglecell-data
          hostPath:
            type: DirectoryOrCreate
                {{- if .Values.sysVersion }}
                  {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: '{{ .Values.userspace.appCache }}'
                  {{- else }}
            path: '{{ .Values.userspace.appCache }}/rapidssinglecell'
                  {{- end }}
                {{- else }}
            path: '{{ .Values.userspace.appCache }}/rapidssinglecell'
                {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: rapidssinglecell
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: rapidssinglecell
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: {{ .Values.port | default 3000 }}
      targetPort: {{ .Values.port | default 3000 }}
      protocol: TCP
    - name: "49100"
      port: 49100
      targetPort: 49100
      protocol: TCP
    - name: "47998"
      port: 47998
      targetPort: 47998
      protocol: UDP
  selector:
    io.kompose.service: rapidssinglecell
status:
  loadBalancer: {}
