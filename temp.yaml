apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: extensions
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      containers:
        - env:
            - name: TZ
              value: Europe/Paris
            - name: CRON_MIN
              value: "3,33"
            - name: TRUSTED_PROXY
              value: 172.16.0.1/12 192.168.0.1/16
            - name: ADMIN_EMAIL
              value: admin@example.net
            - name: ADMIN_PASSWORD
              value: freshrss
            - name: ADMIN_API_PASSWORD
              value: freshrss
            - name: BASE_URL
              value: https://freshrss.example.net
            - name: SERVER_DNS
              value: freshrss.example.net
            - name: DB_HOST
              value: freshrss-db
            - name: DB_BASE
              value: freshrss
            - name: DB_USER
              value: freshrss
            - name: DB_PASSWORD
              value: freshrss
          image: freshrss/freshrss:latest
          livenessProbe:
            exec:
              command:
                - cli/health.php
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 75
            timeoutSeconds: 10
          name: freshrss
          ports:
            - containerPort: 80
          volumeMounts:
            - mountPath: /var/www/FreshRSS/data
              name: data
            - mountPath: /var/www/FreshRSS/extensions
              name: extensions
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: extensions
          persistentVolumeClaim:
            claimName: extensions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: freshrss-db
  template:
    metadata:
      labels:
        app: freshrss-db
    spec:
      containers:
        - command:
            - -c
            - shared_buffers=1GB
            - -c
            - work_mem=32MB
          env:
            - name: POSTGRES_DB
              value: freshrss
            - name: POSTGRES_USER
              value: freshrss
            - name: POSTGRES_PASSWORD
              value: freshrss
          image: postgres:18
          name: freshrss-db
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: db
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: db
---
apiVersion: v1
kind: Service
metadata:
  name: freshrss-service
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 80
  selector:
    app: freshrss
---
