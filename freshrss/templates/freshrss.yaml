{{- $freshrssDomainENV := split  ","  .Values.domain.freshrss -}}
{{- $freshrssDomain := index $freshrssDomainENV "_0" -}}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: freshrss
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: freshrss
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: freshrss
    spec:
      initContainers:
        - name: pre-config
          image: docker.io/beclab/freshrss-freshrss:1.28.0 # busybox:1.36
          command:
            - sh
            - -c
            - |
              # 启用详细错误追踪并强制重定向所有输出到标准输出
              set -euxo pipefail
              exec &> /proc/1/fd/1

              echo "🚀 初始化开始"

              # 创建并授权所有必要目录
              for dir in favicons tokens cache users extensions; do
              mkdir -p /var/www/FreshRSS/data/$dir
              chown -R www-data:www-data /var/www/FreshRSS/data/$dir
              chmod -R 775 /var/www/FreshRSS/data/$dir
              echo "✅ 目录处理完成: $dir"
              done

              # 创建用户专用目录（包括系统目录）
              # mkdir -p /var/www/FreshRSS/data/users/{{ .Values.olaresEnv.ADMIN_NAME }}
              # mkdir -p /var/www/FreshRSS/data/users/_
              #for user_dir in {{ .Values.olaresEnv.ADMIN_NAME }} _; do
              #chown -R www-data:www-data /var/www/FreshRSS/data/users/$user_dir
              #chmod -R 775 /var/www/FreshRSS/data/users/$user_dir
              #echo "✅ 用户目录处理完成: $user_dir"
              #done

              # 终极错误保护安装逻辑
              install_output=$(php /var/www/FreshRSS/cli/do-install.php \
              --default-user {{ .Values.olaresEnv.ADMIN_NAME }} \
              --environment production \
              --base-url 'https://{{ $freshrssDomain }}' \
              --language en \
              --title 'FreshRSS' \
              --allow-anonymous false \
              --allow-anonymous-refresh false \
              --auth-type form \
              --api-enabled true \
              --allow-robots false \
              --disable-update false \
              --db-type pgsql \
              --db-host '{{ .Values.postgres.host }}' \
              --db-user '{{ .Values.postgres.username }}' \
              --db-password '{{ .Values.postgres.password }}' \
              --db-base '{{ .Values.postgres.databases.freshrssdb }}' \
              --db-prefix freshrss_ 2>&1)

              install_status=$?

              # 增强型错误分类处理
              if [ $install_status -eq 3 ]; then  # 对应EXIT_CODE_ALREADY_EXISTS
              echo "⚠️ 检测到已安装: FreshRSS (代码: 3)"
              echo "详细错误信息: $install_output"
              echo "🚨 继续执行后续操作"
              elif [ $install_status -ne 0 ]; then
              echo "❌ 安装失败 (代码: $install_status): $install_output"
              echo "🚨 继续执行后续操作"
              else
              echo "✅ 安装成功: $install_output"
              fi

              # 带错误保护的用户创建逻辑
              user_output=$(php /var/www/FreshRSS/cli/create-user.php \
              --user {{ .Values.olaresEnv.ADMIN_NAME }} \
              --password {{ .Values.olaresEnv.ADMIN_PASSWORD }} \
              --api-password {{ .Values.olaresEnv.ADMIN_API_PASSWORD }} \
              --email {{ .Values.olaresEnv.ADMIN_EMAIL }} 2>&1)

              user_status=$?

              # 增强型用户创建错误处理
              if [ $user_status -eq 3 ]; then
              echo "⚠️ 检测到用户已存在: {{ .Values.olaresEnv.ADMIN_NAME }}"
                echo "详细错误信息: $user_output"
              echo "🚨 继续执行后续操作"
              elif [ $user_status -ne 0 ]; then
              echo "❌ 用户创建失败 (代码: $user_status): $user_output"
              echo "🚨 继续执行后续操作"
              else
              echo "✅ 用户创建成功: $user_output"
              fi

              # 强制标记初始化完成
              echo "🚨 所有初始化步骤完成"
              exit 0
          volumeMounts:
            - name: freshrss-data
              mountPath: /var/www/FreshRSS/data
              subPath: data
      containers:
        - name: freshrss
          image: docker.io/beclab/freshrss-freshrss:1.28.0
          env:
             - name: TZ
               value: Europe/Paris
             - name: CRON_MIN
               value: "3,33"
             - name: TRUSTED_PROXY
               value: 172.16.0.1/12 192.168.0.1/16
             - name: ADMIN_EMAIL
               value: {{ .Values.olaresEnv.ADMIN_EMAIL }}
             - name: ADMIN_PASSWORD
               value: {{ .Values.olaresEnv.ADMIN_PASSWORD }}
             - name: ADMIN_API_PASSWORD
               value: {{ .Values.olaresEnv.ADMIN_API_PASSWORD }}
             - name: BASE_URL
               value: 'https://{{ $freshrssDomain }}'
             - name: SERVER_DNS
               value: {{ $freshrssDomain }}
             - name: DB_HOST
               value: {{ .Values.postgres.host }}
             - name: DB_BASE
               value: {{ .Values.postgres.databases.freshrssdb }}
             - name: DB_USER
               value: {{ .Values.postgres.username }}
             - name: DB_PASSWORD
               value: {{ .Values.postgres.password }}
{{/*          lifecycle:*/}}
{{/*            postStart:*/}}
{{/*              exec:*/}}
{{/*                command:*/}}
{{/*                  - sh*/}}
{{/*                    - -c*/}}
{{/*                    - |*/}}
{{/*                    php /var/www/FreshRSS/cli/do-install.php \*/}}
{{/*                    --default-user {{ .Values.olaresEnv.ADMIN_NAME }} \*/}}
{{/*                    --environment production \*/}}
{{/*                    --base-url 'https://{{ $freshrssDomain }}' \*/}}
{{/*                    --language en \*/}}
{{/*                    --title 'FreshRSS' \*/}}
{{/*                    --allow-anonymous false \*/}}
{{/*                    --allow-anonymous-refresh false \*/}}
{{/*                    --auth-type form \*/}}
{{/*                    --api-enabled true \*/}}
{{/*                    --allow-robots false \*/}}
{{/*                    --disable-update false \*/}}
{{/*                    --db-type pgsql \*/}}
{{/*                    --db-host '{{ .Values.postgres.host }}' \*/}}
{{/*                    --db-user '{{ .Values.postgres.username }}' \*/}}
{{/*                    --db-password '{{ .Values.postgres.password }}' \*/}}
{{/*                    --db-base '{{ .Values.postgres.databases.freshrssdb }}' \*/}}
{{/*                    --db-prefix freshrss_*/}}
{{/*                    php /var/www/FreshRSS/cli/create-user.php \*/}}
{{/*                    --user {{ .Values.olaresEnv.ADMIN_NAME }} \*/}}
{{/*                    --password {{ .Values.olaresEnv.ADMIN_PASSWORD }} \*/}}
{{/*                    --api-password {{ .Values.olaresEnv.ADMIN_API_PASSWORD }}*/}}
{{/*                    --email {{ .Values.olaresEnv.ADMIN_EMAIL }}*/}}
          livenessProbe:
            exec:
              command:
                - cli/health.php
            failureThreshold: 3
            initialDelaySeconds: 60
            periodSeconds: 75
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: freshrss-data
              mountPath: /var/www/FreshRSS/data
              subPath: data
            - name: freshrss-data
              mountPath: /var/www/FreshRSS/extensions
              subPath: extensions
{{/*            - name: freshrss-config*/}}
{{/*              mountPath: /var/www/FreshRSS/readonly/config.custom.php*/}}
{{/*              subPath: config.custom.php*/}}
{{/*            - name: freshrss-config*/}}
{{/*              mountPath: /var/www/FreshRSS/readonly/config-user.custom.php*/}}
{{/*              subPath: config-user.custom.php*/}}
      restartPolicy: Always
      volumes:
        - name: freshrss-data
          hostPath:
            type: DirectoryOrCreate
                {{- if .Values.sysVersion }}
                  {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: '{{ .Values.userspace.appCache }}'
                  {{- else }}
            path: '{{ .Values.userspace.appCache }}/freshrss'
                  {{- end }}
                {{- else }}
            path: '{{ .Values.userspace.appCache }}/freshrss'
                {{- end }}
{{/*        - name: freshrss-config*/}}
{{/*          configMap:*/}}
{{/*            name: freshrss-config*/}}
{{/*            items:*/}}
{{/*              - key: config.custom.php*/}}
{{/*                path: config.custom.php*/}}
{{/*              - key: config-user.custom.php*/}}
{{/*                path: config-user.custom.php*/}}
{{/*            defaultMode: 420*/}}

---
apiVersion: v1
kind: Service
metadata:
  name: freshrss
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: freshrss
spec:
  ports:
    - name: "80"
      protocol: TCP
      port: 80
      targetPort: 80
  selector:
    io.kompose.service: freshrss
status:
  loadBalancer: {}

