
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: bifrost
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: bifrost
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: bifrost
        bytetrade.io/terminal: bifrost
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - '-c'
          args:
            - |
              # config.json is a chart-managed, read-only ConfigMap mounted into the
              # bifrost container (re-rendered every deploy) -> NOT seeded here, so the
              # store declarations always follow the chart. We only ensure the writable
              # appData subdirs exist and are owned by the runtime user. The SQLite
              # config store (/app/data/config.db) and the CLI home (.cli-home) live on
              # this persistent appData volume and survive restart/upgrade/reinstall.
              mkdir -p /app/data/logs /app/data/.cli-home
              chown -R 1000:1000 /app/data
              chmod -R 755 /app/data
          resources: { }
          volumeMounts:
            - name: bifrost-data
              mountPath: /app/data
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
      containers:
        - name: bifrost
          image: docker.io/beclab/maximhq-bifrost:v1.5.11
          envFrom:
            - configMapRef:
                name: bifrost-env
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.port | default 3000 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.port | default 3000 }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: bifrost-data
              mountPath: /app/data
            # Chart-managed, read-only config.json (store wiring only). Mounted over
            # /app/data/config.json so it always reflects the chart and shadows any
            # stale file left on appData by older builds. User config (providers /
            # keys / governance) lives in the SQLite config store at
            # /app/data/config.db, which persists on the appData volume.
            - name: bifrost-config
              mountPath: /app/data/config.json
              subPath: config.json
              readOnly: true
        # Idle sidecar with node + @maximhq/bifrost-cli pre-installed. The in-app
        # Terminal (templates/terminal.yaml) execs into THIS container so users can
        # run `bifrost` to launch coding agents through the gateway. HOME lives on
        # the appData volume so ~/.bifrost (CLI config) persists across restarts.
        - name: cli
          image: docker.io/beclab/lovehunter9-bifrost-cli:0.0.1-test1
          command: ["tail", "-f", "/dev/null"]
          env:
            - name: HOME
              value: /app/data/.cli-home
            - name: BIFROST_BASE_URL
              value: http://localhost:{{ .Values.port | default 3000 }}
          workingDir: /app/data/.cli-home
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: bifrost-data
              mountPath: /app/data

      restartPolicy: Always
      volumes:
        - name: bifrost-data
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appData }}'
        - name: bifrost-config
          configMap:
            name: bifrost-config

---
apiVersion: v1
kind: Service
metadata:
  name: bifrost
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: bifrost
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: {{ .Values.port | default 3000 }}
      targetPort: {{ .Values.port | default 3000 }}
      protocol: TCP
  selector:
    io.kompose.service: bifrost
status:
  loadBalancer: {}

---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-bifrost
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: bifrost
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: 80
      targetPort: {{ .Values.port | default 3000 }}
  selector:
    io.kompose.service: bifrost
status:
  loadBalancer: {}
