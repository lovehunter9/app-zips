
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bifrost
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: bifrost
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: bifrost
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: bifrost
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-permissions
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - '-c'
          args:
            - |
              mkdir -p /app/data/logs
              # Seed the gateway config.json ONCE from the chart default if absent. The
              # file then lives on the writable appData volume; the next init step
              # (config-wiring) keeps the infra/store blocks in sync with the chart.
              if [ ! -f /app/data/config.json ]; then
                cp /etc/bifrost-default/config.json /app/data/config.json
              fi
              chown -R 1000:1000 /app/data
              chmod -R 755 /app/data
          resources: { }
          volumeMounts:
            - name: bifrost-data
              mountPath: /app/data
            # Read-only source for the one-time config.json seed above.
            - name: bifrost-config
              mountPath: /etc/bifrost-default
              readOnly: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
        # Surgically reconcile ONLY the chart-owned infra/store wiring on every deploy,
        # so an upgrade can change backends (e.g. an old Postgres config_store ->
        # SQLite) WITHOUT clobbering the user's own content. config_store / logs_store /
        # vector_store are force-set from the chart default (the ConfigMap is the single
        # source of truth); `providers`, `client`, and any other user edits are kept.
        # Runs as the runtime user (1000) so the file stays user-owned and editable.
        - name: config-wiring
          image: "docker.io/beclab/harveyff-utils-jq:v0.0.1"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - '-c'
          args:
            - |
              set -e
              DEF=/etc/bifrost-default/config.json
              CFG=/app/data/config.json
              TMP=/app/data/.config.json.tmp
              # If the user broke the JSON, fall back to the chart default rather than
              # bricking startup.
              if ! jq empty "$CFG" >/dev/null 2>&1; then
                echo "config.json is not valid JSON; restoring chart default."
                cp "$DEF" "$CFG"
              fi
              # Pull the canonical store blocks from the chart default and force them in.
              jq \
                --argjson cs "$(jq -c '.config_store' "$DEF")" \
                --argjson ls "$(jq -c '.logs_store' "$DEF")" \
                --argjson vs "$(jq -c '.vector_store' "$DEF")" \
                '.config_store=$cs | .logs_store=$ls | .vector_store=$vs' \
                "$CFG" > "$TMP"
              mv "$TMP" "$CFG"
              echo "----- reconciled store wiring in config.json -----"
              jq '{config_store,logs_store,vector_store}' "$CFG"
          resources: { }
          volumeMounts:
            - name: bifrost-data
              mountPath: /app/data
            - name: bifrost-config
              mountPath: /etc/bifrost-default
              readOnly: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      containers:
        - name: bifrost
          image: docker.io/beclab/maximhq-bifrost:v1.5.13
          envFrom:
            - configMapRef:
                name: bifrost-env
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.port | default 3000 }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.port | default 3000 }}
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            # config.json is seeded once onto this volume by the init container and is
            # user-editable (no read-only mount); the gateway reads it from app-dir.
            - name: bifrost-data
              mountPath: /app/data

      restartPolicy: Always
      volumes:
        - name: bifrost-data
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appData }}'
        - name: bifrost-config
          configMap:
            name: bifrost-config

---
apiVersion: v1
kind: Service
metadata:
  name: bifrost
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: bifrost
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: {{ .Values.port | default 3000 }}
      targetPort: {{ .Values.port | default 3000 }}
      protocol: TCP
  selector:
    io.kompose.service: bifrost
status:
  loadBalancer: {}

---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-bifrost
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: bifrost
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: 80
      targetPort: {{ .Values.port | default 3000 }}
  selector:
    io.kompose.service: bifrost
status:
  loadBalancer: {}
