apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-config
  namespace: {{ .Release.Namespace }}
data:
  # Gateway store-wiring only. Mounted READ-ONLY into the bifrost container at
  # /app/data/config.json and re-rendered every deploy, so the store declarations
  # always follow the chart (and shadow any stale file left on appData by older
  # builds). Users do NOT edit this file — providers / keys / model allow-lists are
  # configured in the Web UI and persist in the SQLite config store (config.db).
  #
  # IMPORTANT — why config_store is SQLite on /app/data (NOT Postgres):
  # Verified on-platform that Olares WIPES an app's middleware Postgres database on
  # uninstall+reinstall (even "keep data") — only /app/data (appData) survives. So
  # provider/key/governance config (the precious user data) MUST live on appData to
  # survive a reinstall. SQLite config store at /app/data/config.db does exactly
  # that, while keeping the Web UI fully available (config_store stays enabled).
  # logs_store stays on Postgres (logs are heavy + analytical, fine to reset on
  # reinstall); vector_store stays on Redis (cache). The password env.* refs below
  # are still needed for those two stores.
  config.json: |
    {
      "$schema": "https://www.getbifrost.ai/schema",
      "client": {
        "drop_excess_requests": false,
        "enable_logging": true
      },
      "config_store": {
        "enabled": true,
        "type": "sqlite",
        "config": {
          "path": "/app/data/config.db"
        }
      },
      "logs_store": {
        "enabled": true,
        "type": "postgres",
        "config": {
          "host": "{{ .Values.postgres.host }}",
          "port": "{{ .Values.postgres.port }}",
          "user": "{{ .Values.postgres.username }}",
          "password": "env.BIFROST_PG_PASSWORD",
          "db_name": "{{ .Values.postgres.databases.bifrostdb }}",
          "ssl_mode": "disable",
          "max_idle_conns": 5,
          "max_open_conns": 50
        }
      },
      "vector_store": {
        "enabled": true,
        "type": "redis",
        "config": {
          "addr": "{{ .Values.redis.host }}:{{ .Values.redis.port }}",
          "username": "",
          "password": "env.BIFROST_REDIS_PASSWORD",
          "db": 0,
          "pool_size": 10,
          "max_active_conns": 10,
          "min_idle_conns": 5,
          "max_idle_conns": 10
        }
      },
      "providers": {

      }
    }

  # Auto-launch the Bifrost CLI when the in-app Terminal opens. The terminal runs an
  # interactive NON-login bash (verified: $0=bash, no $ENV support), so this file is
  # mounted as the cli container's ~/.bashrc (/app/data/.cli-home/.bashrc). bash
  # sources it on entry -> runs `bifrost`; when the user quits the CLI they fall back
  # to this same bash. Guarded so nested shells don't relaunch. (Also mounted at
  # $ENV=/etc/bifrost/cli-profile as a POSIX-sh fallback; harmless if unused.)
  cli-profile: |
    case "$-" in
      *i*) ;;
      *) return 2>/dev/null ;;
    esac
    if [ -z "${BIFROST_CLI_STARTED:-}" ]; then
      export BIFROST_CLI_STARTED=1
      export PATH="/usr/local/bin:$PATH"
      # Wait until the terminal size has truly SETTLED before drawing the TUI. Two
      # failure modes we must avoid at once, and they pull in opposite directions:
      #   * "stale bottom line": bifrost starts, THEN a resize arrives -> Bubble Tea
      #     repaints and leaves garbage on the last row (a bifrost redraw bug we cannot
      #     fix). Avoidable only by starting AFTER all resizes are done.
      #   * "stuck small": bifrost starts at 80x24 and no later resize ever comes -> it
      #     stays cramped forever.
      # The only state that satisfies both is "size is final and no more resizes are
      # coming". We can't be told that, so we infer it: require the size to be WIDE
      # (cols > 80, i.e. grown past the 80x24 default) AND held UNCHANGED for ~1s. When a
      # new tab is created, tmux + the web terminal do a couple of resize cycles in the
      # first few hundred ms; a short stability window (the previous 0.3s) launched in
      # the middle of them. ~1s of no-change waits those cycles out. Slower by design
      # (~1s/tab) but stable; the already-good first tab is only ~0.7s slower, not broken.
      # Hard cap so a genuinely narrow (<=80 col) terminal never hangs.
      _i=0; _stable=0; _prev=""; _need=10; _max=100
      while [ "$_i" -lt "$_max" ]; do
        _sz=$(stty size 2>/dev/null)
        # shellcheck disable=SC2086
        set -- $_sz
        _rows="${1:-0}"; _cols="${2:-0}"
        case "$_rows$_cols" in
          ''|*[!0-9]*) _ok=0 ;;
          *) if [ "$_rows" -ge 1 ] && [ "$_cols" -gt 80 ]; then _ok=1; else _ok=0; fi ;;
        esac
        if [ "$_ok" = 1 ] && [ "$_sz" = "$_prev" ]; then
          _stable=$((_stable + 1))
        else
          _stable=0
        fi
        _prev="$_sz"
        [ "$_stable" -ge "$_need" ] && break
        _i=$((_i + 1)); sleep 0.1
      done
      unset _i _stable _prev _sz _need _max _rows _cols _ok
      clear
      bifrost
    fi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bifrost-env
  namespace: {{ .Release.Namespace }}
data:
  OPENAI_API_KEY: ""
  # ANTHROPIC_API_KEY: ""
  # Injected so the persisted config.json can reference secrets via env.* (re-rendered
  # every deploy -> survives credential rotation without rewriting the user's file).
  BIFROST_PG_PASSWORD: "{{ .Values.postgres.password }}"
  BIFROST_REDIS_PASSWORD: "{{ .Values.redis.password }}"
