apiVersion: apps/v1
kind: Deployment
metadata:
  name: isaaclab
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: isaaclab
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: isaaclab
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: isaaclab
    spec:
      containers:
        - name: isaaclab
          image: docker.io/beclab/nvidia-isaac-lab:2.3.0-amd64
          command: [ "/bin/bash" ]  # 移除-it参数
          args: [ "-c", "sleep infinity" ]  # 保持容器运行
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: PRIVACY_CONSENT
              value: "Y"
          resources:
            limits:
              cpu: 1900m
              memory: 64Gi
            requests:
              cpu: 1000m
              memory: 1.9Gi
          ports:
            - containerPort: {{ .Values.port | default 3000 }}
              protocol: TCP
            - containerPort: 49100
              protocol: TCP
            - containerPort: 47998
              protocol: UDP
          volumeMounts:
            - mountPath: /isaac-sim/kit/cache
              name: isaaclab-data
              subPath: kit-cache
            - mountPath: /root/.cache/ov
              name: isaaclab-data
              subPath: ov-cache
            - mountPath: /root/.cache/pip
              name: isaaclab-data
              subPath: pip-cache
            - mountPath: /root/.cache/nvidia/GLCache
              name: isaaclab-data
              subPath: glcache
            - mountPath: /root/.nv/ComputeCache
              name: isaaclab-data
              subPath: computecache
            - mountPath: /root/.nvidia-omniverse/logs
              name: isaaclab-data
              subPath: logs
            - mountPath: /root/.local/share/ov/data
              name: isaaclab-data
              subPath: data
            - mountPath: /root/Documents
              name: isaaclab-data
              subPath: documents
{{/*      hostNetwork: true*/}}
      restartPolicy: Always
      volumes:
        - name: isaaclab-data
          hostPath:
            type: DirectoryOrCreate
                {{- if .Values.sysVersion }}
                  {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: '{{ .Values.userspace.appCache }}'
                  {{- else }}
            path: '{{ .Values.userspace.appCache }}/isaaclab'
                  {{- end }}
                {{- else }}
            path: '{{ .Values.userspace.appCache }}/isaaclab'
                {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: isaaclab
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: isaaclab
spec:
  ports:
    - name: "{{ .Values.port | default 3000 }}"
      port: {{ .Values.port | default 3000 }}
      targetPort: {{ .Values.port | default 3000 }}
      protocol: TCP
    - name: "49100"
      port: 49100
      targetPort: 49100
      protocol: TCP
    - name: "47998"
      port: 47998
      targetPort: 47998
      protocol: UDP
  selector:
    io.kompose.service: isaaclab
status:
  loadBalancer: {}
