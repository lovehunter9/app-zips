{{- /* SINGLE-ENTRANCE FRONT (chart-level merge; same openresty ingress pattern as
       opencode / speaches / whisperwebuiv2).
       llm-init is download-only (control plane + /api/model-spec + dashboard on
       :8090, NO /v1 data plane); the official audio engine serves /v1/* on :8000.
       This ingress merges them behind ONE Service so the single public entrance is
       a complete base, like llamacppbase:
         "/v1/" -> official engine (inference)
         "/"    -> llm-init control plane / dashboard / /api/model-spec
       llm-init is NOT modified and stays download-only. */ -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "unknown" -}}
{{- $modelMode := $oe.MODEL_MODE | default "stt" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: {{ .Release.Namespace }}
data:
  nginx.conf: |
    server {
      listen 8080;
      access_log /opt/bitnami/openresty/nginx/logs/access.log;
      error_log /opt/bitnami/openresty/nginx/logs/error.log;

      # Audio uploads are large and transcription is slow.
      client_max_body_size 500m;

      proxy_buffering off;
      proxy_redirect off;
      proxy_connect_timeout                          60s;
      proxy_send_timeout                             3600s;
      proxy_read_timeout                             3600s;
      proxy_set_header      Host                      $host;
      proxy_set_header      X-Forwarded-Host          $http_host;
      proxy_set_header      X-Forwarded-Proto         $http_x_forwarded_proto;
      proxy_set_header      X-Real-IP                 $remote_addr;
      proxy_set_header      X-Forwarded-For           $proxy_add_x_forwarded_for;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Synthesize an OpenAI-style model list from the install-time MODEL_NAME so the
      # single entrance always exposes a working /v1/models for the LLM gateway,
      # regardless of what each engine's own /v1/models returns (offline mirrors can
      # 401/500 on HF-catalog-backed routes). Engine + llm-init untouched.
      location = /v1/models {
          default_type application/json;
          return 200 '{"object":"list","data":[{"id":"{{ $modelName }}","object":"model","created":0,"owned_by":"audiolabxv3","mode":"{{ $modelMode }}"}]}';
      }

      # OpenAI-compatible data plane -> the official audio engine.
      location /v1/ {
          resolver coredns.kube-system.svc.cluster.local valid=10s;
          proxy_pass http://audio-engine.{{ .Release.Namespace }}.svc.cluster.local:8000;
          proxy_next_upstream error timeout http_502 http_503 http_504;
          proxy_connect_timeout 60s;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
          client_max_body_size 500m;
      }

      # Everything else -> llm-init download-only control plane + dashboard:
      # /, /static/*, /livez, /readyz, /healthz, /api/* (model-spec, progress).
      location / {
          resolver coredns.kube-system.svc.cluster.local valid=10s;
          proxy_pass http://download-svc.{{ .Release.Namespace }}.svc.cluster.local:8090;
          proxy_connect_timeout 60s;
          proxy_read_timeout 600s;
          proxy_send_timeout 600s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: audiolabxv3ingress
  name: audiolabxv3ingress
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.workloads.audiolabxv3ingress.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: audiolabxv3ingress
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: audiolabxv3ingress
    spec:
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
            - key: nginx.conf
              path: nginx.conf
      containers:
        - name: nginx
          image: "docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: audiolabxv3ingress
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    io.kompose.service: audiolabxv3ingress
  ports:
    - name: ui
      protocol: TCP
      port: 8080
      targetPort: 8080
