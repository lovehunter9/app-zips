olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
metadata:
  name: audiolabxv3
  icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
  description: Generic audio-model base. llm-init downloads the model; a clone-selected engine serves it. STT/VAD/Diarize chosen at install via env.
  appid: audiolabxv3
  title: Audio Lab X V3
  version: '1.0.0'
  categories:
    - AI
# Single entrance -> the openresty ingress (audiolabxv3ingress), which internally
# merges llm-init (download-only control plane + /api/model-spec) and the official
# audio engine (/v1/*) so this one URL is a complete base, like llamacppbase.
entrances:
  - name: audiolabxv3
    port: 8080
    host: audiolabxv3ingress
    title: Audio Lab X V3
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
    openMethod: window
    authLevel: public
workloadReplicas:
  audiolabxv3: 1
  llminit: 1
  audiolabxv3ingress: 1
spec:
  versionName: '1.0.0'
  fullDescription: |
    **Generic audio-model base (greenfield `audiolabxv3`)**
    A shared app and generic *base*: it is NOT tied to any specific model or audio
    capability. What to serve is chosen entirely at install time through environment
    variables, so the same Helm chart can serve STT / VAD / Diarize behind any
    OpenAI-compatible audio engine.

    **HOW IT WORKS (llm-init download-only mode)**
    The llm-init sidecar runs with `ENGINE_KIND=""` (pure HuggingFace downloader):
    it pulls the configured model into the shared HF cache and exposes `/readyz` plus
    a progress dashboard on :8090. The engine container waits for llm-init `/readyz`,
    then loads the cached model and serves its OpenAI-compatible audio surface.

    **Model storage (App Common)**
    Model files go to the shared App Common store `appCommon/huggingface`,
    mounted at `/cache/hf/hub`. llm-init writes, the engine reads.

    **Clone form (4 required envs)**
    - `MODEL_SOURCE` — `hf://<repo>` (llm-init download spec).
    - `MODEL_NAME` — model id advertised to clients.
    - `MODEL_MODE` — `stt` / `vad` / `diar` (engine auto-derived from mode).
    - `AUDIO_REQUIRED_GPU_MEMORY` — `"0"` for CPU-only (VAD); STT: `8Gi`; Diar: `4Gi`.

    **Example clone sets**
    - STT:  MODEL_SOURCE=hf://Systran/faster-whisper-large-v3
      MODEL_NAME=Systran/faster-whisper-large-v3  MODEL_MODE=stt  AUDIO_REQUIRED_GPU_MEMORY=8Gi
    - VAD:  MODEL_SOURCE=hf://onnx-community/silero-vad
      MODEL_NAME=silero-v5  MODEL_MODE=vad  AUDIO_REQUIRED_GPU_MEMORY=0
    - Diar: MODEL_SOURCE=hf://pyannote/speaker-diarization-community-1
      MODEL_NAME=pyannote-community-1  MODEL_MODE=diar  AUDIO_REQUIRED_GPU_MEMORY=4Gi

  upgradeDescription: |
    v1.0.0: initial generic audio-model base. llm-init (download-only) + mode-mapped
    engine container. Model/mode chosen at clone; GPU optional (set GPU memory to 0 for CPU-only VAD).

  developer: beclab
  website: https://github.com/beclab/llm-init
  sourceCode: https://github.com/beclab/llm-init
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/beclab/llm-init

  accelerator:
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  - envName: MODEL_SOURCE
    required: true
    type: string
    editable: true
    applyOnChange: true
  - envName: MODEL_NAME
    required: true
    type: string
    editable: true
    applyOnChange: true
  - envName: MODEL_MODE
    required: true
    type: string
    editable: true
    applyOnChange: true
    options:
    - title: STT (offline)
      value: stt
    - title: VAD
      value: vad
    - title: Diarize
      value: diar
  - envName: ENGINE_IMAGE
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: ENGINE_PORT
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: ENGINE_ARGS
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ""
  - envName: ENGINE_HEALTH_PATH
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: LOG_LEVEL
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "debug"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: AUDIO_CPU_REQUEST
    required: true
    default: "500m"
    type: string
    editable: true
    applyOnChange: true
  - envName: AUDIO_MEMORY_REQUEST
    required: true
    default: "2Gi"
    type: string
    editable: true
    applyOnChange: true
  - envName: AUDIO_CPU_LIMIT
    required: true
    default: "6"
    type: string
    editable: true
    applyOnChange: true
  - envName: AUDIO_MEMORY_LIMIT
    required: true
    default: "18Gi"
    type: string
    editable: true
    applyOnChange: true
  - envName: AUDIO_REQUIRED_GPU_MEMORY
    required: true
    type: string
    editable: true
    applyOnChange: true
