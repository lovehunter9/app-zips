# audiolabxv3 — two-service audio base (STT/whisper on vLLM as scaffold).
# llm-init downloads MODEL_SOURCE into shared HF cache; audio-engine serves it.
# Real engine mapping lives in templates/engine.yaml (TWO images only: vLLM cu129 for
# stt; pyannote/torch for vad/diar/translate/embed/enhance). This compose is just the
# kompose scaffold. Refine after `chart from-compose` — see audiolabwv3 for the shape.
services:
  llm-init:
    image: docker.io/beclab/llm-init:v1.2.4
    ports:
      - "8090:8090"
    environment:
      ENGINE_KIND: ""
      PORT: "8090"
    labels:
      io.kompose.service: llm-init

  audio-engine:
    image: docker.io/beclab/vllm-vllm-openai:v0.23.0-cu129
    ports:
      - "8000:8000"
    labels:
      io.kompose.service: audio-engine
      olares.service.type: Entrance
