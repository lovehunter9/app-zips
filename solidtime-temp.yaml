---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
      - name: app
        image: solidtime/solidtime:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: solidtime-config
        volumeMounts:
        - name: app-logs
          mountPath: /var/www/html/storage/logs
        - name: app-storage
          mountPath: /var/www/html/storage/app
        livenessProbe:
          httpGet:
            path: /health-check/up
            port: 8000
        readinessProbe:
          httpGet:
            path: /health-check/up
            port: 8000
      volumes:
      - name: app-logs
        hostPath:
          path: ./logs
      - name: app-storage
        hostPath:
          path: ./app-storage

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
      - name: scheduler
        image: solidtime/solidtime:latest
        env:
        - name: CONTAINER_MODE
          value: scheduler
        envFrom:
        - configMapRef:
            name: solidtime-config
        volumeMounts:
        - name: app-logs
          mountPath: /var/www/html/storage/logs
        - name: app-storage
          mountPath: /var/www/html/storage/app
        livenessProbe:
          exec:
            command:
            - healthcheck
        readinessProbe:
          exec:
            command:
            - healthcheck
      volumes:
      - name: app-logs
        hostPath:
          path: ./logs
      - name: app-storage
        hostPath:
          path: ./app-storage

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: queue
  template:
    metadata:
      labels:
        app: queue
    spec:
      containers:
      - name: queue
        image: solidtime/solidtime:latest
        env:
        - name: CONTAINER_MODE
          value: worker
        - name: WORKER_COMMAND
          value: php /var/www/html/artisan queue:work
        envFrom:
        - configMapRef:
            name: solidtime-config
        volumeMounts:
        - name: app-logs
          mountPath: /var/www/html/storage/logs
        - name: app-storage
          mountPath: /var/www/html/storage/app
        livenessProbe:
          exec:
            command:
            - healthcheck
        readinessProbe:
          exec:
            command:
            - healthcheck
      volumes:
      - name: app-logs
        hostPath:
          path: ./logs
      - name: app-storage
        hostPath:
          path: ./app-storage

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: postgres
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: solidtime
        - name: POSTGRES_USER
          value: solidtime
        - name: POSTGRES_PASSWORD
          value: randompassword
        volumeMounts:
        - name: database-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: database-storage
        persistentVolumeClaim:
          claimName: database-storage

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotenberg
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gotenberg
  template:
    metadata:
      labels:
        app: gotenberg
    spec:
      containers:
      - name: gotenberg
        image: gotenberg/gotenberg:8
        ports:
        - containerPort: 3000
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
        readinessProbe:
          httpGet:
            path: /health
            port: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: app-service
spec:
  selector:
    app: app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer

---

apiVersion: v1
kind: Service
metadata:
  name: scheduler-service
spec:
  selector:
    app: scheduler
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---

apiVersion: v1
kind: Service
metadata:
  name: queue-service
spec:
  selector:
    app: queue
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000

---

apiVersion: v1
kind: Service
metadata:
  name: database-service
spec:
  selector:
    app: database
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432

---

apiVersion: v1
kind: Service
metadata:
  name: gotenberg-service
spec:
  selector:
    app: gotenberg
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

apiVersion: v1
kind: Secret
metadata:
  name: generated-keys
  namespace: default
type: Opaque
stringData:
  APP_KEY: ""
  PASSPORT_PRIVATE_KEY: ""
  PASSPORT_PUBLIC_KEY: ""

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      initContainers:
      - name: key-generator
        image: solidtime/solidtime:latest
        command: ["sh", "-c"]
        args:
          - >-
            php artisan self-host:generate-keys --output=/keys/ &&
            kubectl get secret generated-keys -o json |
            jq '.data.APP_KEY="'"$(cat /keys/APP_KEY | base64 -w 0)"'"' |
            kubectl apply -f - &&
            kubectl get secret generated-keys -o json |
            jq '.data.PASSPORT_PRIVATE_KEY="'"$(cat /keys/PASSPORT_PRIVATE_KEY | base64 -w 0)"'"' |
            kubectl apply -f - &&
            kubectl get secret generated-keys -o json |
            jq '.data.PASSPORT_PUBLIC_KEY="'"$(cat /keys/PASSPORT_PUBLIC_KEY | base64 -w 0)"'"' |
            kubectl apply -f -
        volumeMounts:
        - name: keys-storage
          mountPath: /keys/
        securityContext:
          privileged: true
      containers:
      - name: app
        image: solidtime/solidtime:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: solidtime-config
        - secretRef:
            name: generated-keys
        volumeMounts:
        - name: keys-storage
          mountPath: /keys/
        livenessProbe:
          httpGet:
            path: /health-check/up
            port: 8000
        readinessProbe:
          httpGet:
            path: /health-check/up
            port: 8000
      volumes:
      - name: keys-storage
        emptyDir:
          medium: Memory
      serviceAccountName: key-generator-sa

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: key-generator-sa
  namespace: default

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: key-generator-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: secret-editor
subjects:
- kind: ServiceAccount
  name: key-generator-sa
  namespace: default