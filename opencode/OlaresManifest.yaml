olaresManifest.version: '0.11.0'
olaresManifest.type: app
metadata:
  name: opencode
  icon: https://app.cdn.olares.com/appstore/opencode/icon.png
  description: The open source AI coding agent
  appid: opencode
  title: OpenCode
  version: '1.0.40'
  categories:
  - Developer Tools
  - Productivity_v112
permission:
  appData: true
  appCache: true
  userData:
  - Home
spec:
  versionName: '1.4.4'
  promoteImage:
  - https://app.cdn.olares.com/appstore/opencode/1.webp
  - https://app.cdn.olares.com/appstore/opencode/2.webp
  fullDescription: |
    OpenCode is an open-source agent that helps you write code in the terminal, IDE, or desktop.

    - Support LSPs to automatically load appropriate LSPs for LLMs
    - Multi-session Launch multiple agents in parallel in the same project
    - Share Link Share any session link for reference or debugging
    - GitHub Copilot Sign in with GitHub to use your Copilot account
    - ChatGPT Plus/Pro Login with OpenAI to use your ChatGPT Plus or Pro account
    - Arbitrary Models supports 75+ LLM providers with Models.dev, including native models
    - Any editor provides terminal interfaces, desktop applications, and IDE extensions

    Usage
    - Open the app and use the Web UI directly in your browser.
    - Configure your LLM provider and API keys in the Web UI.
    - Your code workspace is mounted at /home/opencode/workspace (linked to your Home/Code directory).
  upgradeDescription: |
    Config changes:
    - Add built-in oh-my-openagent (OMO) plugin
    - Add Terminal entrance with auto-start TUI
    Upgrade OpenCode version to 1.4.4

    What's Changed (v1.4.4):
    - Added Alibaba provider with caching; MCP OAuth connections now persist.
    - Snapshots fully respect .gitignore; sessions can update permissions mid-run.
    - Added `opencode export --sanitize` for PII-safe transcript export.
    - Plugins can register custom workspace adaptors.

    What's Changed (v1.4.3):
    Core:
    - Fixed agent create for OpenAI accounts authenticated with OAuth.
    - Interrupted Bash commands now keep their final output and truncation details instead of ending as aborted.
    - Added fast mode variants for supported Claude and GPT models.
    TUI:
    - Restored the hidden session scrollbar as the default.
    Extensions:
    - Added configurable OAuth redirect URIs for remote MCP servers. (@egze)

    Full release notes: https://github.com/anomalyco/opencode/releases/tag/v1.4.4

  developer: Anomaly
  website: https://opencode.ai/
  sourceCode: https://github.com/anomalyco/opencode
  submitter: Olares
  locale:
  - en-US
  - zh-CN
  doc: https://opencode.ai/docs
  license:
  - text: MIT
    url: https://github.com/anomalyco/opencode/blob/dev/LICENSE
  requiredMemory: 1792Mi
  limitedMemory: 6Gi
  requiredDisk: 5Gi
  limitedDisk: 15Gi
  requiredCpu: 0.3
  limitedCpu: 5
  supportArch:
  - amd64
  - arm64
envs:
  - envName: OPENCODE_OMO
    required: false
    applyOnChange: true
    type: bool
    editable: true
    default: "false"
    description: "Activate oh-my-opencode (OMO) multi-agent UI. The OMO package is always pre-installed; this toggle only controls whether the plugin is loaded at startup. Set to 'true' to enable the 4-agent OMO interface."
  - envName: OPENCODE_OMO_VERSION
    required: false
    applyOnChange: true
    type: string
    editable: true
    default: "3.17.4"
    description: "Pin the oh-my-opencode (OMO) npm package version installed at container startup. ALWAYS use a concrete semver (e.g. '3.17.4', '3.18.0'). DO NOT use 'latest' or other npm dist-tags — they cannot be compared as strings, so the init container will reinstall OMO on EVERY pod restart, adding 30-60s of startup time and consuming bandwidth. Find published versions at https://www.npmjs.com/package/oh-my-opencode. On change, the init container detects the mismatch and reinstalls automatically."
options:
  apiTimeout: 0
  allowedOutboundPorts:
  - 80
  - 443
  dependencies:
  - name: olares
    type: system
    version: '>=1.12.3-0'
entrances:
- name: opencode
  port: 8080
  host: opencodeingress
  title: OpenCode
  icon: https://app.cdn.olares.com/appstore/opencode/icon.png
  openMethod: window
  authLevel: internal
- name: opencodeterminal
  port: 8081
  host: opencodeingress
  title: OpenCode Terminal
  icon: https://app.cdn.olares.com/appstore/opencode/icon.png
  openMethod: window
  authLevel: internal
