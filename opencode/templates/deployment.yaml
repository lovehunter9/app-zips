---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: opencode
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: opencode
        bytetrade.io/terminal: opencode
    spec:
      initContainers:
        - name: init-chmod-data
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - "-c"
            - |
              mkdir -p /home/opencode/workspace /home/opencode/.opencode /home/opencode/.config/opencode
              chown -R 1000:1000 /home/opencode || true
              chmod -R 755 /home/opencode || true
          resources: {}
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0

      containers:
        - name: opencode
          # Official image from GitHub Container Registry
          # https://github.com/anomalyco/opencode/pkgs/container/opencode
          image: "ghcr.io/anomalyco/opencode:1.2.27"
          command: ["/bin/sh"]
          args: ["/etc/opencode/start.sh"]
          envFrom:
            - configMapRef:
                name: opencode-env
          env:
            - name: HOME
              value: /home/opencode
            - name: TERM
              value: xterm-256color
            {{- if .Values.olaresEnv }}
            {{- if .Values.olaresEnv.ANTHROPIC_API_KEY }}
            - name: ANTHROPIC_API_KEY
              value: "{{ .Values.olaresEnv.ANTHROPIC_API_KEY }}"
            {{- end }}
            {{- if .Values.olaresEnv.OPENAI_API_KEY }}
            - name: OPENAI_API_KEY
              value: "{{ .Values.olaresEnv.OPENAI_API_KEY }}"
            {{- end }}
            {{- end }}
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: 100m
              memory: 512Mi
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
            - name: startup-script
              mountPath: /etc/opencode/start.sh
              subPath: start.sh
              readOnly: true
            - name: bash-wrapper
              mountPath: /bin/bash
              subPath: bash
              readOnly: true
          # tcpSocket probe works for both modes:
          # - web mode: port 3000 is listening
          # - tui mode: probe fails but container stays alive via restartPolicy
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "[ \"$OPENCODE_MODE\" = 'tui' ] || nc -z 127.0.0.1 3000"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "[ \"$OPENCODE_MODE\" = 'tui' ] || nc -z 127.0.0.1 3000"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5

      restartPolicy: Always
      volumes:
        - name: opencode-home
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
        - name: opencode-workspace
          hostPath:
            path: "{{ .Values.userspace.userData }}/Code"
            type: DirectoryOrCreate
        - name: startup-script
          configMap:
            name: opencode-startup
            defaultMode: 0755
        - name: bash-wrapper
          configMap:
            name: bash-wrapper
            defaultMode: 0755

---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  ports:
    - name: web
      port: 3000
      targetPort: 3000
  selector:
    io.kompose.service: opencode
status:
  loadBalancer: {}
