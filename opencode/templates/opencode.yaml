---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: opencode
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: opencode
    spec:
      initContainers:
        - name: init-chmod-data
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - "-c"
            - |
              mkdir -p /home/opencode/workspace \
                       /home/opencode/.opencode \
                       /home/opencode/.config/opencode \
                       /home/opencode/.glibc-cache \
                       /home/opencode/.config/opencode/skills/web-preview
              SKILL="/home/opencode/.config/opencode/skills/web-preview/SKILL.md"
              printf '%s\n' \
                '---' \
                'name: web-preview' \
                'description: Preview web applications running in this environment' \
                '---' \
                '' \
                '## How to preview' \
                '' \
                'This environment has a built-in reverse-proxy.' \
                'Dev servers inside the container are reachable at /__preview/<port>/ on the same domain the user is already on.' \
                'The proxy passes the FULL request URI to the dev server, so the framework MUST set its base/public path to /__preview/<port>/.' \
                '' \
                '## Vite (React / Vue / Svelte / vanilla)' \
                '' \
                'ALWAYS pass --base and --host:' \
                '' \
                '```' \
                'npx vite --host 0.0.0.0 --port 5173 --base /__preview/5173/' \
                '```' \
                '' \
                'Or if the project uses npm scripts:' \
                '' \
                '```' \
                'npm run dev -- --host 0.0.0.0 --port 5173 --base /__preview/5173/' \
                '```' \
                '' \
                'If you scaffold a NEW Vite project, also add base to vite.config:' \
                '' \
                '```js' \
                'export default defineConfig({ base: "/__preview/5173/" })' \
                '```' \
                '' \
                '## Next.js' \
                '' \
                'Set basePath in next.config.js BEFORE starting:' \
                '' \
                '```js' \
                'module.exports = { basePath: "/__preview/3001" }' \
                '```' \
                '' \
                'Then start:' \
                '' \
                '```' \
                'npx next dev -H 0.0.0.0 -p 3001' \
                '```' \
                '' \
                '## Static HTML (no module bundler)' \
                '' \
                'Use Vite to serve static files too:' \
                '' \
                '```' \
                'npx vite --host 0.0.0.0 --port 5173 --base /__preview/5173/' \
                '```' \
                '' \
                '## Preview URL' \
                '' \
                'NEVER use localhost or 127.0.0.1 in any preview URL you show to the user.' \
                'The user opens OpenCode from a REMOTE browser.' \
                '' \
                'Tell the user:' \
                '"Append /__preview/<port>/ to your current OpenCode URL in the browser."' \
                '' \
                 'Example: if the user is on https://abc123.example.olares.cn, tell them:' \
                'https://abc123.example.olares.cn/__preview/5173/' \
                '' \
                '## CRITICAL rules' \
                '' \
                '- ALWAYS set --base /__preview/<port>/ (Vite) or basePath (Next.js). Without this, assets will 404.' \
                '- ALWAYS bind to 0.0.0.0, NEVER localhost or 127.0.0.1' \
                '- NEVER output http://localhost in any URL shown to the user' \
                '- The trailing slash after the port number is REQUIRED' \
                '- If a port is busy, pick another port and adjust --base accordingly' \
                '- Keep the dev server running in the foreground so it stays alive' \
                > "$SKILL"
              chown -R 1000:1000 /home/opencode/.opencode \
                                 /home/opencode/.config \
                                 /home/opencode/.glibc-cache
              chown 1000:1000 /home/opencode /home/opencode/workspace
          resources: {}
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
        - name: init-glibc
          image: "docker.io/beclab/alpine:3.20"
          command:
            - sh
            - "-c"
            - |
              ARCH=$(uname -m)
              if [ "$ARCH" != "x86_64" ]; then
                echo "=== Arch $ARCH: glibc fix not available, skipping ==="
                exit 0
              fi

              CACHE="/home/opencode/.glibc-cache"
              GLIBC_VER="2.35-r1"
              OC_VER="1.2.27"
              MARKER="$CACHE/done-${OC_VER}-${GLIBC_VER}-x86_64"

              if [ -f "$MARKER" ]; then
                echo "=== glibc cache hit, skipping downloads ==="
                exit 0
              fi

              echo "=== Downloading glibc and opencode glibc binary (x86_64) ==="
              mkdir -p "$CACHE"
              apk add --no-cache curl

              curl -sL https://alpine-pkgs.sgerrand.com/sgerrand.rsa.pub \
                -o "$CACHE/sgerrand.rsa.pub"

              curl -sL "https://github.com/sgerrand/alpine-pkg-glibc/releases/download/${GLIBC_VER}/glibc-${GLIBC_VER}.apk" \
                -o "$CACHE/glibc.apk"

              curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OC_VER}/opencode-linux-x64.tar.gz" \
                -o "$CACHE/opencode.tar.gz"

              touch "$MARKER"
              echo "=== Downloads complete ==="
              ls -la "$CACHE/"
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 0
      containers:
        - name: opencode
          image: "docker.io/beclab/anomalyco-opencode:1.2.27"
          command:
            - sh
            - "-c"
            - |
              echo "=== Installing common tools ==="
              apk add --no-cache \
                python3 py3-pip \
                git \
                sudo \
                curl wget \
                bash \
                openssh-client \
                su-exec \
                nodejs npm

              echo "=== Setting up user (uid 1000) ==="
              addgroup -g 1000 opencode 2>/dev/null || true
              adduser -D -u 1000 -G opencode -h /home/opencode -s /bin/bash opencode 2>/dev/null || true
              echo "opencode ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/opencode
              chmod 440 /etc/sudoers.d/opencode

              CACHE="/home/opencode/.glibc-cache"
              ARCH=$(uname -m)

              if [ "$ARCH" = "x86_64" ] && [ -f "$CACHE/glibc.apk" ] && [ -f "$CACHE/opencode.tar.gz" ]; then
                echo "=== Installing glibc (x86_64) ==="
                cp "$CACHE/sgerrand.rsa.pub" /etc/apk/keys/sgerrand.rsa.pub
                apk del libc6-compat gcompat 2>/dev/null || true
                apk add --no-cache --force-overwrite "$CACHE/glibc.apk" libstdc++ 2>/dev/null

                echo "=== Replacing opencode binary with glibc build ==="
                tar -xzf "$CACHE/opencode.tar.gz" -C /usr/local/bin
                chmod +x /usr/local/bin/opencode

                echo "=== Setting up glibc loader ==="
                mkdir -p /lib64
                ln -sf /usr/glibc-compat/lib/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2 2>/dev/null
              else
                echo "=== Arch $ARCH: using original binary (terminal may not be available) ==="
              fi

              chown 1000:1000 /home/opencode /home/opencode/workspace

              echo "=== Starting opencode as uid 1000 ==="
              exec su-exec opencode opencode web --hostname 0.0.0.0 --port 3000
          workingDir: /home/opencode/workspace
          securityContext:
            runAsUser: 0
          env:
            - name: HOME
              value: /home/opencode
            - name: TERM
              value: xterm-256color
            - name: LD_LIBRARY_PATH
              value: /usr/glibc-compat/lib
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        - name: nginx
          image: "docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 60
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 10
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
      restartPolicy: Always
      volumes:
        - name: opencode-home
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
        - name: opencode-workspace
          hostPath:
            path: "{{ .Values.userspace.userData }}/Code"
            type: DirectoryOrCreate
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
            - key: nginx.conf
              path: nginx.conf

---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  ports:
    - name: web
      port: 3000
      targetPort: 3000
  selector:
    io.kompose.service: opencode
status:
  loadBalancer: {}
