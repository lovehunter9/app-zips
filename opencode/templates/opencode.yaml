                  '      { "model": "openai/gpt-5.3-codex", "variant": "medium" },' \
                  '      { "model": "google/gemini-3-flash-preview" },' \
                  '      { "model": "github-copilot/gemini-3-flash-preview" },' \
                  '      { "model": "opencode/big-pickle" }' \
                  '    ] },' \
                  '    "unspecified-high": { "model": "anthropic/claude-sonnet-4-6", "fallback_models": [' \
                  '      { "model": "github-copilot/claude-sonnet-4.6" },' \
                  '      { "model": "openai/gpt-5.3-codex", "variant": "medium" },' \
                  '      { "model": "google/gemini-3-flash-preview" },' \
                  '      { "model": "github-copilot/gemini-3-flash-preview" },' \
                  '      { "model": "opencode/big-pickle" }' \
                  '    ] },' \
                  '    "writing": { "model": "google/gemini-3-flash-preview", "fallback_models": [' \
                  '      { "model": "github-copilot/gemini-3-flash-preview" },' \
                  '      { "model": "anthropic/claude-sonnet-4-6" },' \
                  '      { "model": "github-copilot/claude-sonnet-4.6" },' \
                  '      { "model": "opencode/big-pickle" }' \
                  '    ] }' \
                  '  }' \
                  '}' \
                  > "$OMO_AGENT_CFG"
              fi
              chown 1000:1000 /home/opencode /home/opencode/workspace
              find /home/opencode -mindepth 1 -maxdepth 1 ! -name '.pkg-root' \
                -exec chown -R 1000:1000 {} +
              chown -R 1000:1000 /home/opencode/.pkg-root/usr/local 2>/dev/null || true
          resources: {}
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0

        - name: init-packages
          image: "docker.io/beclab/anomalyco-opencode:1.4.4"
          command:
            - sh
            - "-c"
            - |
              PKG="/home/opencode/.pkg-root"
              OC_VER="1.4.4"
              GLIBC_VER="2.35-r1"
              BASE_PKGS="python3 py3-pip git curl wget bash openssh-client nodejs npm go rust cargo iproute2 zip unzip gzip bzip2 xz tar zstd"
              FINGERPRINT="oc=${OC_VER} glibc=${GLIBC_VER} arch=$(uname -m) pkgs=${BASE_PKGS}"
              PKG_HASH=$(printf '%s' "$FINGERPRINT" | sha256sum | cut -c1-16)
              MARKER="$PKG/.installed-${PKG_HASH}"

              setup_mirrors() {
                USE_CN_MIRROR=false
                wget -q -O /dev/null https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/APKINDEX.tar.gz 2>/dev/null &
                _wpid=$!
                ( sleep 5 && kill "$_wpid" 2>/dev/null ) &
                _gpid=$!
                if wait "$_wpid" 2>/dev/null; then
                  echo "=== Network: Alpine CDN reachable ==="
                else
                  echo "=== Network: Alpine CDN unreachable or too slow, switching to China mirrors ==="
                  USE_CN_MIRROR=true
                  sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
                fi
                kill "$_gpid" 2>/dev/null || true
                wait "$_gpid" 2>/dev/null || true
              }

              github_download() {
                local url="$1" output="$2"
                if [ "$USE_CN_MIRROR" = "true" ]; then
                  for proxy in https://ghproxy.net https://gh-proxy.com https://ghproxy.homeboyc.cn https://ghfast.top; do
                    echo "=== Trying proxy $proxy for: $url ==="
                    if curl -fsSL --connect-timeout 15 --speed-limit 10000 --speed-time 30 \
                         "${proxy}/$url" -o "$output"; then
                      return 0
                    fi
                    rm -f "$output"
                    echo "=== Proxy $proxy failed ==="
                  done
                  echo "=== All proxies failed, falling back to direct ==="
                fi
                curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 --speed-limit 10000 --speed-time 30 "$url" -o "$output"
              }

              verify_cache() {
                [ ! -d "$PKG/bin" ] || [ ! -d "$PKG/usr" ] || [ ! -d "$PKG/lib" ] && return 1
                for b in \
                  bin/tar bin/gzip \
                  usr/bin/python3 usr/bin/pip3 usr/bin/git usr/bin/curl usr/bin/wget \
                  usr/bin/ssh usr/bin/node usr/bin/npm usr/bin/go usr/bin/rustc usr/bin/cargo \
                  usr/bin/zip usr/bin/unzip usr/bin/bzip2 usr/bin/xz usr/bin/zstd \
                  sbin/ss \
                  usr/local/bin/opencode usr/local/bin/pkg-install \
                  usr/local/bin/webstart usr/local/bin/webstop usr/local/bin/weblist; do
                  if [ ! -e "$PKG/$b" ] && [ ! -L "$PKG/$b" ]; then
                    echo "=== Cache invalid: $b missing ==="
                    return 1
                  fi
                  if [ -f "$PKG/$b" ] && [ ! -s "$PKG/$b" ]; then
                    echo "=== Cache invalid: $b is empty ==="
                    return 1
                  fi
                done
                if [ "$(uname -m)" = "x86_64" ]; then
                  if [ ! -e "$PKG/lib64/ld-linux-x86-64.so.2" ] && [ ! -L "$PKG/lib64/ld-linux-x86-64.so.2" ]; then
                    echo "=== Cache invalid: glibc linker (ld-linux-x86-64.so.2) missing ==="
                    return 1
                  fi
                fi
                return 0
              }

              restore_user_packages() {
                UPKGS="/home/opencode/.user-packages"
                [ ! -s "$UPKGS" ] && return 0
                RESTORE=$(cat "$UPKGS" | tr '\n' ' ')
                echo "=== Restoring user packages: $RESTORE ==="
                apk info -q 2>/dev/null | sort > /tmp/.pkgs-before
                FAILED=""
                for p in $RESTORE; do
                  if ! apk add --no-cache "$p" 2>&1; then
                    echo "=== Warning: failed to restore $p ==="
                    FAILED="$FAILED $p"
                  fi
                done
                apk info -q 2>/dev/null | sort > /tmp/.pkgs-after
                NEW_PKGS=$(comm -13 /tmp/.pkgs-before /tmp/.pkgs-after)
                if [ -z "$NEW_PKGS" ]; then
                  echo "=== No new packages to snapshot ==="
                  rm -f /tmp/.pkgs-before /tmp/.pkgs-after
                  return 0
                fi
                echo "=== Snapshotting new packages: $NEW_PKGS ==="
                for pkg in $NEW_PKGS; do
                  apk info -qL "$pkg" 2>/dev/null | while IFS= read -r f; do
                    [ -f "/$f" ] || [ -L "/$f" ] || continue
                    d=$(dirname "$f")
                    mkdir -p "$PKG/$d"
                    cp -a "/$f" "$PKG/$f" 2>/dev/null || true
                  done
                done
                if [ -n "$FAILED" ]; then
                  echo "=== Failed packages (will retry next restart):$FAILED ==="
                fi
                rm -f /tmp/.pkgs-before /tmp/.pkgs-after
                echo "=== Restore complete ==="
              }

              echo "=== Setting up home directory (runs every start) ==="
              mkdir -p /home/opencode/.npm-global/bin /home/opencode/.npm-global/lib
              chown -R 1000:1000 /home/opencode/.npm-global

              cat > /home/opencode/.profile << 'EOFPROFILE'
              export VIRTUAL_ENV="/home/opencode/.venv"
              export NPM_CONFIG_PREFIX="/home/opencode/.npm-global"
              export GOPATH="/home/opencode/go"
              export CARGO_HOME="/home/opencode/.cargo"
              export PATH="/home/opencode/.venv/bin:/home/opencode/.npm-global/bin:/home/opencode/go/bin:/home/opencode/.cargo/bin:/home/opencode/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              EOFPROFILE
              cp /home/opencode/.profile /home/opencode/.bashrc
              chown 1000:1000 /home/opencode/.profile /home/opencode/.bashrc

              olares_run_omo() {
                OMO_WANT_VERSION="${OLARES_OMO_VERSION:-{{ $omoVersion }}}"
                case "$OMO_WANT_VERSION" in
                  [0-9]*.[0-9]*.[0-9]*)
                    ;;
                  *)
                    echo "=== WARNING: OPENCODE_OMO_VERSION='${OMO_WANT_VERSION}' is not a concrete semver (e.g. '3.17.4')."
                    echo "===          Non-semver tags like 'latest' compare unequal to the installed"
                    echo "===          version string, so OMO will be REINSTALLED on every pod restart."
                    echo "===          Pin to a concrete version in Olares UI to fix."
                    ;;
                esac

                # Install OMO into /home/opencode/.npm-global — this lives on the
                # persistent appData hostPath, so it survives pod restarts WITHOUT
                # the fragile "snapshot-patch dance" that the previous version did
                # (copying /usr/lib/node_modules into $PKG/usr after the fact, with
                # silent failures).
                OMO_HOME_PREFIX="/home/opencode/.npm-global"
                OMO_HOME_DIR="${OMO_HOME_PREFIX}/lib/node_modules/oh-my-opencode"

                # Legacy locations we may have written to in older chart versions.
                # Scanned for backward-compat; on hit we ALSO mirror into the new
                # primary location so future restarts are clean.
                OMO_FOUND=false
                OMO_VERSION_MATCH=false
                OMO_FOUND_DIR=""
                OMO_FOUND_VERSION=""
                for d in "$OMO_HOME_DIR" \
                         /usr/lib/node_modules/oh-my-opencode \
                         /usr/local/lib/node_modules/oh-my-opencode \
                         "$PKG/usr/lib/node_modules/oh-my-opencode" \
                         "$PKG/usr/local/lib/node_modules/oh-my-opencode"; do
                  if [ -d "$d" ] && [ -f "$d/package.json" ]; then
                    OMO_FOUND=true
                    OMO_FOUND_DIR="$d"
                    OMO_FOUND_VERSION=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$d/package.json" | head -n1)
                    if [ "$OMO_FOUND_VERSION" = "$OMO_WANT_VERSION" ]; then
                      OMO_VERSION_MATCH=true
                    fi
                    break
                  fi
                done

                if [ "$OMO_FOUND" = "true" ] && [ "$OMO_VERSION_MATCH" = "true" ]; then
                  echo "=== OMO: oh-my-opencode@${OMO_FOUND_VERSION} already installed at ${OMO_FOUND_DIR}, skipping ==="
                  # If it's at a legacy /usr location, mirror into the persistent
                  # location so the NEXT restart finds it via the primary path
                  # (/home/opencode/...) without re-running this fallback.
                  if [ "$OMO_FOUND_DIR" != "$OMO_HOME_DIR" ] && [ ! -d "$OMO_HOME_DIR" ]; then
                    echo "=== OMO: mirroring legacy install (${OMO_FOUND_DIR}) → ${OMO_HOME_DIR} ==="
                    mkdir -p "$(dirname "$OMO_HOME_DIR")" || true
                    if cp -a "$OMO_FOUND_DIR" "$OMO_HOME_DIR" 2>&1; then
                      chown -R 1000:1000 "$OMO_HOME_PREFIX" 2>/dev/null || true
                      echo "=== OMO: mirror complete ==="
                    else
                      echo "=== WARNING: OMO mirror failed (see error above); will retry next restart ==="
                    fi
                  fi
                  chown -R 1000:1000 /home/opencode/.local 2>/dev/null || true
                  return 0
                fi

                if [ "$OMO_FOUND" = "true" ]; then
                  echo "=== OMO: installed version (${OMO_FOUND_VERSION:-unknown}) at ${OMO_FOUND_DIR} does not match pinned (${OMO_WANT_VERSION}); reinstalling ==="
                  rm -rf "$OMO_FOUND_DIR" 2>/dev/null || true
                  rm -rf "$OMO_HOME_DIR" 2>/dev/null || true
                  [ -n "$PKG" ] && rm -rf "$PKG/usr/lib/node_modules/oh-my-opencode" "$PKG/usr/local/lib/node_modules/oh-my-opencode" 2>/dev/null || true
                fi

                echo "=== OMO: installing nodejs+npm and oh-my-opencode@${OMO_WANT_VERSION} → ${OMO_HOME_PREFIX} ==="
                apk add --no-cache nodejs npm 2>&1 || { echo "=== WARNING: apk add nodejs npm failed ==="; return 1; }
                if [ "$USE_CN_MIRROR" = "true" ]; then
                  npm config set registry https://registry.npmmirror.com 2>/dev/null || true
                fi

                # Make sure the target prefix exists; npm needs it for --prefix.
                mkdir -p "${OMO_HOME_PREFIX}/bin" "${OMO_HOME_PREFIX}/lib"

                # Install DIRECTLY to the persistent prefix. No snapshot dance.
                if npm install -g --ignore-scripts --prefix "${OMO_HOME_PREFIX}" "oh-my-opencode@${OMO_WANT_VERSION}" 2>&1; then
                  if [ -d "$OMO_HOME_DIR" ] && [ -f "$OMO_HOME_DIR/package.json" ]; then
                    INSTALLED_VER=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' "$OMO_HOME_DIR/package.json" | head -n1)
                    chown -R 1000:1000 "$OMO_HOME_PREFIX" 2>/dev/null || true
                    echo "=== OMO: installed oh-my-opencode@${INSTALLED_VER} at ${OMO_HOME_DIR} (persistent) ==="
                  else
                    echo "=== WARNING: npm install reported success but ${OMO_HOME_DIR} is missing/incomplete ==="
                    echo "===          (expected ${OMO_HOME_DIR}/package.json after install) ==="
                    ls -la "${OMO_HOME_PREFIX}/lib/node_modules" 2>&1 || true
                  fi
                else
                  echo "=== WARNING: npm install oh-my-opencode@${OMO_WANT_VERSION} failed ==="
                fi
                chown -R 1000:1000 /home/opencode/.local 2>/dev/null || true
              }

              setup_mirrors

              if [ -f "$MARKER" ] && verify_cache; then
                echo "=== Package snapshot cached (${PKG_HASH}) ==="
                restore_user_packages
                olares_run_omo
                exit 0
              fi
              rm -f "$MARKER"

              echo "=== Installing system packages ==="
              if ! apk add --no-cache $BASE_PKGS; then
                echo "=== FATAL: base package installation failed, exiting ==="
                exit 1
              fi

              echo "=== Removing PEP 668 EXTERNALLY-MANAGED marker ==="
              rm -f /usr/lib/python3.*/EXTERNALLY-MANAGED

              echo "=== Creating persistent Python venv ==="
              VENV="/home/opencode/.venv"
              if [ ! -f "$VENV/bin/activate" ]; then
                python3 -m venv "$VENV"
                chown -R 1000:1000 "$VENV"
              fi

              echo "=== Configuring user opencode (uid 1000) ==="
              addgroup -g 1000 opencode 2>/dev/null || true
              adduser -D -u 1000 -G opencode -h /home/opencode -s /bin/bash opencode 2>/dev/null || true

              ARCH=$(uname -m)
              if [ "$ARCH" = "x86_64" ]; then
                echo "=== Installing glibc (x86_64) ==="
                echo "=== Embedding sgerrand RSA public key ==="
                echo "" | base64 -d > /etc/apk/keys/sgerrand.rsa.pub
                github_download "https://github.com/sgerrand/alpine-pkg-glibc/releases/download/${GLIBC_VER}/glibc-${GLIBC_VER}.apk" /tmp/glibc.apk
                echo "=== Removing libc6-compat/gcompat before glibc install ==="
                apk del libc6-compat gcompat 2>&1 || true
                if apk add --no-cache --force-overwrite /tmp/glibc.apk libstdc++ 2>&1; then
                  mkdir -p /lib64
                  ln -sf /usr/glibc-compat/lib/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2
                  echo "=== Replacing opencode binary with glibc build ==="
                  cp /usr/local/bin/opencode /tmp/opencode.musl.bak 2>/dev/null || true
                  if github_download "https://github.com/anomalyco/opencode/releases/download/v${OC_VER}/opencode-linux-x64.tar.gz" /tmp/opencode-glibc.tar.gz && \
                    tar -xzf /tmp/opencode-glibc.tar.gz -C /usr/local/bin; then
                    chmod +x /usr/local/bin/opencode
                  else
                    echo "=== WARNING: glibc binary download failed, restoring musl binary ==="
                    cp /tmp/opencode.musl.bak /usr/local/bin/opencode 2>/dev/null || true
                    chmod +x /usr/local/bin/opencode
                  fi
                  rm -f /tmp/opencode-glibc.tar.gz /tmp/opencode.musl.bak
                else
                  echo "=== WARNING: glibc installation failed, using musl binary ==="
                fi
              else
                echo "=== Arch $ARCH: using original musl binary ==="
              fi

              echo "=== Force-reinstalling bash (fix glibc cascade removal) ==="
              apk del bash 2>/dev/null || true
              apk add --no-cache bash 2>&1 || echo "=== WARNING: bash reinstall failed in init, pkg-manager will fix ==="

              echo "=== Creating pkg-install wrapper ==="
              cat > /usr/local/bin/pkg-install << 'EOFWRAPPER'
              #!/bin/sh
              Q="/home/opencode/.pkg-queue"
              _LOCKED=0
              _lock() {
                _lc=0
                while true; do
                  if mkdir "$Q/.lock" 2>/dev/null; then
                    echo $$ > "$Q/.lock/pid"
                    _LOCKED=1
                    return 0
                  fi
                  _op=$(cat "$Q/.lock/pid" 2>/dev/null)
                  if [ -z "$_op" ] || ! kill -0 "$_op" 2>/dev/null; then
                    rm -rf "$Q/.lock"
                    continue
                  fi
                  _lc=$((_lc + 1))
                  if [ $_lc -ge 20 ]; then
                    echo ">> ERROR: Another pkg-install is running (pid $_op). Try again later."
                    return 1
                  fi
                  sleep 0.5
                done
              }
              _unlock() {
                if [ "$_LOCKED" = "1" ]; then
                  rm -rf "$Q/.lock" 2>/dev/null || true
                  _LOCKED=0
                fi
              }
              trap '_unlock; exit 130' INT TERM
              _send() {
                if [ ! -d "$Q" ]; then
                  echo ">> ERROR: pkg-manager queue not found. Is the sidecar running?"
                  return 1
                fi
                _lock || return 1
                rm -f "$Q/result" "$Q/log"
                echo "$1" > "$Q/request"
                _c=0
                while [ ! -f "$Q/result" ]; do
                  sleep 0.5
                  _c=$((_c + 1))
                  if [ $_c -ge 600 ]; then
                    echo ">> ERROR: pkg-manager did not respond within 300s"
                    echo ">> The pkg-manager sidecar may be down or busy."
                    _unlock
                    return 1
                  fi
                done
                cat "$Q/log" 2>/dev/null
                EXIT=$(cat "$Q/result")
                rm -f "$Q/result" "$Q/log"
                _unlock
                case "$EXIT" in ''|*[!0-9]*) EXIT=1 ;; esac
                return "$EXIT"
              }
              _query() {
                if [ ! -d "$Q" ]; then
                  echo ">> ERROR: pkg-manager queue not found. Is the sidecar running?"
                  return 1
                fi
                _lock || return 1
                rm -f "$Q/search-result"
                echo "$1" > "$Q/request"
                _c=0
                while [ ! -f "$Q/search-result" ]; do
                  sleep 0.5
                  _c=$((_c + 1))
                  if [ $_c -ge 120 ]; then
                    echo ">> ERROR: pkg-manager did not respond within 60s"
                    _unlock
                    return 1
                  fi
                done
                cat "$Q/search-result"
                rm -f "$Q/search-result"
                _unlock
              }
              _help() {
                cat << 'EOFHELP'
              pkg-install - Alpine package manager for OpenCode

              USAGE
                pkg-install <package> [package2 ...]    Install packages
                pkg-install --remove  <package> [...]   Remove packages
                pkg-install --search  <keyword>         Search available packages
                pkg-install --info    <package>          Show package details and available versions
                pkg-install --list                       List all installed packages
                pkg-install --help                       Show this help message

              INSTALL WITH SPECIFIC VERSION
                pkg-install <package>=<version>
                Example:  pkg-install nodejs=20.15.1-r0
                Tip:      use --info <package> to see available versions first

              EXAMPLES
                pkg-install openjdk17-jdk               Install Java 17
                pkg-install make cmake gcc               Install multiple packages
                pkg-install nodejs=20.15.1-r0            Install a specific version
                pkg-install --remove openjdk17-jdk       Remove Java 17
                pkg-install --search postgres            Search for PostgreSQL-related packages
                pkg-install --info nodejs                 Show nodejs details and versions

              NOTES
                - Packages are from Alpine Linux repositories (apk).
                - Installed packages persist across restarts and upgrades.
                - For language ecosystem packages (persist across restarts AND upgrades):
                    pip install <pkg>            Python (uses ~/.venv, auto-activated)
                    npm install -g <pkg>         Node.js global
                    go install <pkg>@latest      Go (installs to ~/go/bin/)
                    cargo install <pkg>          Rust (installs to ~/.cargo/bin/)
              EOFHELP
              }
              case "$1" in
                --help|-h|"")
                  _help
                  exit 0
                  ;;
                --search)
                  shift
                  [ -z "$1" ] && echo "Usage: pkg-install --search <keyword>" && exit 1
                  _query "SEARCH $*"
                  ;;
                --info)
                  shift
                  [ -z "$1" ] && echo "Usage: pkg-install --info <package>" && exit 1
                  _query "INFO $*"
                  ;;
                --remove)
                  shift
                  [ -z "$1" ] && echo "Usage: pkg-install --remove <package> [...]" && exit 1
                  echo ">> Removing: $*"
                  _send "REMOVE $*"
                  S=$?; [ $S -eq 0 ] && echo ">> Removed successfully." || echo ">> Removal failed."
                  exit $S
                  ;;
                --list)
                  _query "LIST"
                  ;;
                -*)
                  echo "Unknown option: $1"
                  _help
                  exit 1
                  ;;
                *)
                  echo ">> Installing: $*"
                  _send "INSTALL $*"
                  S=$?; [ $S -eq 0 ] && echo ">> Installed successfully." || echo ">> Installation failed."
                  exit $S
                  ;;
              esac
              EOFWRAPPER
              chmod +x /usr/local/bin/pkg-install

              echo "=== Creating webstart / webstop / weblist wrappers ==="
              cat > /usr/local/bin/webstart << 'EOFWEBSTART'
              #!/bin/sh
              # webstart - start a web server as a fully detached daemon AND
              # auto-suffix the NAME with the listening port so multiple
              # concurrent servers of the same kind never clash.
              #
              # AGENT-FACING TOOL — not intended for direct user invocation.
              # The user's expected entry point is `weblist` (read-only).
              #
              # Usage: webstart BASE_NAME COMMAND [ARGS...]
              # NAME resolution:
              #   1. Parse a port from the CLI args (--port N, -p N, --port=N,
              #      --server.port N, --server-port N, --listen-port N,
              #      PORT=N env-prefix).
              #   2. If no port from args, snapshot listening sockets BEFORE/AFTER
              #      starting the server and pick the new port.
              #   3. Final NAME = "<BASE>-<PORT>" if a port was found, else "<BASE>".
              #   4. If the resolved NAME is already alive → restart mode (kill old).
              if [ "$1" = "-h" ] || [ "$1" = "--help" ] || [ -z "$1" ]; then
                cat << 'EOFHELP'
              webstart - start a web server as a detached daemon (agent-facing)

              USAGE
                webstart BASE_NAME COMMAND [ARGS...]

              EXAMPLES
                webstart vite    npx vite                                  # NAME -> vite-5173
                webstart vite    npx vite --port 4000                      # NAME -> vite-4000
                webstart next    npx next dev -H 0.0.0.0 -p 3000           # NAME -> next-3000
                webstart flask   flask run --host 0.0.0.0 --port 5000      # NAME -> flask-5000
                webstart cra     PORT=3001 npm start                       # NAME -> cra-3001

              The actual NAME is printed in the success line — read it to know
              what to pass to webstop, e.g. `webstop vite-5173`.

              MANAGEMENT
                weblist               list running servers (also user-friendly)
                webstop NAME          stop one server (exact match OR base prefix)
                webstop --all         stop everything
                tail -f /tmp/web-NAME.log    follow logs

              WHY
                Plain `cmd &` and even `nohup cmd &` get reaped when the agent's
                shell exits. webstart uses setsid + nohup + full stdio detach so
                the server survives no matter what.
              EOFHELP
                exit 0
              fi
              BASE="$1"; shift
              [ $# -gt 0 ] || { echo "webstart: missing COMMAND. Run 'webstart --help'." >&2; exit 2; }
              case "$BASE" in
                *[!a-zA-Z0-9_-]*) echo "webstart: BASE_NAME must match [a-zA-Z0-9_-]+" >&2; exit 2 ;;
              esac

              # ---- parse port hint from CLI args ----
              HINT_PORT=""
              prev=""
              for a in "$@"; do
                [ -n "$HINT_PORT" ] && break
                case "$a" in
                  --port=*|--server.port=*|--server-port=*|--listen-port=*|-p=*|-P=*)
                    HINT_PORT="${a#*=}" ;;
                  PORT=[0-9]*)
                    HINT_PORT="${a#PORT=}" ;;
                  *)
                    if [ -n "$prev" ]; then
                      case "$a" in
                        [0-9]*) HINT_PORT="$a" ;;
                      esac
                      prev=""
                    fi
                    case "$a" in
                      --port|--server.port|--server-port|--listen-port|-p|-P) prev="$a" ;;
                    esac ;;
                esac
              done
              case "$HINT_PORT" in *[!0-9]*|"") HINT_PORT="" ;; esac

              # ---- decide initial NAME ----
              if [ -n "$HINT_PORT" ]; then
                NAME="${BASE}-${HINT_PORT}"
              else
                NAME="$BASE"   # may be renamed once we discover the listening port
              fi
              PID="/tmp/web-${NAME}.pid"
              LOG="/tmp/web-${NAME}.log"

              # ---- restart mode: same final NAME alive → kill old ----
              if [ -f "$PID" ] && OLD=$(cat "$PID" 2>/dev/null) && [ -n "$OLD" ] && kill -0 "$OLD" 2>/dev/null; then
                OLDCMD=$(ps -p "$OLD" -o args= 2>/dev/null | head -c 80)
                echo "webstart: NOTE — '$NAME' is already running (pid $OLD)."
                echo "webstart:   old command: ${OLDCMD:-<unknown>}"
                echo "webstart:   stopping the old one (same final NAME = restart)."
                echo "webstart:   to run BOTH, pick a DIFFERENT port — webstart will then"
                echo "webstart:   suffix the new server with that port and avoid the clash."
                kill "$OLD" 2>/dev/null
                _w=0; while kill -0 "$OLD" 2>/dev/null && [ $_w -lt 10 ]; do sleep 0.3; _w=$((_w+1)); done
                kill -9 "$OLD" 2>/dev/null || true
              fi
              rm -f "$PID" "$LOG"
              : > "$LOG"

              # ---- snapshot listening ports BEFORE start (write to a temp file
              # because /bin/sh on Alpine = busybox ash, no process substitution).
              SNAP=$(mktemp /tmp/web-snap.XXXXXX 2>/dev/null) || SNAP="/tmp/web-snap.$$"
              ss -tlnH 2>/dev/null | awk '{print $4}' | grep -oE '[0-9]+$' | sort -un > "${SNAP}.before"

              # ---- launch ----
              # Use `env` so leading K=V env-prefix args (e.g. `PORT=3001 npm start`)
              # work even though we're not going through a shell.
              if command -v setsid >/dev/null 2>&1; then
                setsid nohup env "$@" >"$LOG" 2>&1 </dev/null &
              else
                nohup env "$@" >"$LOG" 2>&1 </dev/null &
              fi
              CHILD=$!
              echo "$CHILD" > "$PID"
              disown "$CHILD" 2>/dev/null || true

              # ---- verify alive ----
              sleep 2
              if ! kill -0 "$CHILD" 2>/dev/null; then
                echo "webstart: '$NAME' died on startup. Last 30 log lines:" >&2
                tail -n 30 "$LOG" >&2 2>/dev/null || true
                rm -f "$PID"
                exit 1
              fi

              # ---- detect actual listening port (snapshot diff, retry up to 5x) ----
              ACTUAL_PORT=""
              _try=0
              while [ $_try -lt 5 ] && [ -z "$ACTUAL_PORT" ]; do
                ss -tlnH 2>/dev/null | awk '{print $4}' | grep -oE '[0-9]+$' | sort -un > "${SNAP}.after"
                NEWPORTS=$(comm -13 "${SNAP}.before" "${SNAP}.after" 2>/dev/null)
                _new_count=$(printf '%s\n' "$NEWPORTS" | grep -c '^[0-9]')
                if [ "$_new_count" = "1" ]; then
                  ACTUAL_PORT=$(printf '%s\n' "$NEWPORTS" | head -1)
                  break
                fi
                _try=$((_try+1))
                sleep 1
              done
              rm -f "${SNAP}.before" "${SNAP}.after"

              # ---- rename pid/log files if we discovered a port and NAME has no suffix ----
              if [ -n "$ACTUAL_PORT" ] && [ -z "$HINT_PORT" ]; then
                FINAL="${BASE}-${ACTUAL_PORT}"
                FPID="/tmp/web-${FINAL}.pid"
                FLOG="/tmp/web-${FINAL}.log"
                if [ -f "$FPID" ]; then
                  OTHER=$(cat "$FPID" 2>/dev/null)
                  if [ -z "$OTHER" ] || ! kill -0 "$OTHER" 2>/dev/null; then
                    rm -f "$FPID" "$FLOG"
                  else
                    echo "webstart: WARNING — port $ACTUAL_PORT is already tracked as '$FINAL' (pid $OTHER)." >&2
                    echo "webstart:   keeping NAME='$NAME' to avoid overwriting." >&2
                    FPID=""
                  fi
                fi
                if [ -n "$FPID" ]; then
                  if mv "$PID" "$FPID" 2>/dev/null && mv "$LOG" "$FLOG" 2>/dev/null; then
                    NAME="$FINAL"; PID="$FPID"; LOG="$FLOG"
                  fi
                fi
              fi

              if [ -n "$ACTUAL_PORT" ]; then
                echo "webstart: '$NAME' running (pid $CHILD, port $ACTUAL_PORT), log: $LOG"
              else
                echo "webstart: '$NAME' running (pid $CHILD, port=unknown), log: $LOG"
                echo "webstart: NOTE — could not auto-detect listening port within 5s."
                echo "webstart:        NAME left as '$NAME' (no port suffix)."
              fi
              exit 0
              EOFWEBSTART
              chmod +x /usr/local/bin/webstart

              cat > /usr/local/bin/webstop << 'EOFWEBSTOP'
              #!/bin/sh
              # webstop - stop one or more webstart-managed servers.
              #
              # NAME matching (in order):
              #   1. Exact: /tmp/web-<NAME>.pid exists → stop just that one.
              #   2. Single prefix: only one server matches "<NAME>-*" → stop it
              #      (convenience for the common "I have one vite running" case).
              #   3. Multiple prefix matches → REFUSE and list candidates. Either
              #      pass the exact NAME, or use `--prefix <BASE>` for explicit
              #      batch-stop. This guard prevents the "restart-one-instance,
              #      kill-all-instances" footgun.
              #
              # FLAGS
              #   --prefix <BASE> [...]    explicit batch: stop every "<BASE>-*"
              #                            (and bare "<BASE>" if present)
              #   --all                    stop every webstart-managed server
              #
              # AGENT-FACING TOOL — see weblist for user-friendly output.
              if [ "$1" = "-h" ] || [ "$1" = "--help" ] || [ -z "$1" ]; then
                cat << 'EOFHELP'
              webstop - stop a webstart-managed server

              USAGE
                webstop NAME [NAME...]            stop by exact name (or unique prefix)
                webstop --prefix BASE [BASE...]   batch: stop every "BASE-*" + bare "BASE"
                webstop --all                     stop every webstart-managed server

              EXAMPLES
                webstop vite-5173             stop the exact server
                webstop vite                  if only one "vite-*" runs, stop it;
                                              if multiple, REFUSE and list them
                webstop --prefix vite         stop ALL "vite-*" explicitly
                webstop --all                 nuke everything

              SAFETY
                Plain `webstop vite` will NOT silently kill multiple servers — it
                only proceeds when the prefix uniquely identifies one. To batch
                stop, you MUST use --prefix. This avoids accidentally killing
                vite-6006 when you meant to restart vite-5173.
              EOFHELP
                exit 0
              fi

              MODE="auto"
              case "$1" in
                --all)
                  shift
                  MODE="all"
                  set -- $(ls /tmp/web-*.pid 2>/dev/null | sed -e 's|.*/web-||' -e 's|\.pid$||')
                  [ $# -gt 0 ] || { echo "webstop: nothing running"; exit 0; }
                  ;;
                --prefix)
                  shift
                  MODE="prefix"
                  [ $# -gt 0 ] || { echo "webstop: --prefix needs at least one BASE" >&2; exit 2; }
                  ;;
              esac

              _stop_one() {
                _n="$1"
                _pf="/tmp/web-${_n}.pid"
                _p=$(cat "$_pf" 2>/dev/null)
                if [ -z "$_p" ] || ! kill -0 "$_p" 2>/dev/null; then
                  rm -f "$_pf"
                  echo "webstop: '$_n' was not running (cleaned stale pid file)"
                  return 0
                fi
                kill "$_p" 2>/dev/null
                _w=0
                while kill -0 "$_p" 2>/dev/null && [ $_w -lt 10 ]; do
                  sleep 0.3; _w=$((_w + 1))
                done
                kill -9 "$_p" 2>/dev/null || true
                rm -f "$_pf"
                echo "webstop: '$_n' stopped (was pid $_p)"
              }

              # Collect "<BASE>-*" + bare "<BASE>" matches, print one per line
              _list_prefix_matches() {
                _base="$1"
                [ -f "/tmp/web-${_base}.pid" ] && echo "$_base"
                for pf in /tmp/web-${_base}-*.pid; do
                  [ -f "$pf" ] || continue
                  m=$(basename "$pf" .pid); m=${m#web-}
                  echo "$m"
                done
              }

              RC=0
              for NAME in "$@"; do
                case "$MODE" in
                  prefix)
                    MATCHES=$(_list_prefix_matches "$NAME")
                    if [ -z "$MATCHES" ]; then
                      echo "webstop: --prefix '$NAME' matched nothing" >&2
                      RC=1; continue
                    fi
                    _n_match=$(echo "$MATCHES" | wc -l | tr -d ' ')
                    echo "webstop: --prefix '$NAME' matches $_n_match server(s):"
                    echo "$MATCHES" | sed 's/^/  - /'
                    for m in $MATCHES; do _stop_one "$m"; done
                    ;;
                  *)
                    # auto / all: exact first, then unique-prefix, else refuse
                    if [ -f "/tmp/web-${NAME}.pid" ]; then
                      _stop_one "$NAME"
                      continue
                    fi
                    MATCHES=$(_list_prefix_matches "$NAME")
                    if [ -z "$MATCHES" ]; then
                      echo "webstop: no server matching '$NAME'" >&2
                      echo "webstop:   run 'weblist' to see what is running." >&2
                      RC=1; continue
                    fi
                    _n_match=$(echo "$MATCHES" | wc -l | tr -d ' ')
                    if [ "$_n_match" = "1" ]; then
                      _stop_one "$MATCHES"
                      continue
                    fi
                    echo "webstop: '$NAME' is AMBIGUOUS — matches $_n_match servers:" >&2
                    echo "$MATCHES" | sed 's/^/  - /' >&2
                    echo "webstop:   refusing to kill multiple servers from one base name." >&2
                    echo "webstop:   either pass the EXACT name (e.g. 'webstop ${NAME}-<port>')," >&2
                    echo "webstop:   or use 'webstop --prefix $NAME' to stop them all explicitly." >&2
                    RC=2
                    ;;
                esac
              done
              exit $RC
              EOFWEBSTOP
              chmod +x /usr/local/bin/webstop

              cat > /usr/local/bin/weblist << 'EOFWEBLIST'
              #!/bin/sh
              # weblist - show running web servers (user-friendly).
              #
              # Anything started via `webstart` (typically by the AI agent) shows
              # up here. To follow logs:  tail -f /tmp/web-<NAME>.log
              found=0
              FMT='  %-22s %-7s %-7s %s\n'
              for PID in /tmp/web-*.pid; do
                [ -f "$PID" ] || continue
                NAME=$(basename "$PID" .pid); NAME=${NAME#web-}
                P=$(cat "$PID" 2>/dev/null)
                if [ -z "$P" ] || ! kill -0 "$P" 2>/dev/null; then
                  rm -f "$PID"; continue
                fi
                if [ "$found" = "0" ]; then
                  printf "$FMT" "NAME" "PID" "PORT" "COMMAND"
                  printf "$FMT" "----" "---" "----" "-------"
                fi
                CMD=$(ps -p "$P" -o args= 2>/dev/null | head -c 100)
                # Try the captured pid first; fall back to its direct children
                # (npx → node, npm → node, etc.) since the listener may not be the
                # process we originally spawned.
                PORT=$(ss -tlnp 2>/dev/null | grep "pid=$P," | head -1 | awk '{print $4}' | sed 's/.*://')
                if [ -z "$PORT" ]; then
                  for kid in $(ps -o pid,ppid 2>/dev/null | awk -v par="$P" '$2==par {print $1}'); do
                    PORT=$(ss -tlnp 2>/dev/null | grep "pid=$kid," | head -1 | awk '{print $4}' | sed 's/.*://')
                    [ -n "$PORT" ] && break
                  done
                fi
                printf "$FMT" "$NAME" "$P" "${PORT:-?}" "$CMD"
                found=1
              done
              [ "$found" = "1" ] || echo "  (no servers running)"
              EOFWEBLIST
              chmod +x /usr/local/bin/weblist

              olares_run_omo

              echo "=== Snapshotting filesystem to $PKG ==="
              rm -rf "$PKG"
              mkdir -p "$PKG" "$PKG/etc" "$PKG/tmp"

              SNAP_OK=true
              cp -a /bin "$PKG/bin"       || SNAP_OK=false
              ln -sf ../usr/bin/bash "$PKG/bin/bash"
              cp -a /sbin "$PKG/sbin"     || SNAP_OK=false
              cp -a /usr "$PKG/usr"       || SNAP_OK=false
              cp -a /lib "$PKG/lib"       || SNAP_OK=false
              cp /etc/passwd "$PKG/etc/passwd"  || SNAP_OK=false
              cp /etc/group "$PKG/etc/group"    || SNAP_OK=false
              cp -a /etc/apk "$PKG/etc/apk"    || SNAP_OK=false
              cp -a /etc/ssl "$PKG/etc/ssl"     || SNAP_OK=false
              mkdir -p "$PKG/lib64"
              if [ -d /lib64 ]; then
                cp -a /lib64/* "$PKG/lib64/" || echo "=== WARNING: lib64 snapshot copy failed ==="
              fi

              if [ "$SNAP_OK" != "true" ]; then
                echo "=== FATAL: snapshot copy failed (disk full?), cleaning up ==="
                rm -rf "$PKG"
                exit 1
              fi

              touch "$MARKER"
              echo "=== Snapshot complete ($(du -sh "$PKG" | cut -f1)) ==="

              restore_user_packages
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsUser: 0

      containers:
        - name: opencode
          image: "docker.io/beclab/anomalyco-opencode:1.4.4"
          command:
            - sh
            - "-c"
            - |
              echo "=== Runtime check ==="
              [ -x /usr/bin/bash ] && echo "bash OK" || echo "bash: waiting for pkg-manager fix"
              if [ ! -f "$HOME/.venv/bin/activate" ]; then
                echo "Creating Python venv..."
                python3 -m venv "$HOME/.venv"
              fi
              exec opencode web --hostname 0.0.0.0 --port 3000
          workingDir: /home/opencode/workspace
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: HOME
              value: /home/opencode
            - name: TERM
              value: xterm-256color
            - name: PATH
              value: /home/opencode/.venv/bin:/home/opencode/.npm-global/bin:/home/opencode/go/bin:/home/opencode/.cargo/bin:/home/opencode/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            - name: VIRTUAL_ENV
              value: /home/opencode/.venv
            - name: NPM_CONFIG_PREFIX
              value: /home/opencode/.npm-global
            - name: GOPATH
              value: /home/opencode/go
            - name: CARGO_HOME
              value: /home/opencode/.cargo
            - name: ENV
              value: /home/opencode/.profile
            - name: LD_LIBRARY_PATH
              value: /usr/glibc-compat/lib
          resources:
            limits:
              cpu: "4"
              memory: 4Gi
            requests:
              cpu: 200m
              memory: 1Gi
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
            - name: pkg-bin
              mountPath: /bin
            - name: pkg-sbin
              mountPath: /sbin
            - name: pkg-usr
              mountPath: /usr
            - name: pkg-etc-passwd
              mountPath: /etc/passwd
            - name: pkg-etc-group
              mountPath: /etc/group
            - name: pkg-lib
              mountPath: /lib
            - name: pkg-lib64
              mountPath: /lib64
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        - name: nginx
          image: "docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2"
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8081
              protocol: TCP
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 60
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 10
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
        - name: pkg-manager
          image: "docker.io/beclab/anomalyco-opencode:1.4.4"
          securityContext:
            runAsUser: 0
          command:
            - sh
            - "-c"
            - |
              QUEUE="/home/opencode/.pkg-queue"
              UPKGS="/home/opencode/.user-packages"
              mkdir -p "$QUEUE"
              rm -f "$QUEUE/request" "$QUEUE/result" "$QUEUE/log" "$QUEUE/search-result"
              rm -rf "$QUEUE/.lock"
              touch "$UPKGS"

              rm -f /lib/apk/db/lock 2>/dev/null || true

              wget -q -O /dev/null https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/APKINDEX.tar.gz 2>/dev/null &
              _wpid=$!
              ( sleep 5 && kill "$_wpid" 2>/dev/null ) &
              _gpid=$!
              if ! wait "$_wpid" 2>/dev/null; then
                echo "=== pkg-manager: switching to China mirrors ==="
                sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
              fi
              kill "$_gpid" 2>/dev/null || true
              wait "$_gpid" 2>/dev/null || true

              echo "=== APK DB check ==="
              echo "installed: $(wc -l < /lib/apk/db/installed 2>/dev/null || echo 'NOT FOUND')"
              echo "arch: $(cat /etc/apk/arch 2>/dev/null || echo 'NOT FOUND')"
              echo "repos: $(cat /etc/apk/repositories 2>/dev/null || echo 'NOT FOUND')"
              ls -la /lib/apk/db/ 2>&1 || echo "/lib/apk/db/ missing"
              echo "apk info count: $(apk info 2>/dev/null | wc -l)"
              echo "=== end DB check ==="

              apk update 2>&1 || true

              echo "=== Force-reinstalling bash (every start) ==="
              apk del bash 2>/dev/null || true
              if apk add --no-cache bash 2>&1; then
                echo "=== bash reinstalled OK ==="
              else
                echo "=== WARNING: bash reinstall failed ==="
              fi

              _add_pkgs() {
                for p in $@; do
                  p_base=$(echo "$p" | sed 's/=.*//')
                  grep -qx "$p_base" "$UPKGS" || echo "$p_base" >> "$UPKGS"
                done
              }
              _del_pkgs() {
                for p in $@; do
                  sed -i "/^${p}$/d" "$UPKGS"
                done
              }

              trap 'echo "=== Package manager shutting down ==="; exit 143' TERM INT
              echo "=== Package manager ready ==="
              while true; do
                if [ -f "$QUEUE/request" ]; then
                  REQ=$(cat "$QUEUE/request")
                  rm -f "$QUEUE/request"

                  TMP="$QUEUE/.result.tmp"
                  case "$REQ" in
                    SEARCH\ *)
                      KEYWORD="${REQ#SEARCH }"
                      apk update >/dev/null 2>&1
                      apk search "$KEYWORD" > "$TMP" 2>&1
                      mv "$TMP" "$QUEUE/search-result"
                      ;;
                    LIST)
                      apk info > "$TMP" 2>&1
                      mv "$TMP" "$QUEUE/search-result"
                      ;;
                    INFO\ *)
                      TARGET="${REQ#INFO }"
                      apk update >/dev/null 2>&1
                      { apk policy "$TARGET" 2>/dev/null
                        echo ""
                        apk info -d -s "$TARGET" 2>/dev/null; } > "$TMP" 2>&1
                      mv "$TMP" "$QUEUE/search-result"
                      ;;
                    REMOVE\ *)
                      PKGS="${REQ#REMOVE }"
                      echo "=== Removing: $PKGS ==="
                      apk del $PKGS > "$QUEUE/log" 2>&1
                      RC=$?
                      [ $RC -eq 0 ] && _del_pkgs $PKGS
                      echo $RC > "$QUEUE/result"
                      ;;
                    INSTALL\ *)
                      PKGS="${REQ#INSTALL }"
                      echo "=== Installing: $PKGS ==="
                      apk add --no-cache $PKGS > "$QUEUE/log" 2>&1
                      RC=$?
                      [ $RC -eq 0 ] && _add_pkgs $PKGS
                      echo $RC > "$QUEUE/result"
                      ;;
                    *)
                      echo "=== Installing (legacy): $REQ ==="
                      apk add --no-cache $REQ > "$QUEUE/log" 2>&1
                      RC=$?
                      [ $RC -eq 0 ] && _add_pkgs $REQ
                      echo $RC > "$QUEUE/result"
                      ;;
                  esac
                fi
                sleep 1
              done
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: pkg-bin
              mountPath: /bin
            - name: pkg-sbin
              mountPath: /sbin
            - name: pkg-usr
              mountPath: /usr
            - name: pkg-lib
              mountPath: /lib
            - name: pkg-lib64
              mountPath: /lib64
            - name: pkg-etc-apk
              mountPath: /etc/apk
            - name: pkg-etc-ssl
              mountPath: /etc/ssl
            - name: pkg-etc-passwd
              mountPath: /etc/passwd
            - name: pkg-etc-group
              mountPath: /etc/group
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["test", "-d", "/home/opencode/.pkg-queue"]
            initialDelaySeconds: 10
            periodSeconds: 30
      terminationGracePeriodSeconds: 10
      restartPolicy: Always
      volumes:
        - name: opencode-home
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
        - name: opencode-workspace
          hostPath:
            path: "{{ .Values.userspace.userData }}/Code"
            type: DirectoryOrCreate
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: pkg-bin
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/bin"
            type: DirectoryOrCreate
        - name: pkg-sbin
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/sbin"
            type: DirectoryOrCreate
        - name: pkg-usr
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/usr"
            type: DirectoryOrCreate
        - name: pkg-lib
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/lib"
            type: DirectoryOrCreate
        - name: pkg-lib64
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/lib64"
            type: DirectoryOrCreate
        - name: pkg-etc-passwd
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/etc/passwd"
            type: FileOrCreate
        - name: pkg-etc-group
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/etc/group"
            type: FileOrCreate
        - name: pkg-etc-apk
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/etc/apk"
            type: DirectoryOrCreate
        - name: pkg-etc-ssl
          hostPath:
            path: "{{ .Values.userspace.appData }}/.pkg-root/etc/ssl"
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  ports:
    - name: web
      port: 3000
      targetPort: 3000
  selector:
    io.kompose.service: opencode
status:
  loadBalancer: {}
