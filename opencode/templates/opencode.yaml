---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: opencode
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: opencode
    spec:
      initContainers:
        - name: init-setup
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - "-c"
            - |
              mkdir -p /home/opencode/workspace \
                       /home/opencode/.opencode \
                       /home/opencode/.config/opencode \
                       /home/opencode/.config/opencode/skills/web-preview \
                       /home/opencode/.config/opencode/skills/system-admin \
                       /home/opencode/.pkg-queue
              SKILL="/home/opencode/.config/opencode/skills/web-preview/SKILL.md"
              printf '%s\n' \
                '---' \
                'name: web-preview' \
                'description: MUST load for any web development. Start dev servers, preview web apps, generate preview URLs. Covers Vite, React, Next.js, Vue, Flask, static sites.' \
                '---' \
                '' \
                '## How to preview' \
                '' \
                'This environment has a built-in reverse-proxy.' \
                'Dev servers inside the container are reachable at `/__preview/<port>/` on the same domain the user is already on.' \
                '' \
                '## Starting dev servers — MANDATORY pattern' \
                '' \
                'EVERY dev server or web service MUST be started with `nohup ... &` so it keeps running after the command returns.' \
                'EVERY dev server MUST bind to `0.0.0.0` (not localhost, not 127.0.0.1).' \
                'EVERY dev server MUST set its base/public path to `/__preview/<port>/`.' \
                '' \
                'General pattern:' \
                '' \
                '```' \
                'nohup <command> --host 0.0.0.0 --port <PORT> --base /__preview/<PORT>/ > /tmp/dev-server.log 2>&1 &' \
                '```' \
                '' \
                'After starting, ALWAYS verify the server is running:' \
                '' \
                '```' \
                'sleep 2 && ss -tlnp | grep <PORT>' \
                '```' \
                '' \
                '## Vite (React / Vue / Svelte / vanilla)' \
                '' \
                '```' \
                'nohup npx vite --host 0.0.0.0 --port 5173 --base /__preview/5173/ > /tmp/vite.log 2>&1 &' \
                '```' \
                '' \
                'If the project uses npm scripts:' \
                '' \
                '```' \
                'nohup npm run dev -- --host 0.0.0.0 --port 5173 --base /__preview/5173/ > /tmp/vite.log 2>&1 &' \
                '```' \
                '' \
                'When scaffolding a NEW Vite project, also set base in vite.config:' \
                '' \
                '```js' \
                'export default defineConfig({ base: "/__preview/5173/" })' \
                '```' \
                '' \
                '## Next.js' \
                '' \
                'Set basePath in next.config.js BEFORE starting:' \
                '' \
                '```js' \
                'module.exports = { basePath: "/__preview/3001" }' \
                '```' \
                '' \
                'Then:' \
                '' \
                '```' \
                'nohup npx next dev -H 0.0.0.0 -p 3001 > /tmp/next.log 2>&1 &' \
                '```' \
                '' \
                '## Python (Flask / FastAPI / http.server)' \
                '' \
                '```' \
                'nohup python3 -m http.server 8000 --bind 0.0.0.0 > /tmp/pyserver.log 2>&1 &' \
                '```' \
                '' \
                'For Flask:' \
                '' \
                '```' \
                'nohup flask run --host 0.0.0.0 --port 8000 > /tmp/flask.log 2>&1 &' \
                '```' \
                '' \
                '## Static HTML (no bundler)' \
                '' \
                'Use Vite to serve:' \
                '' \
                '```' \
                'nohup npx vite --host 0.0.0.0 --port 5173 --base /__preview/5173/ > /tmp/vite.log 2>&1 &' \
                '```' \
                '' \
                '## Go / Rust / Other custom servers' \
                '' \
                'Make sure the server listens on 0.0.0.0:<PORT>, then:' \
                '' \
                '```' \
                'nohup ./myserver --addr 0.0.0.0:8080 > /tmp/server.log 2>&1 &' \
                '```' \
                '' \
                '## Stopping a dev server' \
                '' \
                '```' \
                'kill $(lsof -t -i:<PORT>)   # or: pkill -f "vite"' \
                '```' \
                '' \
                '## Preview URL' \
                '' \
                'NEVER use localhost or 127.0.0.1 in any URL you show to the user.' \
                '' \
                'Tell the user:' \
                '"Append `/__preview/<port>/` to your current OpenCode URL in the browser address bar."' \
                '' \
                'Example: if the user is on `https://abc123.example.olares.cn`, the preview URL is:' \
                '`https://abc123.example.olares.cn/__preview/5173/`' \
                '' \
                '## CRITICAL rules (MUST follow every time)' \
                '' \
                '1. ALWAYS use `nohup ... > /tmp/<name>.log 2>&1 &` to start servers — NEVER run in foreground' \
                '2. ALWAYS bind to `0.0.0.0` — NEVER localhost or 127.0.0.1' \
                '3. ALWAYS set `--base /__preview/<port>/` (Vite) or `basePath` (Next.js) — without this, assets 404' \
                '4. ALWAYS verify the server is running after starting: `sleep 2 && ss -tlnp | grep <PORT>`' \
                '5. NEVER output `http://localhost` in any URL — the user accesses remotely' \
                '6. The trailing slash after the port number is REQUIRED: `/__preview/5173/` not `/__preview/5173`' \
                '7. If a port is busy, pick another port and adjust `--base` accordingly' \
                '8. When the user asks to "create a web page", "build a website", or "start a project":' \
                '   automatically create the project, install deps, start the dev server with nohup, and show the preview URL' \
                > "$SKILL"
              ADMIN="/home/opencode/.config/opencode/skills/system-admin/SKILL.md"
              printf '%s\n' \
                '---' \
                'name: system-admin' \
                'description: MUST load before installing ANY system package. Provides pkg-install for Java, Python, Go, Rust, FFmpeg, databases, compilers, and all Alpine packages.' \
                '---' \
                '' \
                '## pkg-install — system package manager' \
                '' \
                'This environment is Alpine Linux. Use `pkg-install` to manage system packages.' \
                '`sudo` and `apk` are NOT available directly — always use `pkg-install`.' \
                '' \
                '### Install' \
                '' \
                '```' \
                'pkg-install <package> [package2 ...]' \
                '```' \
                '' \
                'Examples:' \
                '' \
                '```' \
                'pkg-install openjdk17-jdk          # install Java 17' \
                'pkg-install make cmake gcc          # install multiple packages' \
                'pkg-install nodejs=20.15.1-r0       # install a specific version' \
                '```' \
                '' \
                '### Remove' \
                '' \
                '```' \
                'pkg-install --remove <package> [...]' \
                '```' \
                '' \
                '### Search, Info, List' \
                '' \
                '```' \
                'pkg-install --search <keyword>      # search available packages' \
                'pkg-install --info <package>         # show details and available versions' \
                'pkg-install --list                   # list all installed packages' \
                'pkg-install --help                   # show full help' \
                '```' \
                '' \
                '### Version pinning' \
                '' \
                'To install a specific version, append `=<version>`:' \
                '' \
                '```' \
                'pkg-install nodejs=20.15.1-r0' \
                '```' \
                '' \
                'Use `pkg-install --info <package>` first to see available versions.' \
                '' \
                '## Common package names (Alpine)' \
                '' \
                '| Need                | Package name        |' \
                '|---------------------|---------------------|' \
                '| Java 17             | openjdk17-jdk       |' \
                '| Java 21             | openjdk21-jdk       |' \
                '| GCC / G++ / Make    | build-base          |' \
                '| CMake               | cmake               |' \
                '| SQLite              | sqlite              |' \
                '| PostgreSQL client   | postgresql-client   |' \
                '| MySQL / MariaDB cli | mariadb-client      |' \
                '| Redis cli           | redis               |' \
                '| FFmpeg              | ffmpeg              |' \
                '| ImageMagick         | imagemagick         |' \
                '| PHP                 | php83               |' \
                '| Ruby                | ruby                |' \
                '| Perl                | perl                |' \
                '| Lua                 | lua5.4              |' \
                '| .NET SDK            | dotnet8-sdk         |' \
                '| Nginx               | nginx               |' \
                '| Docker CLI          | docker-cli          |' \
                '| tmux                | tmux                |' \
                '| vim / neovim        | vim / neovim        |' \
                '| jq / yq            | jq / yq             |' \
                '' \
                '## Pre-installed tools' \
                '' \
                'The following are already available (no install needed):' \
                '' \
                '- **Languages**: python3, pip, node, npm, go, rustc, cargo' \
                '- **VCS**: git' \
                '- **Network**: curl, wget, ssh, ss' \
                '- **Shell**: bash, sudo' \
                '- **Compression**: zip, unzip, gzip, bzip2, xz, tar, zstd' \
                '' \
                '## Language-specific package managers' \
                '' \
                'For language ecosystem packages, use the native tool directly (no pkg-install needed):' \
                '' \
                '```' \
                'pip install <pkg>           # Python' \
                'npm install <pkg>           # Node.js' \
                'go install <pkg>@latest     # Go' \
                'cargo install <pkg>         # Rust' \
                '```' \
                '' \
                '## Rules' \
                '' \
                '- ALWAYS use `pkg-install` for system packages' \
                '- NEVER use `sudo`, `apk`, or download binaries manually' \
                '- NEVER tell the user that system packages cannot be installed — they CAN via pkg-install' \
                '- NEVER modify ~/.profile or ~/.bashrc for PATH — packages install to standard paths' \
                '- When unsure about the package name, use `pkg-install --search <keyword>` first' \
                > "$ADMIN"
              if [ ! -f /home/opencode/workspace/opencode.json ]; then
                printf '%s\n' \
                  '{' \
                  '  "instructions": [' \
                  '    "You have special skills. Before ANY web development task (create site, start server, preview), load the web-preview skill. Before installing ANY system package, load the system-admin skill.",' \
                  '    "NEVER use sudo, apt, or apk directly. Use pkg-install instead.",' \
                  '    "NEVER show localhost URLs. Dev servers are accessed via /__preview/<port>/ path on the current domain."' \
                  '  ]' \
                  '}' > /home/opencode/workspace/opencode.json
              fi
              chown -R 1000:1000 /home/opencode/.opencode \
                                 /home/opencode/.config \
                                 /home/opencode/.pkg-queue
              chown 1000:1000 /home/opencode /home/opencode/workspace
          resources: {}
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0

        - name: init-packages
          image: "docker.io/beclab/anomalyco-opencode:1.2.27"
          command:
            - sh
            - "-c"
            - |
              PKG="/home/opencode/.pkg-root"
              OC_VER="1.2.27"
              PKG_VER="v5"
              GLIBC_VER="2.35-r1"
              MARKER="$PKG/.installed-${OC_VER}-${PKG_VER}"

              if [ -f "$MARKER" ]; then
                echo "=== Package snapshot cached (${OC_VER}-${PKG_VER}) ==="
                exit 0
              fi

              echo "=== Installing system packages ==="
              apk add --no-cache \
                python3 py3-pip \
                git \
                sudo \
                curl wget \
                bash \
                openssh-client \
                nodejs npm \
                go \
                rust cargo \
                iproute2 \
                zip unzip gzip bzip2 xz tar zstd

              echo "=== Configuring user opencode (uid 1000) ==="
              addgroup -g 1000 opencode 2>/dev/null || true
              adduser -D -u 1000 -G opencode -h /home/opencode -s /bin/bash opencode 2>/dev/null || true
              echo "opencode ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/opencode
              chmod 440 /etc/sudoers.d/opencode

              ARCH=$(uname -m)
              if [ "$ARCH" = "x86_64" ]; then
                echo "=== Installing glibc (x86_64) ==="
                curl -sL https://alpine-pkgs.sgerrand.com/sgerrand.rsa.pub \
                  -o /etc/apk/keys/sgerrand.rsa.pub
                curl -sL "https://github.com/sgerrand/alpine-pkg-glibc/releases/download/${GLIBC_VER}/glibc-${GLIBC_VER}.apk" \
                  -o /tmp/glibc.apk
                apk del libc6-compat gcompat 2>/dev/null || true
                apk add --no-cache --force-overwrite /tmp/glibc.apk libstdc++ 2>/dev/null

                echo "=== Replacing opencode binary with glibc build ==="
                curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OC_VER}/opencode-linux-x64.tar.gz" \
                  | tar -xz -C /usr/local/bin
                chmod +x /usr/local/bin/opencode

                mkdir -p /lib64
                ln -sf /usr/glibc-compat/lib/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2
              else
                echo "=== Arch $ARCH: using original musl binary ==="
              fi

              echo "=== Creating pkg-install wrapper ==="
              cat > /usr/local/bin/pkg-install << 'EOFWRAPPER'
              #!/bin/sh
              Q="/home/opencode/.pkg-queue"
              _send() {
                rm -f "$Q/result" "$Q/log"
                echo "$1" > "$Q/request"
                while [ ! -f "$Q/result" ]; do sleep 0.5; done
                cat "$Q/log" 2>/dev/null
                EXIT=$(cat "$Q/result")
                rm -f "$Q/result" "$Q/log"
                return "$EXIT"
              }
              _query() {
                rm -f "$Q/search-result"
                echo "$1" > "$Q/request"
                while [ ! -f "$Q/search-result" ]; do sleep 0.5; done
                cat "$Q/search-result"
                rm -f "$Q/search-result"
              }
              _help() {
                cat << 'EOFHELP'
              pkg-install - Alpine package manager for OpenCode

              USAGE
                pkg-install <package> [package2 ...]    Install packages
                pkg-install --remove  <package> [...]   Remove packages
                pkg-install --search  <keyword>         Search available packages
                pkg-install --info    <package>          Show package details and available versions
                pkg-install --list                       List all installed packages
                pkg-install --help                       Show this help message

              INSTALL WITH SPECIFIC VERSION
                pkg-install <package>=<version>
                Example:  pkg-install nodejs=20.15.1-r0
                Tip:      use --info <package> to see available versions first

              EXAMPLES
                pkg-install openjdk17-jdk               Install Java 17
                pkg-install make cmake gcc               Install multiple packages
                pkg-install nodejs=20.15.1-r0            Install a specific version
                pkg-install --remove openjdk17-jdk       Remove Java 17
                pkg-install --search postgres            Search for PostgreSQL-related packages
                pkg-install --info nodejs                 Show nodejs details and versions

              NOTES
                - Packages are from Alpine Linux repositories (apk).
                - Installed packages are immediately available in PATH.
                - For Python packages, use: pip install <pkg>
                - For Node packages, use:   npm install <pkg>
                - For Go modules, use:      go install <pkg>
                - For Rust crates, use:     cargo install <pkg>
              EOFHELP
              }
              case "$1" in
                --help|-h|"")
                  _help
                  exit 0
                  ;;
                --search)
                  shift
                  [ -z "$1" ] && echo "Usage: pkg-install --search <keyword>" && exit 1
                  _query "SEARCH $*"
                  ;;
                --info)
                  shift
                  [ -z "$1" ] && echo "Usage: pkg-install --info <package>" && exit 1
                  _query "INFO $*"
                  ;;
                --remove)
                  shift
                  [ -z "$1" ] && echo "Usage: pkg-install --remove <package> [...]" && exit 1
                  echo ">> Removing: $*"
                  _send "REMOVE $*"
                  S=$?; [ $S -eq 0 ] && echo ">> Removed successfully." || echo ">> Removal failed."
                  exit $S
                  ;;
                --list)
                  _query "LIST"
                  ;;
                -*)
                  echo "Unknown option: $1"
                  _help
                  exit 1
                  ;;
                *)
                  echo ">> Installing: $*"
                  _send "INSTALL $*"
                  S=$?; [ $S -eq 0 ] && echo ">> Installed successfully." || echo ">> Installation failed."
                  exit $S
                  ;;
              esac
              EOFWRAPPER
              chmod +x /usr/local/bin/pkg-install

              echo "=== Snapshotting filesystem to $PKG ==="
              rm -rf "$PKG"
              mkdir -p "$PKG" "$PKG/etc" "$PKG/tmp"

              cp -a /bin "$PKG/bin"
              ln -sf /usr/bin/bash "$PKG/bin/bash"

              cp -a /sbin "$PKG/sbin"
              cp -a /usr "$PKG/usr"

              cp -a /lib "$PKG/lib"

              cp /etc/passwd "$PKG/etc/passwd"
              cp /etc/group "$PKG/etc/group"
              cp /etc/sudoers "$PKG/etc/sudoers" 2>/dev/null || true
              cp -a /etc/sudoers.d "$PKG/etc/sudoers.d"
              cp -a /etc/apk "$PKG/etc/apk"
              cp -a /etc/ssl "$PKG/etc/ssl"

              mkdir -p "$PKG/lib64"
              [ -d /lib64 ] && cp -a /lib64/* "$PKG/lib64/" 2>/dev/null || true

              touch "$MARKER"
              echo "=== Snapshot complete ($(du -sh "$PKG" | cut -f1)) ==="
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsUser: 0

      containers:
        - name: opencode
          image: "docker.io/beclab/anomalyco-opencode:1.2.27"
          command:
            - sh
            - "-c"
            - |
              exec opencode web --hostname 0.0.0.0 --port 3000
          workingDir: /home/opencode/workspace
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: HOME
              value: /home/opencode
            - name: TERM
              value: xterm-256color
            - name: LD_LIBRARY_PATH
              value: /usr/glibc-compat/lib
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
            - name: opencode-home
              mountPath: /bin
              subPath: .pkg-root/bin
            - name: opencode-home
              mountPath: /sbin
              subPath: .pkg-root/sbin
            - name: opencode-home
              mountPath: /usr
              subPath: .pkg-root/usr
            - name: opencode-home
              mountPath: /etc/passwd
              subPath: .pkg-root/etc/passwd
            - name: opencode-home
              mountPath: /etc/group
              subPath: .pkg-root/etc/group
            - name: opencode-home
              mountPath: /etc/sudoers
              subPath: .pkg-root/etc/sudoers
            - name: opencode-home
              mountPath: /etc/sudoers.d
              subPath: .pkg-root/etc/sudoers.d
            - name: opencode-home
              mountPath: /etc/apk
              subPath: .pkg-root/etc/apk
            - name: opencode-home
              mountPath: /lib
              subPath: .pkg-root/lib
            - name: opencode-home
              mountPath: /lib64
              subPath: .pkg-root/lib64
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        - name: nginx
          image: "docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 60
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 10
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
      terminationGracePeriodSeconds: 10
      restartPolicy: Always
      volumes:
        - name: opencode-home
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
        - name: opencode-workspace
          hostPath:
            path: "{{ .Values.userspace.userData }}/Code"
            type: DirectoryOrCreate
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
            - key: nginx.conf
              path: nginx.conf

---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  ports:
    - name: web
      port: 3000
      targetPort: 3000
  selector:
    io.kompose.service: opencode
status:
  loadBalancer: {}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-pkg-manager
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode-pkg-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: opencode-pkg-manager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: opencode-pkg-manager
    spec:
      terminationGracePeriodSeconds: 5
      initContainers:
        - name: wait-snapshot
          image: "docker.io/beclab/anomalyco-opencode:1.2.27"
          command:
            - sh
            - "-c"
            - |
              echo "=== Waiting for package snapshot ==="
              while ! ls /home/opencode/.pkg-root/.installed-* >/dev/null 2>&1; do
                sleep 2
              done
              echo "=== Snapshot ready ==="
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
      containers:
        - name: pkg-manager
          image: "docker.io/beclab/anomalyco-opencode:1.2.27"
          securityContext:
            runAsUser: 0
          command:
            - sh
            - "-c"
            - |
              QUEUE="/home/opencode/.pkg-queue"
              mkdir -p "$QUEUE"
              rm -f "$QUEUE/request" "$QUEUE/result" "$QUEUE/log" "$QUEUE/search-result"

              trap 'echo "=== Package manager shutting down ==="; exit 143' TERM INT
              echo "=== Package manager ready ==="
              while true; do
                if [ -f "$QUEUE/request" ]; then
                  REQ=$(cat "$QUEUE/request")
                  rm -f "$QUEUE/request"

                  case "$REQ" in
                    SEARCH\ *)
                      KEYWORD="${REQ#SEARCH }"
                      apk search "$KEYWORD" > "$QUEUE/search-result" 2>&1
                      ;;
                    LIST)
                      apk info > "$QUEUE/search-result" 2>&1
                      ;;
                    INFO\ *)
                      TARGET="${REQ#INFO }"
                      { apk policy "$TARGET" 2>/dev/null
                        echo ""
                        apk info -d -s "$TARGET" 2>/dev/null; } > "$QUEUE/search-result" 2>&1
                      ;;
                    REMOVE\ *)
                      PKGS="${REQ#REMOVE }"
                      echo "=== Removing: $PKGS ==="
                      apk del $PKGS > "$QUEUE/log" 2>&1
                      echo $? > "$QUEUE/result"
                      ;;
                    INSTALL\ *)
                      PKGS="${REQ#INSTALL }"
                      echo "=== Installing: $PKGS ==="
                      apk add --no-cache $PKGS > "$QUEUE/log" 2>&1
                      echo $? > "$QUEUE/result"
                      ;;
                    *)
                      echo "=== Installing (legacy): $REQ ==="
                      apk add --no-cache $REQ > "$QUEUE/log" 2>&1
                      echo $? > "$QUEUE/result"
                      ;;
                  esac
                fi
                sleep 1
              done
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-home
              mountPath: /bin
              subPath: .pkg-root/bin
            - name: opencode-home
              mountPath: /sbin
              subPath: .pkg-root/sbin
            - name: opencode-home
              mountPath: /usr
              subPath: .pkg-root/usr
            - name: opencode-home
              mountPath: /lib
              subPath: .pkg-root/lib
            - name: opencode-home
              mountPath: /lib64
              subPath: .pkg-root/lib64
            - name: opencode-home
              mountPath: /etc/apk
              subPath: .pkg-root/etc/apk
            - name: opencode-home
              mountPath: /etc/ssl
              subPath: .pkg-root/etc/ssl
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["test", "-d", "/home/opencode/.pkg-queue"]
            initialDelaySeconds: 10
            periodSeconds: 30
      restartPolicy: Always
      volumes:
        - name: opencode-home
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
