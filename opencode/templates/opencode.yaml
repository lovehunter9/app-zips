{{- $opencodeDomainENV := split  ","  .Values.domain.opencode -}}
{{- $opencodeDomain := index $opencodeDomainENV "_0" -}}
{{- $env := .Values.olaresEnv | default dict -}}
{{- $enableOMO := ne (index $env "OPENCODE_OMO" | default "false") "false" }}
{{- $omoVersion := index $env "OPENCODE_OMO_VERSION" | default "3.17.4" }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: opencode
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: opencode
        bytetrade.io/terminal: opencode
    spec:
      initContainers:
        - name: init-setup
          image: "docker.io/beclab/anomalyco-opencode:1.4.4"
          command:
            - sh
            - "-c"
            - |
              set -e
              wget -q -O /dev/null https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/APKINDEX.tar.gz 2>/dev/null &
              _wpid=$!
              ( sleep 5 && kill "$_wpid" 2>/dev/null ) &
              _gpid=$!
              if ! wait "$_wpid" 2>/dev/null; then
                echo "=== init-setup: Alpine CDN unreachable or too slow, switching to China mirrors ==="
                sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
              fi
              kill "$_gpid" 2>/dev/null || true
              wait "$_gpid" 2>/dev/null || true
              apk add --no-cache python3
              OC_DOMAIN="{{ $opencodeDomain }}"
              export OLARES_OC_DOMAIN="$OC_DOMAIN"
              export OLARES_ENABLE_OMO="{{ if $enableOMO }}1{{ else }}0{{ end }}"
              export OLARES_OMO_VERSION="{{ $omoVersion }}"
              mkdir -p /home/opencode/workspace \
                       /home/opencode/.opencode \
                       /home/opencode/.config/opencode \
                       /home/opencode/.config/opencode/skills/web-preview \
                       /home/opencode/.config/opencode/skills/system-admin \
                       /home/opencode/.pkg-queue
              SKILL="/home/opencode/.config/opencode/skills/web-preview/SKILL.md"
              printf '%s\n' \
                '---' \
                'name: web-preview' \
                'description: "MUST load before running ANY server, creating ANY web page, building ANY project, or showing ANY preview URL. Covers Vite, React, Next.js, Vue, Flask, FastAPI, Go, Rust, static sites. Also load when user says run, start, serve, preview, demo, test, open, launch, deploy, build, create site, create app, create page, show me, make a website."' \
                '---' \
                '' \
                '## How to preview' \
                '' \
                'This environment has a built-in reverse-proxy.' \
                'Dev servers inside the container are reachable at `/__preview/<port>/` on the same domain the user is already on.' \
                '' \
                '## Step 0 — pick the RIGHT dev server (do this FIRST)' \
                '' \
                'Vite is NOT a universal web server. Before touching any command, detect what the' \
                'project actually is by listing the project root and looking at the marker files:' \
                '' \
                '```' \
                'ls -la && cat package.json 2>/dev/null | head -40' \
                '```' \
                '' \
                'Then pick ONE from the table below. If multiple markers exist (e.g. package.json +' \
                'requirements.txt), let the USER-FACING framework decide (e.g. Next.js beats Flask).' \
                '' \
                '| Marker files in project root | Use this | See section |' \
                '|---|---|---|' \
                '| `package.json` with `scripts.dev` or `scripts.start` | `nohup npm run dev -- <flags> > /tmp/dev.log 2>&1 &` (preferred — script may set extra flags) | npm-run-dev below |' \
                '| `vite.config.*` or plain `index.html` only | Vite | Vite section |' \
                '| `next.config.*` | Next.js | Next.js section |' \
                '| `nuxt.config.*` | Nuxt | Nuxt section |' \
                '| `angular.json` | Angular CLI | Angular section |' \
                '| `gatsby-config.*` | Gatsby | Gatsby section |' \
                '| `astro.config.*` | Astro | uses Vite — follow Vite section |' \
                '| `svelte.config.*` + `vite.config.*` | SvelteKit | follow Vite section |' \
                '| `app.py` with `flask` / `fastapi` import | Flask / FastAPI | Python section |' \
                '| `streamlit` / `gradio` / `dash` in requirements | Python dashboards | Python dashboards section |' \
                '| `Cargo.toml` | Rust binary | Go/Rust section |' \
                '| `go.mod` | Go binary | Go/Rust section |' \
                '| `pom.xml` / `build.gradle` | Java (Spring Boot etc.) | Java section |' \
                '| ONLY `.html` / `.css` / `.js` files, no config | Vite (acts as static server) | Vite + Static HTML sections |' \
                '| Nothing recognizable | STOP and ASK the user what stack it is | — |' \
                '' \
                '### Golden rules for Step 0' \
                '' \
                '1. NEVER run `npx vite` on a Next.js / Angular / CRA / Gatsby / Nuxt / Django / Flask' \
                '   project. Each has its own dev server with its own routing/SSR/file-system logic.' \
                '   Vite will either fail to start or serve a broken app.' \
                '2. NEVER run `python3 -m http.server` as a preview server. It cannot handle the' \
                '   `/__preview/<PORT>/` URL prefix and returns 404 for every request.' \
                '3. When a `package.json` `scripts.dev` exists, PREFER `npm run dev` over ad-hoc' \
                '   `npx vite` / `npx next dev`. The script may inject required flags or env vars.' \
                '4. If you see "Blocked request" / "Invalid Host header" / "Disallowed Host" after' \
                '   starting, it is a host allowlist check, NOT a broken proxy. Fix by framework:' \
                '   Vite 6 → `server.allowedHosts: true`; webpack-dev-server → `devServer.allowedHosts: "all"`;' \
                '   CRA → `DANGEROUSLY_DISABLE_HOST_CHECK=true`; Angular → `--disable-host-check`;' \
                '   Django → add to `ALLOWED_HOSTS`.' \
                '' \
                '## Starting dev servers — MANDATORY pattern' \
                '' \
                'EVERY dev server or web service MUST be started with `nohup ... &` so it keeps running after the command returns.' \
                'EVERY dev server MUST bind to `0.0.0.0` (not localhost, not 127.0.0.1).' \
                'EVERY dev server MUST set its base/public path to `/__preview/<port>/`.' \
                '' \
                'General pattern:' \
                '' \
                '```' \
                'nohup <command> --host 0.0.0.0 --port <PORT> --base /__preview/<PORT>/ > /tmp/dev-server.log 2>&1 &' \
                '```' \
                '' \
                'After starting, ALWAYS verify the server is running:' \
                '' \
                '```' \
                'sleep 2 && ss -tlnp | grep <PORT>' \
                '```' \
                '' \
                '## Choosing a port' \
                '' \
                'BEFORE starting any server, check if the port is free:' \
                '```' \
                'ss -tlnp | grep <PORT>' \
                '```' \
                'If the port is in use, pick a different one (e.g. 4000, 4001, 8080, 8081, 9000...).' \
                'NEVER blindly reuse a hardcoded port from examples below — always pick a free port.' \
                '' \
                '## Vite (React / Vue / Svelte / vanilla)' \
                '' \
                '### MANDATORY: write `vite.config.js` BEFORE starting Vite' \
                '' \
                'Vite 6 blocks remote hosts by default (anti-DNS-rebinding). You MUST set' \
                '`server.allowedHosts: true` or the browser will see "Blocked request".' \
                'ALWAYS create/update `vite.config.js` in the project root before `nohup npx vite`:' \
                '' \
                '```js' \
                'import { defineConfig } from "vite";' \
                'export default defineConfig({' \
                '  base: "/__preview/<PORT>/",' \
                '  server: {' \
                '    host: "0.0.0.0",' \
                '    port: <PORT>,' \
                '    allowedHosts: true,   // REQUIRED: accept the Olares reverse-proxy hostname' \
                '    strictPort: true,' \
                '    hmr: {' \
                '      protocol: "wss",    // REQUIRED: browser reaches Olares over HTTPS on 443' \
                '      clientPort: 443,    // KEEP AS 443 — this is the Olares edge port, NOT your dev port' \
                '    },' \
                '  },' \
                '});' \
                '```' \
                '' \
                'Placeholder substitution — before writing this file:' \
                '' \
                '- Replace every `<PORT>` with the port you picked (e.g. `4000`).' \
                '- Keep `clientPort: 443` as literal `443`. It is the HTTPS edge port the browser uses' \
                '  to reach Olares, NOT your dev server port. DO NOT replace it with `<PORT>`.' \
                '- `allowedHosts: true` is literal `true`, not a domain name.' \
                '' \
                'If a `vite.config.js` / `.ts` / `.mjs` already exists, READ it and patch only' \
                '`server.allowedHosts`, `server.hmr`, and `base` — do not clobber the rest.' \
                '' \
                'Then start:' \
                '' \
                '```' \
                'nohup npx vite > /tmp/vite.log 2>&1 &' \
                '```' \
                '' \
                'If the project uses npm scripts, still patch the config first, then:' \
                '' \
                '```' \
                'nohup npm run dev > /tmp/vite.log 2>&1 &' \
                '```' \
                '' \
                'Never rely on CLI flags alone for `allowedHosts` — it is a config-only field in' \
                'Vite 6 and omitting it causes the "Blocked request" page even when `--host 0.0.0.0`' \
                'is passed.' \
                '' \
                '## Next.js' \
                '' \
                'Set basePath in next.config.js BEFORE starting:' \
                '' \
                '```js' \
                'module.exports = { basePath: "/__preview/<PORT>" }' \
                '```' \
                '' \
                'Then:' \
                '' \
                '```' \
                'nohup npx next dev -H 0.0.0.0 -p <PORT> > /tmp/next.log 2>&1 &' \
                '```' \
                '' \
                '## Nuxt (Nuxt 3)' \
                '' \
                'Nuxt uses Vite under the hood; configure the base URL via `nuxt.config.*` OR env:' \
                '' \
                '```js' \
                '// nuxt.config.ts' \
                'export default defineNuxtConfig({' \
                '  app: { baseURL: "/__preview/<PORT>/" },' \
                '  devServer: { host: "0.0.0.0", port: <PORT> },' \
                '  vite: { server: { allowedHosts: true, hmr: { protocol: "wss", clientPort: 443 } } },' \
                '});' \
                '```' \
                '' \
                '```' \
                'nohup npm run dev > /tmp/nuxt.log 2>&1 &' \
                '```' \
                '' \
                '## Angular (ng serve)' \
                '' \
                'Angular has its own dev server (NOT Vite). Required flags:' \
                '' \
                '```' \
                'nohup npx ng serve \\' \
                '  --host 0.0.0.0 --port <PORT> \\' \
                '  --base-href /__preview/<PORT>/ \\' \
                '  --deploy-url /__preview/<PORT>/ \\' \
                '  --disable-host-check \\' \
                '  > /tmp/ng.log 2>&1 &' \
                '```' \
                '' \
                'If you see "Invalid Host header", `--disable-host-check` is mandatory.' \
                '' \
                '## Create React App (CRA) / react-scripts' \
                '' \
                'CRA uses webpack-dev-server. You MUST use env vars (no CLI flags for these):' \
                '' \
                '```' \
                'DANGEROUSLY_DISABLE_HOST_CHECK=true \\' \
                '  HOST=0.0.0.0 PORT=<PORT> \\' \
                '  PUBLIC_URL=/__preview/<PORT> \\' \
                '  WDS_SOCKET_PORT=443 WDS_SOCKET_PROTOCOL=wss \\' \
                '  nohup npm start > /tmp/cra.log 2>&1 &' \
                '```' \
                '' \
                'Also set `"homepage": "/__preview/<PORT>"` in `package.json` so built assets reference' \
                'the correct prefix.' \
                '' \
                '## Gatsby' \
                '' \
                'Set `pathPrefix` in `gatsby-config.*`, then use `--prefix-paths`:' \
                '' \
                '```js' \
                '// gatsby-config.js' \
                'module.exports = { pathPrefix: "/__preview/<PORT>" };' \
                '```' \
                '' \
                '```' \
                'nohup npx gatsby develop -H 0.0.0.0 -p <PORT> --prefix-paths > /tmp/gatsby.log 2>&1 &' \
                '```' \
                '' \
                '## Python (Flask / FastAPI)' \
                '' \
                '⚠ NEVER use `python3 -m http.server` for preview. It cannot handle the' \
                '`/__preview/<PORT>/` URL prefix added by the reverse proxy, and every request' \
                'will 404. For static files use Vite (see "Static HTML" below).' \
                '' \
                'Flask — mount under the preview prefix via `APPLICATION_ROOT` + proxy fix:' \
                '' \
                '```' \
                'APPLICATION_ROOT=/__preview/<PORT> \\' \
                '  nohup flask run --host 0.0.0.0 --port <PORT> > /tmp/flask.log 2>&1 &' \
                '```' \
                '' \
                'FastAPI — pass `root_path` so generated links include the preview prefix:' \
                '' \
                '```' \
                'nohup uvicorn app:app --host 0.0.0.0 --port <PORT> --root-path /__preview/<PORT> > /tmp/uvicorn.log 2>&1 &' \
                '```' \
                '' \
                '## Python dashboards (Streamlit / Gradio / Dash)' \
                '' \
                'These are self-contained dashboard apps. Each has its own way to set a URL prefix:' \
                '' \
                'Streamlit — set `baseUrlPath` via CLI or config:' \
                '' \
                '```' \
                'nohup streamlit run app.py \\' \
                '  --server.address 0.0.0.0 --server.port <PORT> \\' \
                '  --server.baseUrlPath /__preview/<PORT> \\' \
                '  --server.enableXsrfProtection false \\' \
                '  --server.enableCORS false \\' \
                '  > /tmp/streamlit.log 2>&1 &' \
                '```' \
                '' \
                'Gradio — pass `root_path` when launching:' \
                '' \
                '```python' \
                'demo.launch(server_name="0.0.0.0", server_port=<PORT>, root_path="/__preview/<PORT>")' \
                '```' \
                '' \
                'Dash — mount under `requests_pathname_prefix`:' \
                '' \
                '```python' \
                'app = Dash(__name__, requests_pathname_prefix="/__preview/<PORT>/")' \
                'app.run(host="0.0.0.0", port=<PORT>)' \
                '```' \
                '' \
                '## Java (Spring Boot)' \
                '' \
                'Set `server.servlet.context-path` in `application.properties` / `application.yml`:' \
                '' \
                '```' \
                'server.address=0.0.0.0' \
                'server.port=<PORT>' \
                'server.servlet.context-path=/__preview/<PORT>' \
                '```' \
                '' \
                '```' \
                'nohup ./mvnw spring-boot:run > /tmp/spring.log 2>&1 &' \
                '```' \
                '' \
                '## Static HTML (no bundler)' \
                '' \
                'ALWAYS use Vite to serve static HTML. `python3 -m http.server` will NOT work here.' \
                '' \
                'Step 1: write `vite.config.js` in the directory that contains the HTML (see the' \
                'Vite section above — `allowedHosts: true` and `base` are BOTH mandatory).' \
                '' \
                'Step 2: ensure an `index.html` exists at the directory root. If your file is named' \
                'something else (e.g. `clock.html`), either rename it to `index.html` or point users' \
                'to `/__preview/<PORT>/clock.html`.' \
                '' \
                'Step 3:' \
                '' \
                '```' \
                'nohup npx vite > /tmp/vite.log 2>&1 &' \
                '```' \
                '' \
                '## Go / Rust / Other custom servers' \
                '' \
                'Make sure the server listens on 0.0.0.0:<PORT>, then:' \
                '' \
                '```' \
                'nohup ./myserver --addr 0.0.0.0:<PORT> > /tmp/server.log 2>&1 &' \
                '```' \
                '' \
                '## Stopping a dev server' \
                '' \
                '```' \
                'kill $(lsof -t -i:<PORT>)   # or: pkill -f "vite"' \
                '```' \
                '' \
                '## Preview URL' \
                '' \
                'NEVER use localhost or 127.0.0.1 in any URL you show to the user.' \
                'The domain for this OpenCode instance is: '"$OC_DOMAIN" \
                '' \
                'Tell the user:' \
                '`https://'"$OC_DOMAIN"'/__preview/<port>/`' \
                '' \
                'Example (if your dev server runs on port 4000):' \
                '`https://'"$OC_DOMAIN"'/__preview/4000/`' \
                '' \
                '## CRITICAL rules (MUST follow every time)' \
                '' \
                '1. ALWAYS do Step 0 FIRST — detect the stack from marker files and pick the correct' \
                '   dev server. NEVER run `npx vite` on a Next.js / Angular / Gatsby / CRA / Nuxt /' \
                '   Django / Flask project. Each has its own runner.' \
                '2. When `package.json` has `scripts.dev` or `scripts.start`, PREFER `npm run dev` /' \
                '   `npm start` over ad-hoc framework CLIs — the script may add required flags.' \
                '3. ALWAYS use `nohup ... > /tmp/<name>.log 2>&1 &` to start servers — NEVER run in foreground' \
                '4. ALWAYS bind to `0.0.0.0` — NEVER localhost or 127.0.0.1' \
                '5. ALWAYS set the preview prefix on the server:' \
                '   Vite → `base: "/__preview/<PORT>/"` in vite.config;' \
                '   Next.js → `basePath`; Nuxt → `app.baseURL`; Angular → `--base-href`;' \
                '   Gatsby → `pathPrefix` + `--prefix-paths`; CRA → `PUBLIC_URL`;' \
                '   FastAPI → `--root-path`; Flask → `APPLICATION_ROOT`;' \
                '   Streamlit → `--server.baseUrlPath`; Gradio → `root_path`;' \
                '   Spring Boot → `server.servlet.context-path`.' \
                '   Without the prefix, assets 404.' \
                '6. For Vite, ALWAYS write `vite.config.js` with `server.allowedHosts: true` AND' \
                '   `server.hmr: { protocol: "wss", clientPort: 443 }` BEFORE starting. Without' \
                '   `allowedHosts`, Vite 6 returns "Blocked request" to proxied hostnames. Without' \
                '   the HMR overrides, hot-reload silently breaks.' \
                '7. NEVER use `python3 -m http.server` for preview — it ignores URL prefixes and every' \
                '   request returns 404 behind the /__preview/<PORT>/ proxy. Use Vite for static files.' \
                '8. "Blocked request" / "Invalid Host header" / "Disallowed Host" means a host' \
                '   allowlist kicked in — fix the framework config (see Step 0 Golden rule 4), do NOT' \
                '   assume the proxy is broken.' \
                '9. ALWAYS verify the server is running after starting: `sleep 2 && ss -tlnp | grep <PORT>`' \
                '10. NEVER output `http://localhost` or `127.0.0.1` in any URL — the user accesses remotely' \
                '11. The trailing slash after the port number is REQUIRED: `/__preview/<PORT>/` not `/__preview/<PORT>`' \
                '12. If a port is busy, pick another port and adjust the server prefix accordingly' \
                '13. When the user asks to "create a web page", "build a website", or "start a project":' \
                '    automatically create the project, install deps, start the dev server with nohup, and show the preview URL' \
                > "$SKILL"
              ADMIN="/home/opencode/.config/opencode/skills/system-admin/SKILL.md"
              printf '%s\n' \
                '---' \
                'name: system-admin' \
                'description: "MUST load before installing ANY system package. Provides pkg-install for Java, Python, Go, Rust, FFmpeg, databases, compilers, and all Alpine packages."' \
                '---' \
                '' \
                '## pkg-install — system package manager' \
                '' \
                'This environment is Alpine Linux. Use `pkg-install` to manage system packages.' \
                '`sudo` and `apk` are NOT available directly — always use `pkg-install`.' \
                '' \
                '### Install' \
                '' \
                '```' \
                'pkg-install <package> [package2 ...]' \
                '```' \
                '' \
                'Examples:' \
                '' \
                '```' \
                'pkg-install openjdk17-jdk          # install Java 17' \
                'pkg-install make cmake gcc          # install multiple packages' \
                'pkg-install nodejs=20.15.1-r0       # install a specific version' \
                '```' \
                '' \
                '### Remove' \
                '' \
                '```' \
                'pkg-install --remove <package> [...]' \
                '```' \
                '' \
                '### Search, Info, List' \
                '' \
                '```' \
                'pkg-install --search <keyword>      # search available packages' \
                'pkg-install --info <package>         # show details and available versions' \
                'pkg-install --list                   # list all installed packages' \
                'pkg-install --help                   # show full help' \
                '```' \
                '' \
                '### Version pinning' \
                '' \
                'To install a specific version, append `=<version>`:' \
                '' \
                '```' \
                'pkg-install nodejs=20.15.1-r0' \
                '```' \
                '' \
                'Use `pkg-install --info <package>` first to see available versions.' \
                '' \
                '## Common package names (Alpine)' \
                '' \
                '| Need                | Package name        |' \
                '|---------------------|---------------------|' \
                '| Java 17             | openjdk17-jdk       |' \
                '| Java 21             | openjdk21-jdk       |' \
                '| GCC / G++ / Make    | build-base          |' \
                '| CMake               | cmake               |' \
                '| SQLite              | sqlite              |' \
                '| PostgreSQL client   | postgresql-client   |' \
                '| MySQL / MariaDB cli | mariadb-client      |' \
                '| Redis cli           | redis               |' \
                '| FFmpeg              | ffmpeg              |' \
                '| ImageMagick         | imagemagick         |' \
                '| PHP                 | php83               |' \
                '| Ruby                | ruby                |' \
                '| Perl                | perl                |' \
                '| Lua                 | lua5.4              |' \
                '| .NET SDK            | dotnet8-sdk         |' \
                '| Nginx               | nginx               |' \
                '| Docker CLI          | docker-cli          |' \
                '| tmux                | tmux                |' \
                '| vim / neovim        | vim / neovim        |' \
                '| jq / yq            | jq / yq             |' \
                '' \
                '## Pre-installed tools' \
                '' \
                'The following are already available (no install needed):' \
                '' \
                '- **Languages**: python3, pip, node, npm, go, rustc, cargo' \
                '- **VCS**: git' \
                '- **Network**: curl, wget, ssh, ss' \
                '- **Shell**: bash' \
                '- **Compression**: zip, unzip, gzip, bzip2, xz, tar, zstd' \
                '' \
                '## Language-specific package managers' \
                '' \
                'For language ecosystem packages, use the native tool directly (no pkg-install needed):' \
                '' \
                '```' \
                'pip install <pkg>           # Python' \
                'npm install <pkg>           # Node.js' \
                'go install <pkg>@latest     # Go' \
                'cargo install <pkg>         # Rust' \
                '```' \
                '' \
                '## Rules' \
                '' \
                '- ALWAYS use `pkg-install` for system packages' \
                '- NEVER use `sudo`, `apk`, or download binaries manually' \
                '- NEVER tell the user that system packages cannot be installed — they CAN via pkg-install' \
                '- NEVER modify ~/.profile or ~/.bashrc for PATH — packages install to standard paths' \
                '- When unsure about the package name, use `pkg-install --search <keyword>` first' \
                > "$ADMIN"
              echo "=== Olares global baseline / plugin + workspace legacy instructions cleanup (python) ==="
              OLARES_PY=/tmp/olares-init-opencode-cfg.py
              printf '%s\n' \
                'import json' \
                'import os' \
                'from pathlib import Path' \
                '' \
                'DOMAIN = os.environ.get("OLARES_OC_DOMAIN", "")' \
                'ENABLE_OMO = os.environ.get("OLARES_ENABLE_OMO", "0") == "1"' \
                'BASELINE_MD = Path("/home/opencode/.config/opencode/olares-baseline-instructions.md")' \
                'GLOBAL_JSON = Path("/home/opencode/.config/opencode/opencode.json")' \
                'WORKSPACE_JSON = Path("/home/opencode/workspace/opencode.json")' \
                'OLARES_REF = "/home/opencode/.config/opencode/olares-baseline-instructions.md"' \
                'PLUGIN_NPM = "oh-my-openagent"' \
                'STALE_PLUGIN_NPM = "oh-my-opencode"' \
                '' \
                'LEGACY_S1 = (' \
                '    "CRITICAL: You have special skills. ALWAYS run /skill load web-preview BEFORE any task involving "' \
                '    "web, server, preview, run, start, serve, build, create, demo, test, launch, deploy, site, app, page, "' \
                '    "website, frontend, backend, API, port, vite, react, next, vue, flask, go server, python server. "' \
                '    "ALWAYS run /skill load system-admin BEFORE installing ANY system package."' \
                ')' \
                'LEGACY_S2 = "NEVER use sudo, apt, or apk directly. Use pkg-install instead."' \
                'LEGACY_S3 = (' \
                '    f"NEVER show localhost URLs. The domain is {DOMAIN}. "' \
                '    f"Dev server preview URL format: https://{DOMAIN}/__preview/<port>/"' \
                ')' \
                'LEGACY = {LEGACY_S1, LEGACY_S2, LEGACY_S3}' \
                '' \
                'BASELINE_MD.parent.mkdir(parents=True, exist_ok=True)' \
                'md = (' \
                '    "<!-- olares-managed: baseline-instructions v1 (rewritten each pod start) -->\\n\\n"' \
                '    "# Olares environment baseline\\n\\n"' \
                '    "## Web preview and dev servers\\n\\n"' \
                '    + LEGACY_S1' \
                '    + "\\n\\n## System packages\\n\\n"' \
                '    + LEGACY_S2' \
                '    + "\\n\\n## URLs and domain\\n\\n"' \
                '    + LEGACY_S3' \
                '    + "\\n"' \
                ')' \
                'BASELINE_MD.write_text(md, encoding="utf-8")' \
                '' \
                'cfg = {}' \
                'if GLOBAL_JSON.is_file():' \
                '    try:' \
                '        cfg = json.loads(GLOBAL_JSON.read_text(encoding="utf-8"))' \
                '    except json.JSONDecodeError:' \
                '        cfg = {}' \
                'instr = cfg.get("instructions")' \
                'if not isinstance(instr, list):' \
                '    instr = []' \
                'if OLARES_REF not in instr:' \
                '    instr = list(instr) + [OLARES_REF]' \
                'cfg["instructions"] = instr' \
                'cfg.setdefault("$schema", "https://opencode.ai/config.json")' \
                'plugins = cfg.get("plugin")' \
                'if not isinstance(plugins, list):' \
                '    plugins = []' \
                'plugins = [p for p in plugins if isinstance(p, str)]' \
                'plugins = [p for p in plugins if p != STALE_PLUGIN_NPM]' \
                'if ENABLE_OMO:' \
                '    plugins = [p for p in plugins if p != PLUGIN_NPM]' \
                '    plugins.append(PLUGIN_NPM)' \
                'else:' \
                '    plugins = [p for p in plugins if p != PLUGIN_NPM]' \
                'if plugins:' \
                '    cfg["plugin"] = plugins' \
                'else:' \
                '    cfg.pop("plugin", None)' \
                'GLOBAL_JSON.parent.mkdir(parents=True, exist_ok=True)' \
                'GLOBAL_JSON.write_text(json.dumps(cfg, indent=2, ensure_ascii=False), encoding="utf-8")' \
                '' \
                '' \
                'if WORKSPACE_JSON.is_file():' \
                '    try:' \
                '        wcfg = json.loads(WORKSPACE_JSON.read_text(encoding="utf-8"))' \
                '    except json.JSONDecodeError:' \
                '        wcfg = None' \
                '    if wcfg is not None:' \
                '        winst = wcfg.get("instructions")' \
                '        legacy_changed = False' \
                '        if isinstance(winst, list):' \
                '            new_inst = [x for x in winst if x not in LEGACY]' \
                '            if new_inst != winst:' \
                '                legacy_changed = True' \
                '                if new_inst:' \
                '                    wcfg["instructions"] = new_inst' \
                '                else:' \
                '                    wcfg.pop("instructions", None)' \
                '        only_schema = isinstance(wcfg, dict) and set(wcfg.keys()) == {"$schema"}' \
                '        if legacy_changed:' \
                '            if not wcfg or only_schema:' \
                '                WORKSPACE_JSON.unlink(missing_ok=True)' \
                '            else:' \
                '                WORKSPACE_JSON.write_text(json.dumps(wcfg, indent=2, ensure_ascii=False), encoding="utf-8")' \
                '        elif only_schema:' \
                '            WORKSPACE_JSON.unlink(missing_ok=True)' \
                > "$OLARES_PY"
              python3 "$OLARES_PY"
              rm -f "$OLARES_PY"
              OMO_AGENT_CFG="/home/opencode/.config/opencode/oh-my-openagent.json"
              if [ ! -f "$OMO_AGENT_CFG" ]; then
                echo "=== Writing default oh-my-openagent.json ==="
                printf '%s\n' \
                  '{' \
                  '  "$schema": "https://raw.githubusercontent.com/code-yeongyu/oh-my-openagent/dev/assets/oh-my-opencode.schema.json",' \
                  '  "runtime_fallback": { "enabled": true, "max_fallback_attempts": 7 },' \
                  '  "agents": {' \
                  '    "sisyphus": { "model": "anthropic/claude-opus-4-6", "variant": "max", "fallback_models": [' \
