---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: opencode
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: opencode
    spec:
      initContainers:
        - name: init-setup
          image: "docker.io/beclab/aboveos-busybox:1.37.0"
          command:
            - sh
            - "-c"
            - |
              mkdir -p /home/opencode/workspace \
                       /home/opencode/.opencode \
                       /home/opencode/.config/opencode \
                       /home/opencode/.config/opencode/skills/web-preview
              SKILL="/home/opencode/.config/opencode/skills/web-preview/SKILL.md"
              printf '%s\n' \
                '---' \
                'name: web-preview' \
                'description: Preview web applications running in this environment' \
                '---' \
                '' \
                '## How to preview' \
                '' \
                'This environment has a built-in reverse-proxy.' \
                'Dev servers inside the container are reachable at /__preview/<port>/ on the same domain the user is already on.' \
                'The proxy passes the FULL request URI to the dev server, so the framework MUST set its base/public path to /__preview/<port>/.' \
                '' \
                '## Vite (React / Vue / Svelte / vanilla)' \
                '' \
                'ALWAYS pass --base and --host:' \
                '' \
                '```' \
                'npx vite --host 0.0.0.0 --port 5173 --base /__preview/5173/' \
                '```' \
                '' \
                'Or if the project uses npm scripts:' \
                '' \
                '```' \
                'npm run dev -- --host 0.0.0.0 --port 5173 --base /__preview/5173/' \
                '```' \
                '' \
                'If you scaffold a NEW Vite project, also add base to vite.config:' \
                '' \
                '```js' \
                'export default defineConfig({ base: "/__preview/5173/" })' \
                '```' \
                '' \
                '## Next.js' \
                '' \
                'Set basePath in next.config.js BEFORE starting:' \
                '' \
                '```js' \
                'module.exports = { basePath: "/__preview/3001" }' \
                '```' \
                '' \
                'Then start:' \
                '' \
                '```' \
                'npx next dev -H 0.0.0.0 -p 3001' \
                '```' \
                '' \
                '## Static HTML (no module bundler)' \
                '' \
                'Use Vite to serve static files too:' \
                '' \
                '```' \
                'npx vite --host 0.0.0.0 --port 5173 --base /__preview/5173/' \
                '```' \
                '' \
                '## Preview URL' \
                '' \
                'NEVER use localhost or 127.0.0.1 in any preview URL you show to the user.' \
                'The user opens OpenCode from a REMOTE browser.' \
                '' \
                'Tell the user:' \
                '"Append /__preview/<port>/ to your current OpenCode URL in the browser."' \
                '' \
                'Example: if the user is on https://abc123.example.olares.cn, tell them:' \
                'https://abc123.example.olares.cn/__preview/5173/' \
                '' \
                '## CRITICAL rules' \
                '' \
                '- ALWAYS set --base /__preview/<port>/ (Vite) or basePath (Next.js). Without this, assets will 404.' \
                '- ALWAYS bind to 0.0.0.0, NEVER localhost or 127.0.0.1' \
                '- NEVER output http://localhost in any URL shown to the user' \
                '- The trailing slash after the port number is REQUIRED' \
                '- If a port is busy, pick another port and adjust --base accordingly' \
                '- Keep the dev server running in the foreground so it stays alive' \
                > "$SKILL"
              chown -R 1000:1000 /home/opencode/.opencode \
                                 /home/opencode/.config
              chown 1000:1000 /home/opencode /home/opencode/workspace
          resources: {}
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0

        - name: init-packages
          image: "docker.io/beclab/anomalyco-opencode:1.2.27"
          command:
            - sh
            - "-c"
            - |
              PKG="/home/opencode/.pkg-root"
              OC_VER="1.2.27"
              PKG_VER="v2"
              GLIBC_VER="2.35-r1"
              MARKER="$PKG/.installed-${OC_VER}-${PKG_VER}"

              if [ -f "$MARKER" ]; then
                echo "=== Package snapshot cached (${OC_VER}-${PKG_VER}) ==="
                exit 0
              fi

              echo "=== Installing system packages ==="
              apk add --no-cache \
                python3 py3-pip \
                git \
                sudo \
                curl wget \
                bash \
                openssh-client \
                nodejs npm \
                go \
                rust cargo \
                iproute2 \
                zip unzip gzip bzip2 xz tar zstd

              echo "=== Configuring user opencode (uid 1000) ==="
              addgroup -g 1000 opencode 2>/dev/null || true
              adduser -D -u 1000 -G opencode -h /home/opencode -s /bin/bash opencode 2>/dev/null || true
              echo "opencode ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/opencode
              chmod 440 /etc/sudoers.d/opencode

              ARCH=$(uname -m)
              if [ "$ARCH" = "x86_64" ]; then
                echo "=== Installing glibc (x86_64) ==="
                curl -sL https://alpine-pkgs.sgerrand.com/sgerrand.rsa.pub \
                  -o /etc/apk/keys/sgerrand.rsa.pub
                curl -sL "https://github.com/sgerrand/alpine-pkg-glibc/releases/download/${GLIBC_VER}/glibc-${GLIBC_VER}.apk" \
                  -o /tmp/glibc.apk
                apk del libc6-compat gcompat 2>/dev/null || true
                apk add --no-cache --force-overwrite /tmp/glibc.apk libstdc++ 2>/dev/null

                echo "=== Replacing opencode binary with glibc build ==="
                curl -fsSL "https://github.com/anomalyco/opencode/releases/download/v${OC_VER}/opencode-linux-x64.tar.gz" \
                  | tar -xz -C /usr/local/bin
                chmod +x /usr/local/bin/opencode

                mkdir -p /lib64
                ln -sf /usr/glibc-compat/lib/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2
              else
                echo "=== Arch $ARCH: using original musl binary ==="
              fi

              echo "=== Snapshotting filesystem to $PKG ==="
              rm -rf "$PKG"
              mkdir -p "$PKG"

              cp -a /bin "$PKG/rootbin"
              ln -sf /usr/bin/bash "$PKG/rootbin/bash"

              cp -a /sbin "$PKG/sbin"
              cp -a /usr "$PKG/usr"

              cp /etc/passwd "$PKG/etc_passwd"
              cp /etc/group "$PKG/etc_group"
              cp /etc/sudoers "$PKG/etc_sudoers" 2>/dev/null || true
              cp -a /etc/sudoers.d "$PKG/etc_sudoers_d"
              cp -a /etc/apk "$PKG/etc_apk"

              mkdir -p "$PKG/lib_apk"
              cp -a /lib/apk/* "$PKG/lib_apk/" 2>/dev/null || true

              mkdir -p "$PKG/lib64"
              [ -d /lib64 ] && cp -a /lib64/* "$PKG/lib64/" 2>/dev/null || true

              touch "$MARKER"
              echo "=== Snapshot complete ($(du -sh "$PKG" | cut -f1)) ==="
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsUser: 0

      containers:
        - name: opencode
          image: "docker.io/beclab/anomalyco-opencode:1.2.27"
          command:
            - sh
            - "-c"
            - |
              exec opencode web --hostname 0.0.0.0 --port 3000
          workingDir: /home/opencode/workspace
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: HOME
              value: /home/opencode
            - name: TERM
              value: xterm-256color
            - name: LD_LIBRARY_PATH
              value: /usr/glibc-compat/lib
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
          ports:
            - containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: opencode-home
              mountPath: /home/opencode
            - name: opencode-workspace
              mountPath: /home/opencode/workspace
            - name: opencode-home
              mountPath: /bin
              subPath: .pkg-root/rootbin
            - name: opencode-home
              mountPath: /sbin
              subPath: .pkg-root/sbin
            - name: opencode-home
              mountPath: /usr
              subPath: .pkg-root/usr
            - name: opencode-home
              mountPath: /etc/passwd
              subPath: .pkg-root/etc_passwd
            - name: opencode-home
              mountPath: /etc/group
              subPath: .pkg-root/etc_group
            - name: opencode-home
              mountPath: /etc/sudoers
              subPath: .pkg-root/etc_sudoers
            - name: opencode-home
              mountPath: /etc/sudoers.d
              subPath: .pkg-root/etc_sudoers_d
            - name: opencode-home
              mountPath: /etc/apk
              subPath: .pkg-root/etc_apk
            - name: opencode-home
              mountPath: /lib/apk
              subPath: .pkg-root/lib_apk
            - name: opencode-home
              mountPath: /lib64
              subPath: .pkg-root/lib64
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
        - name: nginx
          image: "docker.io/beclab/aboveos-bitnami-openresty:1.25.3-2"
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: OPENRESTY_CONF_FILE
              value: /etc/nginx/nginx.conf
          startupProbe:
            tcpSocket:
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            timeoutSeconds: 60
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 10
          resources:
            limits:
              cpu: 100m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-config
              mountPath: /opt/bitnami/openresty/nginx/conf/server_blocks/nginx.conf
              subPath: nginx.conf
      restartPolicy: Always
      volumes:
        - name: opencode-home
          hostPath:
            path: "{{ .Values.userspace.appData }}"
            type: DirectoryOrCreate
        - name: opencode-workspace
          hostPath:
            path: "{{ .Values.userspace.userData }}/Code"
            type: DirectoryOrCreate
        - name: nginx-config
          configMap:
            name: nginx-config
            defaultMode: 438
            items:
            - key: nginx.conf
              path: nginx.conf

---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  ports:
    - name: web
      port: 3000
      targetPort: 3000
  selector:
    io.kompose.service: opencode
status:
  loadBalancer: {}
