{{- $opencodeDomainENV := split  ","  .Values.domain.opencode -}}
{{- $opencodeDomain := index $opencodeDomainENV "_0" -}}
{{- $env := .Values.olaresEnv | default dict -}}
{{- $enableOMO := ne (index $env "OPENCODE_OMO" | default "false") "false" }}
{{- $omoVersion := index $env "OPENCODE_OMO_VERSION" | default "3.17.4" }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: "{{ .Release.Namespace }}"
  labels:
    io.kompose.service: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: opencode
  strategy:
    type: Recreate
  template:
    metadata:
      creationTimestamp: null
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: opencode
        bytetrade.io/terminal: opencode
    spec:
      initContainers:
        - name: init-setup
          image: "docker.io/beclab/anomalyco-opencode:1.4.4"
          command:
            - sh
            - "-c"
            - |
              set -e
              wget -q -O /dev/null https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/APKINDEX.tar.gz 2>/dev/null &
              _wpid=$!
              ( sleep 5 && kill "$_wpid" 2>/dev/null ) &
              _gpid=$!
              if ! wait "$_wpid" 2>/dev/null; then
                echo "=== init-setup: Alpine CDN unreachable or too slow, switching to China mirrors ==="
                sed -i 's|dl-cdn.alpinelinux.org|mirrors.aliyun.com|g' /etc/apk/repositories
              fi
              kill "$_gpid" 2>/dev/null || true
              wait "$_gpid" 2>/dev/null || true
              apk add --no-cache python3
              OC_DOMAIN="{{ $opencodeDomain }}"
              export OLARES_OC_DOMAIN="$OC_DOMAIN"
              export OLARES_ENABLE_OMO="{{ if $enableOMO }}1{{ else }}0{{ end }}"
              export OLARES_OMO_VERSION="{{ $omoVersion }}"
              mkdir -p /home/opencode/workspace \
                       /home/opencode/.opencode \
                       /home/opencode/.config/opencode \
                       /home/opencode/.config/opencode/skills/web-preview \
                       /home/opencode/.config/opencode/skills/system-admin \
                       /home/opencode/.pkg-queue
              SKILL="/home/opencode/.config/opencode/skills/web-preview/SKILL.md"
              printf '%s\n' \
                '---' \
                'name: web-preview' \
                'description: "MANDATORY for ANY web server. Use ONLY: webstart <name> <command>. NEVER use nohup, &, disown, or run dev servers in foreground — they all DIE before the user sees them. Covers Vite, Next.js, Vue, Flask, FastAPI, etc. Load on: run, start, serve, preview, demo, test, launch, build, create site, create app, create page, show, make website."' \
                '---' \
                '' \
                '## TL;DR (read this first, every time)' \
                '' \
                '```' \
                'webstart <name> <command-as-you-would-type-foreground>' \
                '```' \
                '' \
                'That is the ONLY correct way to start any dev server in this environment.' \
                '' \
                '- DO use:    `webstart vite npx vite --port 4000 --host 0.0.0.0`' \
                '- DO use:    `webstart vite npm run dev`' \
                '- DO use:    `webstart api uvicorn app:app --host 0.0.0.0 --port 8000`' \
                '- DO NOT:    `nohup <cmd> > log 2>&1 &`     ← will die' \
                '- DO NOT:    `<cmd> &` / `<cmd> & disown`   ← will die' \
                '- DO NOT:    run dev server in foreground   ← will die at turn end' \
                '' \
                'Why: the agent shell tool reaps every background process when the turn ends.' \
                '`webstart` uses `setsid + nohup + stdio detach` so the server actually survives.' \
                '' \
                'After `webstart` succeeds, READ its output line:' \
                '`webstart: '"'"'vite-4000'"'"' running (pid 1234, port 4000), log: /tmp/web-vite-4000.log`' \
                '→ the preview URL is `https://'"$OC_DOMAIN"'/__preview/4000/`' \
                '' \
                '## For Vite (most common case)' \
                '' \
                'Vite 6 blocks unknown hosts → MUST write `vite.config.js` BEFORE webstart:' \
                '' \
                '```js' \
                'import { defineConfig } from "vite";' \
                'export default defineConfig({' \
                '  base: "/__preview/<PORT>/",' \
                '  server: { host: "0.0.0.0", port: <PORT>, allowedHosts: true,' \
                '    hmr: { protocol: "wss", clientPort: 443 } },' \
                '});' \
                '```' \
                '' \
                'Replace `<PORT>` with your real port. `clientPort: 443` stays literal 443.' \
                'Then: `webstart vite npx vite`' \
                '' \
                '## How to preview' \
                '' \
                'This environment has a built-in reverse-proxy.' \
                'Dev servers inside the container are reachable at `/__preview/<port>/` on the same domain the user is already on.' \
                '' \
                '## Step 0 — pick the RIGHT dev server (do this FIRST)' \
                '' \
                'Vite is NOT a universal web server. Before touching any command, detect what the' \
                'project actually is by listing the project root and looking at the marker files:' \
                '' \
                '```' \
                'ls -la && cat package.json 2>/dev/null | head -40' \
                '```' \
                '' \
                'Then pick ONE from the table below. If multiple markers exist (e.g. package.json +' \
                'requirements.txt), let the USER-FACING framework decide (e.g. Next.js beats Flask).' \
                '' \
                '| Marker files in project root | Use this | See section |' \
                '|---|---|---|' \
                '| `package.json` with `scripts.dev` or `scripts.start` | `webstart <name> npm run dev` (preferred — script may set extra flags) | per-framework sections below |' \
                '| `vite.config.*` or plain `index.html` only | Vite | Vite section |' \
                '| `next.config.*` | Next.js | Next.js section |' \
                '| `nuxt.config.*` | Nuxt | Nuxt section |' \
                '| `angular.json` | Angular CLI | Angular section |' \
                '| `gatsby-config.*` | Gatsby | Gatsby section |' \
                '| `astro.config.*` | Astro | uses Vite — follow Vite section |' \
                '| `svelte.config.*` + `vite.config.*` | SvelteKit | follow Vite section |' \
                '| `app.py` with `flask` / `fastapi` import | Flask / FastAPI | Python section |' \
                '| `streamlit` / `gradio` / `dash` in requirements | Python dashboards | Python dashboards section |' \
                '| `Cargo.toml` | Rust binary | Go/Rust section |' \
                '| `go.mod` | Go binary | Go/Rust section |' \
                '| `pom.xml` / `build.gradle` | Java (Spring Boot etc.) | Java section |' \
                '| ONLY `.html` / `.css` / `.js` files, no config | Vite (acts as static server) | Vite + Static HTML sections |' \
                '| Nothing recognizable | STOP and ASK the user what stack it is | — |' \
                '' \
                '### Golden rules for Step 0' \
                '' \
                '1. NEVER run `npx vite` on a Next.js / Angular / CRA / Gatsby / Nuxt / Django / Flask' \
                '   project. Each has its own dev server with its own routing/SSR/file-system logic.' \
                '   Vite will either fail to start or serve a broken app.' \
                '2. NEVER run `python3 -m http.server` as a preview server. It cannot handle the' \
                '   `/__preview/<PORT>/` URL prefix and returns 404 for every request.' \
                '3. When a `package.json` `scripts.dev` exists, PREFER `npm run dev` over ad-hoc' \
                '   `npx vite` / `npx next dev`. The script may inject required flags or env vars.' \
                '4. If you see "Blocked request" / "Invalid Host header" / "Disallowed Host" after' \
                '   starting, it is a host allowlist check, NOT a broken proxy. Fix by framework:' \
                '   Vite 6 → `server.allowedHosts: true`; webpack-dev-server → `devServer.allowedHosts: "all"`;' \
                '   CRA → `DANGEROUSLY_DISABLE_HOST_CHECK=true`; Angular → `--disable-host-check`;' \
                '   Django → add to `ALLOWED_HOSTS`.' \
                '' \
                '## Starting dev servers — MANDATORY: use `webstart`' \
                '' \
                '⚠ DO NOT use `nohup cmd &` directly. The opencode shell tool kills background' \
                'processes when the agent turn ends, so the server you just started will die before' \
                'the user can reach the URL. ALWAYS use the `webstart` wrapper, which uses' \
                '`setsid + nohup + full stdio detachment` so the server survives shell exit.' \
                '' \
                '### `webstart` — the only correct way to start a dev server here' \
                '' \
                '```' \
                'webstart <BASE_NAME> <COMMAND> [ARGS...]' \
                '```' \
                '' \
                '- `<BASE_NAME>` is a short identifier you pick (e.g. `vite`, `next`, `flask`, `app`).' \
                '  webstart will AUTO-SUFFIX it with the listening port, so the actual NAME you get' \
                '  back is e.g. `vite-5173`, `next-3000`, `flask-5000`.' \
                '- `<COMMAND>` is the dev server CLI as you would type it in the foreground.' \
                '  No `nohup`, no `&`, no `> log 2>&1` — `webstart` does all of that for you.' \
                '' \
                '### NAME auto-suffix & uniqueness' \
                '' \
                'webstart resolves the final NAME like this:' \
                '' \
                '1. It scans your COMMAND for a port (`--port N`, `-p N`, `--server.port N`,' \
                '   `--server-port N`, `--listen-port N`, `--port=N`, `PORT=N`).' \
                '2. If still no port, it snapshots listening sockets BEFORE/AFTER launch and picks' \
                '   the new port that appeared.' \
                '3. Final NAME = `<BASE>-<PORT>` if a port was found, otherwise just `<BASE>`.' \
                '' \
                'CONSEQUENCE: two concurrent servers on different ports automatically get different' \
                'NAMES, so you can safely reuse the same BASE_NAME — they will not clash.' \
                '' \
                '```' \
                'webstart vite npx vite                       # → "vite-5173" (Vite default)' \
                'webstart vite npx storybook dev -p 6006      # → "vite-6006" (different — both run)' \
                '```' \
                '' \
                'If two `webstart` invocations resolve to the SAME final NAME (same BASE + same port),' \
                'webstart treats the second call as a RESTART: it kills the previous process and' \
                'replaces it. This is intentional — convenient for "fix config and relaunch".' \
                '' \
                'After every `webstart` call, READ the success line:' \
                '' \
                '```' \
                "webstart: 'vite-5173' running (pid 1234, port 5173), log: /tmp/web-vite-5173.log" \
                '```' \
                '' \
                'The quoted name is what you pass to `webstop`. Use `weblist` any time to see all' \
                'running servers with their resolved NAME, PID and PORT.' \
                '' \
                'Examples (replace `<PORT>` with your real port number):' \
                '' \
                '```' \
                'webstart vite    npx vite' \
                'webstart next    npx next dev -H 0.0.0.0 -p <PORT>' \
                'webstart flask   flask run --host 0.0.0.0 --port <PORT>' \
                'webstart api     uvicorn app:app --host 0.0.0.0 --port <PORT> --root-path /__preview/<PORT>' \
                '```' \
                '' \
                'EVERY dev server MUST also: bind to `0.0.0.0` (not localhost / 127.0.0.1) AND set' \
                'its base/public path to `/__preview/<PORT>/` (see per-framework sections below).' \
                '' \
                '### Verify, manage, stop' \
                '' \
                '```' \
                'weblist                          # list all running webstart-managed servers' \
                'tail -f /tmp/web-<NAME>.log      # follow logs (use the resolved NAME)' \
                'webstop <NAME>                   # exact NAME from weblist (safe)' \
                'webstop --prefix <BASE>          # explicit batch — stops every "<BASE>-*"' \
                'webstop --all                    # stop everything' \
                '```' \
                '' \
                '`weblist` is the user-facing tool — keep its output clean for them.' \
                '`webstart` and `webstop` are agent tools; the user normally will not run them.' \
                '' \
                'Safety: plain `webstop <BASE>` (without `--prefix`) is REFUSED when more than one' \
                '`<BASE>-*` server is running. webstop will list the candidates and require either' \
                'an exact NAME or `--prefix`. This prevents accidentally killing `vite-6006` when you' \
                'meant to restart `vite-5173`.' \
                '' \
                'Note: to RESTART a single server you usually do NOT need webstop at all — just call' \
                '`webstart <BASE> <COMMAND>` again with the same command. webstart resolves the' \
                'final NAME (e.g. `vite-5173`) and kills only that exact instance, leaving other' \
                'ports (`vite-6006`, ...) untouched.' \
                '' \
                '`webstart` already verifies the server stayed up for 2 seconds; if startup fails' \
                'it prints the last 30 log lines and exits non-zero. You do not need a separate' \
                '`sleep && ss -tlnp` check after `webstart` returns 0 — but you MAY run' \
                '`weblist` to confirm.' \
                '' \
                '### When `webstart` is NOT available (fallback only)' \
                '' \
                'If for some reason `webstart` is missing (e.g. running outside this container),' \
                'the closest hand-rolled equivalent is:' \
                '' \
                '```' \
                'setsid nohup <command> > /tmp/dev.log 2>&1 < /dev/null &' \
                'disown' \
                '```' \
                '' \
                'Plain `nohup cmd > /tmp/dev.log 2>&1 &` is INSUFFICIENT — you also need' \
                '`setsid` and `< /dev/null` to fully detach. Inside this container, ALWAYS prefer' \
                '`webstart` and skip the manual incantation.' \
                '' \
                '## Choosing a port' \
                '' \
                'BEFORE starting any server, check if the port is free:' \
                '```' \
                'ss -tlnp | grep <PORT>' \
                '```' \
                'If the port is in use, pick a different one (e.g. 4000, 4001, 8080, 8081, 9000...).' \
                'NEVER blindly reuse a hardcoded port from examples below — always pick a free port.' \
                '' \
                '## Vite (React / Vue / Svelte / vanilla)' \
                '' \
                '### MANDATORY: write `vite.config.js` BEFORE starting Vite' \
                '' \
                'Vite 6 blocks remote hosts by default (anti-DNS-rebinding). You MUST set' \
                '`server.allowedHosts: true` or the browser will see "Blocked request".' \
                'ALWAYS create/update `vite.config.js` in the project root before `nohup npx vite`:' \
                '' \
                '```js' \
                'import { defineConfig } from "vite";' \
                'export default defineConfig({' \
                '  base: "/__preview/<PORT>/",' \
                '  server: {' \
                '    host: "0.0.0.0",' \
                '    port: <PORT>,' \
                '    allowedHosts: true,   // REQUIRED: accept the Olares reverse-proxy hostname' \
                '    strictPort: true,' \
                '    hmr: {' \
                '      protocol: "wss",    // REQUIRED: browser reaches Olares over HTTPS on 443' \
                '      clientPort: 443,    // KEEP AS 443 — this is the Olares edge port, NOT your dev port' \
                '    },' \
                '  },' \
                '});' \
                '```' \
                '' \
                'Placeholder substitution — before writing this file:' \
                '' \
                '- Replace every `<PORT>` with the port you picked (e.g. `4000`).' \
                '- Keep `clientPort: 443` as literal `443`. It is the HTTPS edge port the browser uses' \
                '  to reach Olares, NOT your dev server port. DO NOT replace it with `<PORT>`.' \
                '- `allowedHosts: true` is literal `true`, not a domain name.' \
                '' \
                'If a `vite.config.js` / `.ts` / `.mjs` already exists, READ it and patch only' \
                '`server.allowedHosts`, `server.hmr`, and `base` — do not clobber the rest.' \
                '' \
                'Then start (use webstart, not raw nohup):' \
                '' \
                '```' \
                'webstart vite npx vite' \
                '```' \
                '' \
                'If the project uses npm scripts, still patch the config first, then:' \
                '' \
                '```' \
                'webstart vite npm run dev' \
                '```' \
                '' \
                'Never rely on CLI flags alone for `allowedHosts` — it is a config-only field in' \
                'Vite 6 and omitting it causes the "Blocked request" page even when `--host 0.0.0.0`' \
                'is passed.' \
                '' \
                '## Next.js' \
                '' \
                'Set basePath in next.config.js BEFORE starting:' \
                '' \
                '```js' \
                'module.exports = { basePath: "/__preview/<PORT>" }' \
                '```' \
                '' \
                'Then:' \
                '' \
                '```' \
                'webstart next npx next dev -H 0.0.0.0 -p <PORT>' \
                '```' \
                '' \
                '## Nuxt (Nuxt 3)' \
                '' \
                'Nuxt uses Vite under the hood; configure the base URL via `nuxt.config.*` OR env:' \
                '' \
                '```js' \
                '// nuxt.config.ts' \
                'export default defineNuxtConfig({' \
                '  app: { baseURL: "/__preview/<PORT>/" },' \
                '  devServer: { host: "0.0.0.0", port: <PORT> },' \
                '  vite: { server: { allowedHosts: true, hmr: { protocol: "wss", clientPort: 443 } } },' \
                '});' \
                '```' \
                '' \
                '```' \
                'webstart nuxt npm run dev' \
                '```' \
                '' \
                '## Angular (ng serve)' \
                '' \
                'Angular has its own dev server (NOT Vite). Required flags:' \
                '' \
                '```' \
                'webstart ng npx ng serve \\' \
                '  --host 0.0.0.0 --port <PORT> \\' \
                '  --base-href /__preview/<PORT>/ \\' \
                '  --deploy-url /__preview/<PORT>/ \\' \
                '  --disable-host-check' \
                '```' \
                '' \
                'If you see "Invalid Host header", `--disable-host-check` is mandatory.' \
                '' \
                '## Create React App (CRA) / react-scripts' \
                '' \
                'CRA uses webpack-dev-server. You MUST use env vars (no CLI flags for these):' \
                '' \
                '```' \
                'DANGEROUSLY_DISABLE_HOST_CHECK=true \\' \
                '  HOST=0.0.0.0 PORT=<PORT> \\' \
                '  PUBLIC_URL=/__preview/<PORT> \\' \
                '  WDS_SOCKET_PORT=443 WDS_SOCKET_PROTOCOL=wss \\' \
                '  webstart cra npm start' \
                '```' \
                '' \
                'Also set `"homepage": "/__preview/<PORT>"` in `package.json` so built assets reference' \
                'the correct prefix.' \
                '' \
                '## Gatsby' \
                '' \
                'Set `pathPrefix` in `gatsby-config.*`, then use `--prefix-paths`:' \
                '' \
                '```js' \
                '// gatsby-config.js' \
                'module.exports = { pathPrefix: "/__preview/<PORT>" };' \
                '```' \
                '' \
                '```' \
                'webstart gatsby npx gatsby develop -H 0.0.0.0 -p <PORT> --prefix-paths' \
                '```' \
                '' \
                '## Python (Flask / FastAPI)' \
                '' \
                '⚠ NEVER use `python3 -m http.server` for preview. It cannot handle the' \
                '`/__preview/<PORT>/` URL prefix added by the reverse proxy, and every request' \
                'will 404. For static files use Vite (see "Static HTML" below).' \
                '' \
                'Flask — mount under the preview prefix via `APPLICATION_ROOT`:' \
                '' \
                '```' \
                'APPLICATION_ROOT=/__preview/<PORT> \\' \
                '  webstart flask flask run --host 0.0.0.0 --port <PORT>' \
                '```' \
                '' \
                'FastAPI — pass `root_path` so generated links include the preview prefix:' \
                '' \
                '```' \
                'webstart api uvicorn app:app --host 0.0.0.0 --port <PORT> --root-path /__preview/<PORT>' \
                '```' \
                '' \
                '## Python dashboards (Streamlit / Gradio / Dash)' \
                '' \
                'These are self-contained dashboard apps. Each has its own way to set a URL prefix:' \
                '' \
                'Streamlit — set `baseUrlPath` via CLI or config:' \
                '' \
                '```' \
                'webstart streamlit streamlit run app.py \\' \
                '  --server.address 0.0.0.0 --server.port <PORT> \\' \
                '  --server.baseUrlPath /__preview/<PORT> \\' \
                '  --server.enableXsrfProtection false \\' \
                '  --server.enableCORS false' \
                '```' \
                '' \
                'Gradio — pass `root_path` when launching:' \
                '' \
                '```python' \
                'demo.launch(server_name="0.0.0.0", server_port=<PORT>, root_path="/__preview/<PORT>")' \
                '```' \
                '' \
                'Dash — mount under `requests_pathname_prefix`:' \
                '' \
                '```python' \
                'app = Dash(__name__, requests_pathname_prefix="/__preview/<PORT>/")' \
                'app.run(host="0.0.0.0", port=<PORT>)' \
                '```' \
                '' \
                '## Java (Spring Boot)' \
                '' \
                'Set `server.servlet.context-path` in `application.properties` / `application.yml`:' \
                '' \
                '```' \
                'server.address=0.0.0.0' \
                'server.port=<PORT>' \
                'server.servlet.context-path=/__preview/<PORT>' \
                '```' \
                '' \
                '```' \
                'webstart spring ./mvnw spring-boot:run' \
                '```' \
                '' \
                '## Static HTML (no bundler)' \
                '' \
                'ALWAYS use Vite to serve static HTML. `python3 -m http.server` will NOT work here.' \
                '' \
                'Step 1: write `vite.config.js` in the directory that contains the HTML (see the' \
                'Vite section above — `allowedHosts: true` and `base` are BOTH mandatory).' \
                '' \
                'Step 2: ensure an `index.html` exists at the directory root. If your file is named' \
                'something else (e.g. `clock.html`), either rename it to `index.html` or point users' \
                'to `/__preview/<PORT>/clock.html`.' \
                '' \
                'Step 3:' \
                '' \
                '```' \
                'webstart vite npx vite' \
                '```' \
                '' \
                '## Go / Rust / Other custom servers' \
                '' \
                'Make sure the server listens on 0.0.0.0:<PORT>, then:' \
                '' \
                '```' \
                'webstart app ./myserver --addr 0.0.0.0:<PORT>' \
                '```' \
                '' \
                '## Stopping a dev server' \
                '' \
                '```' \
                'webstop <NAME>             # exact resolved NAME from weblist (e.g. "vite-5173")' \
                'webstop --prefix <BASE>    # explicit batch — stops every "<BASE>-*"' \
                'webstop --all              # stop everything' \
                '```' \
                '' \
                'If unsure of the exact NAME, run `weblist` first.' \
                '' \
                'Plain `webstop <BASE>` (no `--prefix`) only succeeds when exactly ONE server' \
                'matches that base. If multiple `<BASE>-*` are running, webstop REFUSES and lists' \
                'them — pass the exact NAME or `--prefix` instead. This protects the' \
                '"restart vite-5173" workflow from accidentally taking down `vite-6006`.' \
                '' \
                'If a process was NOT started via webstart (legacy):' \
                '' \
                '```' \
                'kill $(lsof -t -i:<PORT>)   # or: pkill -f "vite"' \
                '```' \
                '' \
                '## Preview URL' \
                '' \
                'NEVER use localhost or 127.0.0.1 in any URL you show to the user.' \
                'The domain for this OpenCode instance is: '"$OC_DOMAIN" \
                '' \
                'Tell the user:' \
                '`https://'"$OC_DOMAIN"'/__preview/<port>/`' \
                '' \
                'Example (if your dev server runs on port 4000):' \
                '`https://'"$OC_DOMAIN"'/__preview/4000/`' \
                '' \
                '## CRITICAL rules (MUST follow every time)' \
                '' \
                '1. ALWAYS use `webstart <BASE> <COMMAND>` to start dev servers. NEVER use plain' \
                '   `nohup ... &` or `cmd &` — the opencode shell tool reaps background processes' \
                '   when the agent turn ends, so non-`webstart` servers DIE before the user can' \
                '   reach the URL. There is no exception to this rule inside this container.' \
                '   webstart auto-suffixes BASE with the listening port (e.g. `vite` → `vite-5173`),' \
                '   so two servers on different ports never clash even with the same BASE. Same' \
                '   final NAME (same base + same port) = restart of the previous one. After every' \
                '   `webstart` call READ its success line — the quoted name is what you pass to' \
                '   `webstop`. Use `weblist` to inspect running servers.' \
                '2. ALWAYS do Step 0 FIRST — detect the stack from marker files and pick the correct' \
