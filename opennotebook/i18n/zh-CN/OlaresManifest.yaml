metadata:
  description: 一个强大的开源、AI驱动的笔记与研究平台，尊重您的隐私
  title: Open Notebook
spec:
  fullDescription: |
    Open Notebook 是一个开源且注重隐私的笔记工具，是 Google Notebook LM 的极佳替代品！

    在被人工智能主导的世界中，思考与获取新知识的能力不应成为少数人的特权，也不应被单一服务商所限制。

    Open Notebook 让您能够：
    - 掌控您的数据：让您的研究数据私密且安全
    - 自由选择 AI 模型：支持 16+ 个提供商，包括 OpenAI、Anthropic、Ollama、LM Studio 等 — 均可通过界面配置
    - 高效管理多模态内容：支持 PDF、视频、音频、网页等多种内容
    - 生成专业播客：具备先进的多说话人播客生成能力
    - 智能检索：全文检索与向量检索结合，轻松搜索一切内容
    - 上下文对话：由您研究内容驱动的 AI 智能对话

  upgradeDescription: |
    Open Notebook 1.8.1 版本（从 1.4.0 升级）
    
    重要新功能：
    - 界面化 API 密钥管理：通过设置 → API 密钥配置所有 14+ 个 AI 提供商（无需再编辑环境变量！）
    - 安全凭证存储，采用 Fernet AES-128-CBC 加密
    - 国际化（i18n）：支持中文、日语、俄语、意大利语、法语、孟加拉语等多种语言
    - 内容类型感知的文本分块，自动检测 HTML/Markdown
    - 播客模型注册中心：节目/演讲者配置文件现使用模型注册中心，支持凭证自动传递
    - 播客生成失败恢复与重试功能
    - 通过 podcast-creator 0.12.0 支持播客语言选择
    
    重要改进：
    - 移除笔记本聊天上下文的 50 个来源限制
    - 修复 SurrealDB 卡住问题
    - 修复离线/静网 Docker 部署中的 tiktoken 网络错误
    - 大文档嵌入（3MB+）现采用批量处理，防止 413 错误
    - 修复中日韩文字方向问题
    - 改进 LLM 提供商错误消息显示
    - 文本来源的 HTML 剪贴板检测
    
    完整发布说明请参阅：https://github.com/lfnovo/open-notebook/releases/tag/v1.8.1

    ---

    Open Notebook 1.4.0 版本
    
    主要更新：
    - 升级到 Next.js 16（从 v15.4.10）
    - 文件上传限制从 10MB 增加到 100MB
    - 改进离线/静网环境部署支持
    - 增强用户引导体验，显示醒目的"创建笔记本"按钮
    - 更好的文件管理：移除来源后会自动清理孤立文件
    
    技术改进：
    - React 和 react-dom 升级到 19.2.3
    - middleware.ts 重命名为 proxy.ts（Next.js 16 要求）
    - 修复文档链接并移除错误的 ZIP 支持引用
    
    完整发布说明请参阅：https://github.com/lfnovo/open-notebook/releases/tag/v1.4.0


