---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: surrealdb
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: surrealdb
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: surrealdb
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: surrealdb
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
      - name: migrate-surrealdb-data
        image: "docker.io/beclab/aboveos-busybox:1.37.0"
        command:
          - sh
          - '-c'
          - |
            set -e
            if [ -z "$(ls -A /mnt/new 2>/dev/null)" ] && [ -n "$(ls -A /mnt/legacy 2>/dev/null)" ]; then
              echo "[migrate-surrealdb-data] legacy appCache has data and appData is empty; copying..."
              cp -a /mnt/legacy/. /mnt/new/
              echo "[migrate-surrealdb-data] done; legacy source left intact for rollback."
            else
              echo "[migrate-surrealdb-data] nothing to do (destination non-empty or source empty)."
            fi
        resources: {}
        volumeMounts:
          - name: surrealdbdata
            mountPath: /mnt/new
          - name: surrealdbdata-legacy
            mountPath: /mnt/legacy
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
      - name: init-chmod-surrealdb
        image: "docker.io/beclab/aboveos-busybox:1.37.0"
        command:
          - sh
          - '-c'
          - |
            set -e
            mkdir -p /app-data-root
            chown -R 1000:1000 /app-data-root
            find /app-data-root -type d -exec chmod 775 {} +
            find /app-data-root -type f -exec chmod 664 {} +
        resources: {}
        volumeMounts:
          - name: surrealdbdata
            mountPath: /app-data-root
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
      containers:
      - name: surrealdb
        image: "docker.io/beclab/surrealdb-surrealdb:v2.4.1"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
        command:
          - /surreal
          - start
          - --log
          - info
          - --user
          - root
          - --pass
          - root
          - rocksdb:/mydata/mydatabase.db
        env:
        - name: SURREAL_EXPERIMENTAL_GRAPHQL
          value: "true"
        ports:
        - containerPort: 8000
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - mountPath: /mydata
          name: surrealdbdata
      volumes:
      - hostPath:
          {{- if .Values.sysVersion }}
            {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
          path: '{{ .Values.userspace.appData }}/surrealdb'
            {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook/surrealdb'
            {{- end }}
          {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook/surrealdb'
          {{- end }}
          type: DirectoryOrCreate
        name: surrealdbdata
      - hostPath:
          {{- if .Values.sysVersion }}
            {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
          path: '{{ .Values.userspace.appCache }}/surrealdb'
            {{- else }}
          path: '{{ .Values.userspace.appCache }}/opennotebook/surrealdb'
            {{- end }}
          {{- else }}
          path: '{{ .Values.userspace.appCache }}/opennotebook/surrealdb'
          {{- end }}
          type: DirectoryOrCreate
        name: surrealdbdata-legacy
---
apiVersion: v1
kind: Service
metadata:
  name: surrealdb
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: surrealdb
spec:
  ports:
  - name: "8000"
    port: 8000
    targetPort: 8000
  selector:
    io.kompose.service: surrealdb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opennotebook
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: opennotebook
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: opennotebook
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: opennotebook
    spec:
      initContainers:
      - name: migrate-opennotebook-data
        image: "docker.io/beclab/aboveos-busybox:1.37.0"
        command:
          - sh
          - '-c'
          - |
            set -e
            for sub in data uploads config; do
              if [ -z "$(ls -A /mnt/new/$sub 2>/dev/null)" ] && [ -n "$(ls -A /mnt/legacy/$sub 2>/dev/null)" ]; then
                echo "[migrate-opennotebook-data] copying legacy $sub from appCache to appData..."
                mkdir -p /mnt/new/$sub
                cp -a /mnt/legacy/$sub/. /mnt/new/$sub/
                echo "[migrate-opennotebook-data] $sub done."
              else
                echo "[migrate-opennotebook-data] skip $sub (destination non-empty or source empty)."
              fi
            done
        resources: {}
        volumeMounts:
          - name: app-cache-root
            mountPath: /mnt/new
          - name: app-cache-legacy-root
            mountPath: /mnt/legacy
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
      - name: getconfigfile
        image: "docker.io/beclab/lfnovo-open_notebook:1.8.5"
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "if [ ! -f '/app/config/config.toml' ]; then mkdir -p /app/config && touch /app/config/config.toml; fi"]
        volumeMounts:
        - mountPath: /app/config
          name: appconfig
      - name: seed-data
        image: "docker.io/beclab/lfnovo-open_notebook:1.8.5"
        command:
          - sh
          - -c
          - |
            if [ ! -s /mnt/data/db.sqlite ] && [ -f /app/data/db.sqlite ]; then
              echo "Seeding db.sqlite into volume..."
              cp /app/data/db.sqlite /mnt/data/db.sqlite
            fi
        volumeMounts:
          - name: appcache
            mountPath: /mnt/data
      - name: init-chmod-data
        image: "docker.io/beclab/aboveos-busybox:1.37.0"
        command:
          - sh
          - '-c'
          - |
            chown -R 1000:1000 /app-cache-root
        resources: {}
        volumeMounts:
          - name: app-cache-root
            mountPath: /app-cache-root
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
      containers:
      - name: opennotebook
        image: "docker.io/beclab/lfnovo-open_notebook:1.8.5"
        command:
          - sh
          - '-c'
          - |
            python3 << 'PATCH_EOF'
            import pathlib
            patched = []

            # source.py: provision STT credential env vars before audio extraction.
            # Upstream bug: open_notebook/graphs/source.py sets only audio_provider
            # and audio_model on content_state, but never calls provision_provider_keys
            # for the STT model, so content-core/esperanto cannot reach openai_compatible
            # STT endpoints configured via UI. Track upstream: lfnovo/open-notebook
            # (no dedicated issue yet; related: #654, #676, esperanto#103).
            # TODO: remove this hotfix when upstream fixes credential passthrough for STT.
            f = pathlib.Path('/app/open_notebook/graphs/source.py')
            marker = '# OLARES HOTFIX: provision STT credential'
            if f.exists():
                s = f.read_text()
                old = (
                    '                content_state["audio_provider"] = stt_model.provider\n'
                    '                content_state["audio_model"] = stt_model.name\n'
                    '                logger.debug(\n'
                    '                    f"Using speech-to-text model: {stt_model.provider}/{stt_model.name}"\n'
                    '                )'
                )
                new = old + (
                    '\n                ' + marker + '\n'
                    '                from open_notebook.ai.key_provider import provision_provider_keys\n'
                    '                await provision_provider_keys(stt_model.provider)'
                )
                if marker not in s and old in s:
                    f.write_text(s.replace(old, new))
                    patched.append('source.py (STT credential provisioning)')

            if patched:
                print(f'=== Open Notebook hotfix: patched {len(patched)} files ===')
                for p in patched:
                    print(f'  - {p}')
            else:
                print('=== Open Notebook hotfix: no patches applied (already patched or upstream changed) ===')
            PATCH_EOF
            exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
        env:
        - name: HOSTNAME
          value: '0.0.0.0'
        {{- if .Values.olaresEnv.PASSWORD }}
        - name: OPEN_NOTEBOOK_PASSWORD
          value: "{{ .Values.olaresEnv.PASSWORD }}"
        {{- else }}
        {{- end }}
        envFrom:
        - configMapRef:
            name: opennotebook-config
        ports:
        - containerPort: 8502
        - containerPort: 5055
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /app/data
          name: appcache
        - mountPath: /app/config
          name: appconfig
        - mountPath: /app/uploads
          name: appuploads
      volumes:
      - hostPath:
          {{- if .Values.sysVersion }}
            {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
          path: '{{ .Values.userspace.appData }}/data'
            {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook/data'
            {{- end }}
          {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook/data'
          {{- end }}
          type: DirectoryOrCreate
        name: appcache
      - hostPath:
          {{- if .Values.sysVersion }}
            {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
          path: '{{ .Values.userspace.appData }}/uploads'
            {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook/uploads'
            {{- end }}
          {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook/uploads'
          {{- end }}
          type: DirectoryOrCreate
        name: appuploads
      - hostPath:
          {{- if .Values.sysVersion }}
            {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
          path: '{{ .Values.userspace.appData }}/config'
            {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook/config'
            {{- end }}
          {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook/config'
          {{- end }}
          type: DirectoryOrCreate
        name: appconfig
      - hostPath:
          {{- if .Values.sysVersion }}
            {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
          path: '{{ .Values.userspace.appData }}'
            {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook'
            {{- end }}
          {{- else }}
          path: '{{ .Values.userspace.appData }}/opennotebook'
          {{- end }}
          type: DirectoryOrCreate
        name: app-cache-root
      - hostPath:
          {{- if .Values.sysVersion }}
            {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
          path: '{{ .Values.userspace.appCache }}'
            {{- else }}
          path: '{{ .Values.userspace.appCache }}/opennotebook'
            {{- end }}
          {{- else }}
          path: '{{ .Values.userspace.appCache }}/opennotebook'
          {{- end }}
          type: DirectoryOrCreate
        name: app-cache-legacy-root
---
apiVersion: v1
kind: Service
metadata:
  name: opennotebook
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: opennotebook
spec:
  ports:
  - name: "8502"
    port: 8502
    targetPort: 8502
  - name: "5055"
    port: 5055
    targetPort: 5055
  selector:
    io.kompose.service: opennotebook

