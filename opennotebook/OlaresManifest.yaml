  fullDescription: |
    Open Notebook is an open source, privacy-focused alternative to Google's Notebook LM!

    In a world dominated by Artificial Intelligence, having the ability to think and acquire new knowledge, is a skill that should not be a privilege for a few, nor restricted to a single provider.

    Open Notebook empowers you to:
    - Control your data: Keep your research private and secure
    - Choose your AI models: Support for 16+ providers including OpenAI, Anthropic, Ollama, LM Studio, and more — all configurable via UI
    - Organize multi-modal content: PDFs, videos, audio, web pages, and more
    - Generate professional podcasts: Advanced multi-speaker podcast generation
    - Search intelligently: Full-text and vector search across all your content
    - Chat with context: AI conversations powered by your research

  upgradeDescription: |
    Open Notebook version 1.8.1 (upgraded from 1.4.0)
    
    Major New Features:
    - UI-based API Key Management: Configure all 14+ AI providers via Settings → API Keys (no more env files!)
    - Secure credential storage with Fernet AES-128-CBC encryption
    - Internationalization (i18n): Support for Chinese, Japanese, Russian, Italian, French, Bengali and more
    - Content-type aware text chunking with automatic HTML/Markdown detection
    - Podcast Model Registry: Episode/speaker profiles now use model registry with credential passthrough
    - Podcast failure recovery with retry capabilities
    - Podcast language support via podcast-creator 0.12.0
    
    Important Improvements:
    - Removed 50-source cap for notebook chat context
    - Fixed SurrealDB getting stuck issues
    - Fixed tiktoken network errors in offline/air-gapped Docker deployments
    - Large document embedding (3MB+) now batched to prevent 413 errors
    - CJK text orientation fixes
    - Better error messages for LLM provider errors
    - HTML clipboard detection for text sources
    
    Full release notes at: https://github.com/lfnovo/open-notebook/releases/tag/v1.8.1

    ---

    Open Notebook version 1.4.0
    
    Major Updates:
    - Upgraded to Next.js 16 (from v15.4.10)
    - Increased file upload limit from 10MB to 100MB
    - Improved offline/airgapped deployment support
    - Enhanced user onboarding experience with prominent "Create Notebook" button
    - Better file management: orphaned files are now cleaned up when sources are removed
    
    Technical Improvements:
    - React and react-dom upgraded to 19.2.3
    - middleware.ts renamed to proxy.ts (Next.js 16 requirement)
    - Fixed documentation links and removed incorrect ZIP support references
    
    Full release note at: https://github.com/lfnovo/open-notebook/releases/tag/v1.4.0

