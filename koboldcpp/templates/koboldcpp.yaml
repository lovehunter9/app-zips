
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koboldcpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: koboldcpp
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: koboldcpp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: koboldcpp
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: koboldcpp
          image: docker.io/beclab/koboldai-koboldcpp:latest
          resources:
            limits:
              cpu: 4
              memory: 8Gi
            requests:
              cpu: 2
              memory: 4Gi
          ports:
            - containerPort: 5001
              protocol: TCP
          volumeMounts:
            - name: koboldcpp-data
              mountPath: /app/models
              subPath: models
            - name: koboldcpp-data
              mountPath: /app/saves
              subPath: saves
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

      restartPolicy: Always
      volumes:
        - name: koboldcpp-data
          hostPath:
            type: DirectoryOrCreate
                {{- if .Values.sysVersion }}
                  {{- if semverCompare ">=1.12.3-0" (toString .Values.sysVersion) }}
            path: '{{ .Values.userspace.appCache }}'
                  {{- else }}
            path: '{{ .Values.userspace.appCache }}/koboldcpp'
                  {{- end }}
                {{- else }}
            path: '{{ .Values.userspace.appCache }}/koboldcpp'
                {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: koboldcpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: koboldcpp
spec:
  ports:
    - name: koboldcpp-port
      port: 5001
      targetPort: 5001
  selector:
    io.kompose.service: koboldcpp
status:
  loadBalancer: {}

---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-koboldcpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: koboldcpp
spec:
  ports:
    - name: "5001"
      port: 5001
      targetPort: 5001
  selector:
    io.kompose.service: koboldcpp
status:
  loadBalancer: {}
