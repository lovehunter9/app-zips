
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: koboldcpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: koboldcpp
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: koboldcpp
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: koboldcpp
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: koboldcpp
          image: docker.io/beclab/koboldai-koboldcpp:latest
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,utility"
            - name: KCPP_MODEL
              value: ""
            - name: KCPP_DONT_UPDATE
              value: "true"
            - name: KCPP_DONT_TUNNEL
              value: "true"
          resources:
            limits:
              cpu: 4
              memory: 8Gi
              nvidia.com/gpu: 1
            requests:
              cpu: 2
              memory: 4Gi
              nvidia.com/gpu: 1
{{/*          securityContext:*/}}
{{/*            privileged: true*/}}
{{/*            capabilities:*/}}
{{/*              add: [ "SYS_ADMIN" ]*/}}
          ports:
            - containerPort: 5001
              protocol: TCP
          volumeMounts:
            - name: koboldcpp-data
              mountPath: /app/models
              subPath: models
            - name: user-home
              mountPath: /home/user
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

      restartPolicy: Always
      volumes:
        - name: koboldcpp-data
          hostPath:
            type: DirectoryOrCreate
            path: '{{ .Values.userspace.appData }}'
        - name: user-home
          hostPath:
            type: Directory
            path: '{{ .Values.userspace.userData }}'

---
apiVersion: v1
kind: Service
metadata:
  name: koboldcpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: koboldcpp
spec:
  ports:
    - name: koboldcpp-port
      port: 5001
      targetPort: 5001
  selector:
    io.kompose.service: koboldcpp
status:
  loadBalancer: {}

---
apiVersion: v1
kind: Service
metadata:
  name: sharedentrances-koboldcpp
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: koboldcpp
spec:
  ports:
    - name: "5001"
      port: 5001
      targetPort: 5001
  selector:
    io.kompose.service: koboldcpp
status:
  loadBalancer: {}
