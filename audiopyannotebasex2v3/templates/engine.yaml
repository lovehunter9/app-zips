{{- /* pyannote/torch engine: ONE baked image (beclab/audio-pyannote) whose wrapper serves vad / diar / speaker_embed / enhance per MODEL_SUPPORTS. No runtime pip, no capability branching here — the image self-reports /v1/models + /metrics; this template only sizes the GPU and starts the sentinel-wait shell. */ -}}
{{- $oe := .Values.olaresEnv | default dict -}}
{{- $modelName := $oe.MODEL_NAME | default "" -}}
{{- $modelSource := $oe.MODEL_SOURCE | default "" -}}
{{- $supportsRaw := $oe.MODEL_SUPPORTS | default "diar" -}}
{{- $engineImage := $oe.ENGINE_IMAGE | default "docker.io/lovehunter9/audio-pyannote:stt-async-test2" -}}
{{- $enginePort := int ($oe.ENGINE_PORT | default "8000") -}}
{{- $cpuRequest := trim ($oe.AUDIO_CPU_REQUEST | default "500m") -}}
{{- $memRequest := trim ($oe.AUDIO_MEMORY_REQUEST | default "2Gi") -}}
{{- $cpuLimit := trim ($oe.AUDIO_CPU_LIMIT | default "6") -}}
{{- $memLimit := trim ($oe.AUDIO_MEMORY_LIMIT | default "24Gi") -}}
{{- /* GPU is OPTIONAL (AUDIO_REQUIRED_GPU_MEMORY = "" or "0" => CPU-only, which is the norm for vad and speaker_embed). */ -}}
{{- $gpuRaw := trim ($oe.AUDIO_REQUIRED_GPU_MEMORY | default "") -}}
{{- $wantGpu := and (ne $gpuRaw "") (ne $gpuRaw "0") -}}
{{- $gpuMiB := "" -}}
{{- $gpuType := .Values.gpu | default "" -}}
{{- if not $gpuType -}}
{{- if .Values.GPU -}}{{- $gpuType = .Values.GPU.Type | default "nvidia" -}}{{- else -}}{{- $gpuType = "nvidia" -}}{{- end -}}
{{- end -}}
{{- $unifiedMem := and $wantGpu (eq $gpuType "nvidia-gb10") -}}
{{- if $wantGpu -}}
{{- $gpuMiB = include "llmbase.gpuMiB" $gpuRaw -}}
{{- if $unifiedMem -}}
{{- $memRequest = printf "%sMi" $gpuMiB -}}
{{- $memLimit = printf "%sMi" $gpuMiB -}}
{{- end -}}
{{- end -}}
{{- /* enhance streams long clips through a sliding window so peak VRAM is bounded by ONE window; DERIVE that window from the quota (a small slice gets a shorter one). Override via ENHANCE_CHUNK_S. */ -}}
{{- $enhanceChunk := trim ($oe.ENHANCE_CHUNK_S | default "") -}}
{{- if and (eq $enhanceChunk "") $wantGpu -}}
{{- $g := int $gpuMiB -}}
{{- if ge $g 4000 -}}{{- $enhanceChunk = "120" -}}
{{- else if ge $g 2000 -}}{{- $enhanceChunk = "60" -}}
{{- else -}}{{- $enhanceChunk = "30" -}}{{- end -}}
{{- end -}}
{{- if eq $enhanceChunk "" -}}{{- $enhanceChunk = "30" -}}{{- end -}}
{{- /* diar: pyannote runs segmentation (10 s window, 1 s hop) and embedding at batch_size=1, so a long clip becomes tens of thousands of tiny forward passes with the GPU idle between them. DERIVE a batch from the quota; the engine falls back to 1 on CPU. Override via DIAR_SEG_BATCH / DIAR_EMB_BATCH. */ -}}
{{- $segBatch := trim ($oe.DIAR_SEG_BATCH | default "") -}}
{{- $embBatch := trim ($oe.DIAR_EMB_BATCH | default "") -}}
{{- if and $wantGpu (or (eq $segBatch "") (eq $embBatch "")) -}}
{{- $g := int $gpuMiB -}}
{{- $tier := "4" -}}
{{- if ge $g 16000 -}}{{- $tier = "32" -}}
{{- else if ge $g 8000 -}}{{- $tier = "16" -}}
{{- else if ge $g 4000 -}}{{- $tier = "8" -}}{{- end -}}
{{- if eq $segBatch "" -}}{{- $segBatch = $tier -}}{{- end -}}
{{- if eq $embBatch "" -}}{{- $embBatch = $tier -}}{{- end -}}
{{- end -}}
{{- $modelSan := regexReplaceAll "[^a-z0-9]+" (lower $modelName) "-" | trimAll "-" -}}
{{- $cname := printf "audio-%s" $modelSan | trunc 63 | trimSuffix "-" -}}
{{- $hfEndpoint := $oe.HF_ENDPOINT | default "" -}}
{{- $hfToken := $oe.HF_TOKEN | default "" -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: audio-engine
  annotations:
    audio.bytetrade.io/model: "{{ $modelName }}"
    audio.bytetrade.io/supports: "{{ $supportsRaw }}"
{{- if $wantGpu }}
    applications.app.bytetrade.io/gpu-inject: "{{ $cname }}"
{{- end }}
spec:
  replicas: {{ .Values.workloads.audiopyannotebasex2v3.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: audio-engine
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.network/chrome-default: "true"
        io.kompose.service: audio-engine
    spec:
      restartPolicy: Always
      volumes:
        - name: hf-cache
          hostPath:
            path: "{{ .Values.userspace.appCommon }}/huggingface"
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: "{{ .Values.userspace.appData }}/data"
            type: DirectoryOrCreate
        - name: run-state
          hostPath:
            path: "{{ printf "%s/huggingface/llm-init-run/%s" .Values.userspace.appCommon .Release.Name }}"
            type: DirectoryOrCreate
        - name: wrappers
          configMap:
            name: audio-wrappers
            defaultMode: 0555
      containers:
        - name: {{ $cname }}
          image: "{{ $engineImage }}"
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/wrappers/pyannote.sh"]
          env:
            - name: ENGINE_KIND
              value: audio
            - name: MODEL_NAME
              value: "{{ $modelName }}"
            - name: MODEL_SOURCE
              value: "{{ $modelSource }}"
            - name: MODEL_SUPPORTS
              value: "{{ $supportsRaw }}"
            - name: WRAPPER_PORT
              value: "{{ $enginePort }}"
            - name: ENHANCE_CHUNK_S
              value: "{{ $enhanceChunk }}"
{{- if $segBatch }}
            - name: DIAR_SEG_BATCH
              value: "{{ $segBatch }}"
{{- end }}
{{- if $embBatch }}
            - name: DIAR_EMB_BATCH
              value: "{{ $embBatch }}"
{{- end }}
{{- if $oe.ENHANCE_AMP }}
            - name: ENHANCE_AMP
              value: "{{ $oe.ENHANCE_AMP }}"
{{- end }}
            - name: LOG_LEVEL
              value: "{{ $oe.LOG_LEVEL | default "info" }}"
{{- /* Escape hatches for the image's own defaults; unset means the image decides. */ -}}
{{- range $k := list "LOAD_TIMEOUT_S" "TASK_TTL_S" }}
{{- if get $oe $k }}
            - name: {{ $k }}
              value: "{{ get $oe $k }}"
{{- end }}
{{- end }}
            - name: HF_HOME
              value: /cache/hf
            - name: HF_HUB_CACHE
              value: /cache/hf/hub
            - name: HUGGINGFACE_HUB_CACHE
              value: /cache/hf/hub
{{- if $hfEndpoint }}
            - name: HF_ENDPOINT
              value: "{{ $hfEndpoint }}"
{{- end }}
{{- if $hfToken }}
            - name: HF_TOKEN
              value: "{{ $hfToken }}"
{{- end }}
            - name: TZ
              value: Etc/UTC
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
{{- if $wantGpu }}
            - name: GPU_CORE_UTILIZATION_POLICY
              value: "{{ $oe.GPU_CORE_UTILIZATION_POLICY | default "disable" }}"
{{- end }}
          ports:
            - name: http
              containerPort: {{ $enginePort }}
          # NO readinessProbe (mirrors llamacpp): pod Ready at start so the app reaches "running" while the model downloads; llm-init WaitAlive/Ready polls the engine's /v1/models and NotReadyGuard 503-gates /v1/* until it's alive.
          volumeMounts:
            - name: hf-cache
              mountPath: /cache/hf/hub
            - name: data
              mountPath: /tmp
            - name: run-state
              mountPath: /run/llm-init
              readOnly: true
            - name: wrappers
              mountPath: /wrappers
              readOnly: true
          resources:
            requests:
              cpu: "{{ $cpuRequest }}"
              memory: "{{ $memRequest }}"
{{- if and $wantGpu (not $unifiedMem) }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
            limits:
              cpu: "{{ $cpuLimit }}"
              memory: "{{ $memLimit }}"
{{- if and $wantGpu (not $unifiedMem) }}
              nvidia.com/gpumem: {{ $gpuMiB }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: audio-engine
  namespace: {{ .Release.Namespace }}
  labels:
    io.kompose.service: audio-engine
spec:
  selector:
    io.kompose.service: audio-engine
  ports:
    - name: http
      port: {{ $enginePort }}
      targetPort: {{ $enginePort }}
  type: ClusterIP
