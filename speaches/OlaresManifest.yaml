olaresManifest.version: '0.10.0'
olaresManifest.type: app
metadata:
  name: speaches
  icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
  description: OpenAI-compatible TTS/STT server
  appid: speaches
  title: Speaches
  version: '1.0.0'
  categories:
    - Utilities
    - Productivity_v112
permission:
  appData: true
  appCache: true
spec:
  versionName: '0.8.3'
  fullDescription: |
    Speaches is an OpenAI API-compatible server for Text-to-Speech (TTS) and Speech-to-Text (STT).
    Think of it as "Ollama, but for TTS/STT models."

    Key Features
    - Text-to-Speech powered by Kokoro and Piper models.
    - Speech-to-Text powered by faster-whisper for high-quality transcription.
    - OpenAI-compatible API (/v1/audio/speech, /v1/audio/transcriptions, etc.).
    - Built-in Gradio Web UI for interactive testing.
    - Built-in Terminal for CLI model management (download, list, remove models).
    - GPU acceleration support (NVIDIA CUDA) with CPU fallback.
    - Shared entrance for seamless integration with other Olares apps.

    Pre-installed Models
    - Kokoro-82M-v1.0-ONNX (TTS) — lightweight, high-quality speech synthesis.
    - faster-whisper-small (STT) — fast and accurate speech recognition.
    - Additional models can be downloaded via the Terminal entrance.

    Usage
    - Open the Speaches UI to test TTS/STT interactively via the Gradio interface.
    - Use the Terminal to download additional models from HuggingFace.
    - Other Olares apps can call the API via the shared entrance or the API entrance.
    - API is fully compatible with OpenAI SDKs and libraries.
  developer: Speaches AI
  website: https://speaches.ai/
  sourceCode: https://github.com/speaches-ai/speaches
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  doc: https://speaches.ai/
  license:
    - text: MIT
      url: https://github.com/speaches-ai/speaches/blob/main/LICENSE
  {{- $env := .Values.olaresEnv | default dict -}}
  {{- if eq (index $env "SPEACHES_GPU" | default "") "true" }}
  requiredMemory: 2560Mi
  limitedMemory: 9Gi
  requiredDisk: 5Gi
  limitedDisk: 20Gi
  requiredCpu: 0.55
  limitedCpu: 8.5
  requiredGpu: 4Gi
  limitedGpu: 16Gi
  {{- else }}
  requiredMemory: 512Mi
  limitedMemory: 2560Mi
  requiredDisk: 2Gi
  limitedDisk: 10Gi
  requiredCpu: 0.1
  limitedCpu: 2.5
  {{- end }}
  supportArch:
    - amd64
    - arm64
  envs:
    - envName: SPEACHES_GPU
      required: true
      applyOnChange: true
      type: string
      editable: true
      defaultValue: "false"
      description: "Enable GPU acceleration for TTS/STT (set 'true' if you have an NVIDIA GPU, 'false' for CPU-only)"
options:
  apiTimeout: 0
  allowedOutboundPorts:
    - 80
    - 443
  dependencies:
    - name: olares
      type: system
      version: '>=1.12.4-0'
sharedEntrances:
  - name: speaches
    host: sharedentrances-speaches
    port: 0
    title: Speaches
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    invisible: true
    authLevel: internal
entrances:
  - name: speachesterminal
    port: 8080
    host: speachesingress
    title: Speaches Terminal
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    openMethod: window
    authLevel: internal
  - name: speaches
    port: 8081
    host: speachesingress
    title: Speaches
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    openMethod: window
    authLevel: internal
  - name: speachesapi
    port: 8082
    host: speachesingress
    title: Speaches API
    icon: https://app.cdn.olares.com/appstore/default/defaulticon.webp
    invisible: true
    openMethod: window
    authLevel: internal
