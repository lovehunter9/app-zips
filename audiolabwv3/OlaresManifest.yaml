olaresManifest.version: "0.12.0"
olaresManifest.type: app
apiVersion: 'v3'
# NOTE: DEV scratch name `audiolabwv3`. Rename back to the formal
# `audiomodelbasev3` (metadata.name / appid / sharedEntrances.name /
# workloadReplicas key / Chart.yaml name / values workloads key) once stable.
metadata:
  name: audiolabwv3
  icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
  description: "[DEV] Generic audio-model base. llm-init downloads the model; a clone-selected engine serves it. STT/VAD/Diarize/TTS chosen at install via env."
  appid: audiolabwv3
  title: Audio Lab Workshop V3 for test
  version: '1.0.0'
  categories:
    - AI
sharedEntrances:
  - name: audiolabwv3
    host: sharedentrances-api
    port: 0
    title: Audio Model API
    invisible: true
    authLevel: internal
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
entrances:
  - name: audiolabclient
    port: 8090
    host: download-svc
    title: Audio Lab
    icon: https://app.cdn.olares.com/appstore/whisperwebui/icon.png
    openMethod: window
    authLevel: internal
#   audiolabwv3 — engine Deployment (== appid / Release.Name)
#   llminit    — llm-init download-only / entrance Deployment
workloadReplicas:
  audiolabwv3: 1
  llminit: 1
spec:
  versionName: '1.0.0'
  fullDescription: |
    **IMPORTANT NOTE**
    DEV scratch app (temporary name `audiolabwv3`). This is a shared app and a
    generic *base*: it is NOT tied to any specific model or audio capability.
    What to serve is chosen entirely at install time through environment
    variables, so the same Helm chart can serve any audio model (STT / VAD /
    Diarize / TTS / ...) behind any OpenAI-compatible audio engine.

    **HOW IT WORKS (llm-init is NOT modified — used in download-only mode)**
    The llm-init sidecar runs with `ENGINE_KIND=""` (pure HuggingFace
    downloader): it pulls the configured model into the shared HF cache and
    exposes `/readyz` + a progress dashboard on :8090. The engine container
    (image selected by `ENGINE_IMAGE`) waits for llm-init `/readyz`, then loads
    the cached model and serves its OpenAI-compatible audio surface. llm-init
    and the engine run in separate Deployments and share the HF cache via
    hostPath. The model serving contract (e.g. `/v1/audio/transcriptions`) is
    provided by the engine, not by llm-init.

    **Model storage (App Common)**
    Model files go to the shared App Common store `appCommon/huggingface`,
    mounted at `/cache/hf/hub`. llm-init writes, the engine reads.

    **Install-time parameters (set per model/mode at clone)**
    - `MODEL_SOURCE`    — `hf://<repo>` (llm-init download spec).
    - `MODEL_NAME`      — model id advertised to clients / passed as OpenAI `model`.
    - `MODEL_MODE`      — the single model classifier: `stt` / `stt_stream` / `tts` /
      `tts_clone` / `vad` / `diar` / `diar_stream` / `translate` / `align` / ...
      (drives engine selection AND gateway routing — no separate "capability").
    - `ENGINE_IMAGE`    — engine container image serving the OpenAI audio surface.
    - `ENGINE_PORT`     — engine container port (default 8000).
    - `ENGINE_ARGS`     — extra args appended to the engine container.
    - `ENGINE_HEALTH_PATH` — readiness path on the engine (default `/health`).
    - `HF_ENDPOINT` / `HF_TOKEN` — HF mirror + token. HF_TOKEN auto-binds to the
      Olares account HuggingFace token, so gated repos download at install with no
      per-app input (platform-standard).
    - `AUDIO_*` resource envs — engine pod CPU/RAM; `AUDIO_REQUIRED_GPU_MEMORY`
      is the per-instance GPU memory quota.

    **NO BAKED-IN MODEL — you pick at clone (engine is auto-chosen)**
    The clone form asks only 4 things: MODEL_SOURCE / MODEL_NAME / MODEL_MODE
    / AUDIO_REQUIRED_GPU_MEMORY (required, no default). The ENGINE_IMAGE (and its
    port / health path) is a BLACK BOX auto-derived from MODEL_MODE — the user
    never types an image. Advanced users can still override ENGINE_IMAGE in app
    settings AFTER install. Nothing is downloaded until you choose. Example sets:

    - STT (offline, GPU):  MODEL_SOURCE=hf://Systran/faster-whisper-large-v3
      MODEL_NAME=Systran/faster-whisper-large-v3  MODEL_MODE=stt
      AUDIO_REQUIRED_GPU_MEMORY=8Gi
      (auto engine: beclab/fedirz-faster-whisper-server:0.6.0-rc.3-cuda)
    - VAD (Silero, CPU):   MODEL_SOURCE=hf://snakers4/silero-vad
      MODEL_NAME=silero-v5  MODEL_MODE=vad  AUDIO_REQUIRED_GPU_MEMORY=0
      (CPU-only: no gpumem/gpu-inject; auto engine: beclab/voice-engine-silero — TBB)
    - Diarize (pyannote, GPU): MODEL_SOURCE=hf://pyannote/community-1
      MODEL_NAME=pyannote-community-1  MODEL_MODE=diar
      AUDIO_REQUIRED_GPU_MEMORY=4Gi
      (auto engine: beclab/voice-engine-pyannote — TBB)

  upgradeDescription: |
    v1.0.0: initial generic audio-model base (DEV name audiolabwv3). llm-init
    (download-only) + clone-selected engine container. Model/mode/engine are
    chosen at clone (no baked-in default); GPU is optional (set GPU memory to 0 for
    CPU-only modes such as VAD).

  developer: beclab
  website: https://github.com/beclab/llm-init
  sourceCode: https://github.com/beclab/llm-init
  submitter: Olares
  locale:
    - en-US
    - zh-CN
  license:
    - text: MIT
      url: https://github.com/beclab/llm-init

  accelerator:
    - mode: nvidia
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"
      requiredGPUMemory: "-1"
      limitedGPUMemory: "-1"
    - mode: nvidia-gb10
      limitedCpu: "-1"
      requiredCpu: "-1"
      requiredDisk: 50Mi
      limitedDisk: 500Gi
      limitedMemory: "-1"
      requiredMemory: "-1"

  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  appCache: true   # sentinel/model_path live under appCache/llm-init-run/<release>
  appCommon: true
options:
  apiTimeout: 0
  LLMGatewaySupported: true
  allowMultipleInstall: true
  shared: true
  templateOnly: true
  dependencies:
    - name: olares
      version: '>=1.12.6-0'
      type: system
envs:
  # CLONE FORM = required-without-default envs only. We keep just the 4 the USER
  # should decide: MODEL_SOURCE / MODEL_NAME / MODEL_MODE /
  # AUDIO_REQUIRED_GPU_MEMORY. The engine (ENGINE_IMAGE/PORT/HEALTH) is a BLACK BOX
  # auto-derived from MODEL_MODE in templates/engine.yaml; those stay as
  # OPTIONAL post-install overrides (required:false, no default -> hidden at clone,
  # still editable in app settings). Example value sets are in spec.fullDescription.
  - envName: MODEL_SOURCE        # llm-init download spec. STT: hf://Systran/faster-whisper-large-v3 | VAD: hf://snakers4/silero-vad | Diar: hf://pyannote/community-1
    required: true
    type: string
    editable: true
    applyOnChange: true
  - envName: MODEL_NAME          # advertised id / OpenAI `model`. STT: Systran/faster-whisper-large-v3 | VAD: silero-v5 | Diar: pyannote-community-1
    required: true
    type: string
    editable: true
    applyOnChange: true
  - envName: MODEL_MODE          # the single model classifier; pick one, no default. Engine image is auto-derived from this AND it is the gateway routing key.
    # Full mode set is RESERVED (aligns with voice platform §1.3) and mirrors the
    # gateway's mode enum (migration 000018). Only stt / vad / diar are wired for
    # 1.12.7; the rest map to a voice-engine-<mode>:notbuilt placeholder until their
    # engine is built (see templates/engine.yaml).
    required: true
    type: string
    editable: true
    applyOnChange: true
    options:
    - title: STT (offline)
      value: stt
    - title: STT (streaming)
      value: stt_stream
    - title: TTS
      value: tts
    - title: TTS (voice clone)
      value: tts_clone
    - title: TTS (dialogue)
      value: tts_dialogue
    - title: VAD
      value: vad
    - title: Diarize
      value: diar
    - title: Diarize (streaming)
      value: diar_stream
    - title: Translate
      value: translate
    - title: Enhance
      value: enhance
    - title: Embed
      value: embed
    - title: Align
      value: align
    - title: Audio-LLM
      value: audio_llm
    - title: Audio-S2S
      value: audio_s2s
    - title: Sound-FX
      value: sound_fx
  # --- engine internals: BLACK BOX, auto-derived from MODEL_MODE in
  # templates/engine.yaml. required:false + no default => NOT shown on the clone
  # form, but editable in app settings as a post-install override (empty = mapped). ---
  - envName: ENGINE_IMAGE        # override only; empty = mode-mapped converted image (beclab/, no latest)
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: ENGINE_PORT         # override only; empty = mode-mapped port
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: ENGINE_ARGS         # extra args appended to the engine container (engine-specific)
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: ""
  - envName: ENGINE_HEALTH_PATH  # override only; empty = mode-mapped readiness path
    required: false
    type: string
    editable: true
    applyOnChange: true
  - envName: LOG_LEVEL           # single-select: debug | info | warn | error
    required: false
    type: string
    editable: true
    applyOnChange: true
    default: "debug"
    options:
    - title: Debug
      value: debug
    - title: Info
      value: info
    - title: Warn
      value: warn
    - title: Error
      value: error
  - envName: HF_ENDPOINT
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_SERVICE
  - envName: HF_TOKEN
    required: false
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_HUGGINGFACE_TOKEN
  - envName: AUDIO_CPU_REQUEST     # default: 500m
    required: true
    default: "500m"
    type: string
    editable: true
    applyOnChange: true
  - envName: AUDIO_MEMORY_REQUEST  # default: 2Gi
    required: true
    default: "2Gi"
    type: string
    editable: true
    applyOnChange: true
  - envName: AUDIO_CPU_LIMIT       # default: 6
    required: true
    default: "6"
    type: string
    editable: true
    applyOnChange: true
  - envName: AUDIO_MEMORY_LIMIT    # default: 18Gi
    required: true
    default: "18Gi"
    type: string
    editable: true
    applyOnChange: true
  - envName: AUDIO_REQUIRED_GPU_MEMORY  # no default -> prompted at clone. "0" = CPU-only (no gpumem/gpu-inject, e.g. VAD); STT: 8Gi, Diar: 4Gi. 8Gi/8192/8192Mi -> bare-MiB gpumem; gb10: pod memory
    required: true
    type: string
    editable: true
    applyOnChange: true
