version: '3.8'

services:
  rapids-playbook:
    image: nvcr.io/nvidia/rapidsai/notebooks:25.10-cuda13-py3.13
    pull_policy: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: 1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    ports:
      - "8888:8888"
      - "8787:8787"
      - "8786:8786"
      - "8501:8501"
      - "8050:8050"
    volumes:
      - ${PARENT_DIR}:/home/rapids/notebooks/playbook
    command: /bin/bash -c "echo '开始执行setup脚本...' && bash /home/rapids/notebooks/playbook/setup/setup_playbook.sh && tail -f /dev/null"
    tty: true
    stdin_open: true
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PARENT_DIR=${PARENT_DIR}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1m

  mirror-pull-checker:
    image: alpine:latest
    command: sh -c "echo '正在验证镜像拉取...' && docker pull nvcr.io/nvidia/rapidsai/notebooks:25.10-cuda13-py3.13"
    depends_on:
      - rapids-playbook